<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruang Kode Java &amp; Python</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: peta bab di sisi kiri (laci di ponsel) + satu kolom materi; kode Java dan Python berdampingan */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#152033; --muted:#556175; --line:#D6DDE7;
  --java:#B0441B; --java-soft:#F7E4DA; --py:#255DA2; --py-soft:#DFE9F7; --hl:#FFE39A; --hl-ink:#3A2C00;
  --ok:#22744A; --ok-soft:#DCF0E3; --bad:#B42318; --bad-soft:#FBE2DE;
  --code-bg:#101A28; --code-fg:#D9E3EF; --c-kw:#F2A65A; --c-str:#9FD79A; --c-num:#F5D76E; --c-com:#7F8EA5; --c-type:#82BAF5; --c-fn:#E3B6F5;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
code,pre,.mini,.tok,.var,.cell,.frame,svg text{font-variant-ligatures:none}
*{font-variant-ligatures:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#131B27; --sunk:#1A2432; --ink:#E4EAF2; --muted:#98A5B7; --line:#273347;
  --java:#F0915F; --java-soft:#3A2419; --py:#79ACEE; --py-soft:#172940; --hl:#5C4810; --hl-ink:#FFF2C9;
  --ok:#62C98F; --ok-soft:#133022; --bad:#F28B7B; --bad-soft:#3B1A16; --code-bg:#090F17; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#131B27; --sunk:#1A2432; --ink:#E4EAF2; --muted:#98A5B7; --line:#273347;
  --java:#F0915F; --java-soft:#3A2419; --py:#79ACEE; --py-soft:#172940; --hl:#5C4810; --hl-ink:#FFF2C9;
  --ok:#62C98F; --ok-soft:#133022; --bad:#F28B7B; --bad-soft:#3B1A16; --code-bg:#090F17; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4.2vw,2.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--py)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:5px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--py);outline-offset:2px}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* kerangka */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);
  padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font:700 .82rem/1 var(--f-mono);
  background:linear-gradient(135deg,var(--java) 0 50%,var(--py) 50% 100%);color:#fff;flex:none}
.brand b{font-family:var(--f-display);font-size:1.12rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .eyebrow{padding:0 10px 6px}
.nav a{display:flex;align-items:baseline;gap:10px;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.93rem;line-height:1.3}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--py-soft);color:var(--ink);font-weight:700}
.nav .num{font:600 .76rem var(--f-mono);color:var(--muted);min-width:1.6em}
.nav .done-mark{margin-left:auto;color:var(--ok);font-size:.8rem}
.nav-progress{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:.84rem;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--java),var(--py));width:0;transition:width .4s}
.topbar{display:none}
main{min-width:0;padding-block:34px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;transform:translateX(-102%);transition:transform .25s;
    padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.open{display:block;position:fixed;inset:0;z-index:35;background:rgba(10,15,25,.4)}
  main{padding-block:22px 70px}
}

/* tombol & input */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:.9rem;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.j{border-color:var(--java);color:var(--java)}
.btn.p{border-color:var(--py);color:var(--py)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;width:6.5em;font-size:.92rem}
select.inp{width:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* beranda */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:56ch;margin-top:14px}
.hero .cta{margin-top:20px}
.split-card{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.split-card .lbl{display:flex;font:700 .72rem var(--f-mono);letter-spacing:.06em}
.split-card .lbl span{flex:1;padding:7px 12px}
.split-card .lbl .lj{background:var(--java-soft);color:var(--java)}
.split-card .lbl .lp{background:var(--py-soft);color:var(--py)}
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lvl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lvl h3{display:flex;align-items:baseline;gap:8px}
.lvl h3 small{font:600 .74rem var(--f-mono);color:var(--muted)}
.lvl ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lvl a{display:flex;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.93rem}
.lvl a:hover{background:var(--sunk)}
.lvl a .num{font:600 .76rem var(--f-mono);color:var(--muted);min-width:1.6em;padding-top:.2em}
.lvl a.done{color:var(--muted)}
.lvl a.done::after{content:"✓";color:var(--ok);margin-left:auto}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.how div{border-top:3px solid var(--line);padding-top:10px;font-size:.93rem;color:var(--muted)}
.how b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1rem}

/* bab */
.ch-head{display:flex;flex-direction:column;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.j{border-color:transparent;background:var(--java-soft);color:var(--java)}
.tag.p{border-color:transparent;background:var(--py-soft);color:var(--py)}
.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.prose p{font-size:1.03rem}
.section{display:flex;flex-direction:column;gap:14px}
.points{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.points li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.95rem}
.tip{border-left:4px solid var(--java);background:var(--surface);padding:12px 16px;border-radius:0 10px 10px 0;font-size:.97rem}
.tip b{font-family:var(--f-display)}

.viz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.viz-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.viz-head p{color:var(--muted);font-size:.9rem}
.stage{min-height:60px;min-width:0;overflow-x:auto}
.note{font-size:.95rem;min-height:1.6em;background:var(--sunk);border-radius:8px;padding:8px 12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cnt{font:600 .78rem var(--f-mono);color:var(--muted);margin-left:auto}

/* kode */
.code-tools{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.codes.only-java .pane.python,.codes.only-python .pane.java{display:none}
.codes.only-java,.codes.only-python{grid-template-columns:minmax(0,1fr)}
.pane{border-radius:12px;overflow:hidden;background:var(--code-bg);min-width:0;display:flex;flex-direction:column}
.pane-h{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font:700 .74rem var(--f-mono);letter-spacing:.06em;color:var(--code-fg)}
.pane.java .pane-h{border-top:3px solid var(--java)}
.pane.python .pane-h{border-top:3px solid var(--py)}
.copy{background:none;border:1px solid #33435A;color:var(--code-fg);border-radius:6px;font:600 .7rem var(--f-mono);padding:3px 8px;cursor:pointer}
pre.code{margin:0;padding:12px 14px 16px;overflow-x:auto;font:13px/1.6 var(--f-mono);color:var(--code-fg);tab-size:4;flex:1}
.out{margin:0;border-top:1px dashed #33435A;padding:10px 14px;font:12.5px/1.55 var(--f-mono);color:var(--c-str);white-space:pre-wrap}
.out::before{content:"keluaran";display:block;color:var(--c-com);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.k{color:var(--c-kw)} .s{color:var(--c-str)} .n{color:var(--c-num)} .c{color:var(--c-com);font-style:italic} .t{color:var(--c-type)} .f{color:var(--c-fn)}

table.cmp{width:100%;border-collapse:collapse;font-size:.93rem;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.cmp th,.cmp td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp tr:last-child td{border-bottom:0}
.cmp th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp th.j{color:var(--java)} .cmp th.p{color:var(--py)}
.cmp td:first-child{font-weight:700;width:24%}

.terms{display:flex;flex-wrap:wrap;gap:8px}
.term-chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.88rem;cursor:pointer}
.term-chip:hover{border-color:var(--py);color:var(--py)}

.quiz{display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:.94rem}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:.92rem;color:var(--muted)}

.ch-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:20px}
.donebox{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.donebox input{width:18px;height:18px;accent-color:var(--ok)}

/* glosarium */
.gl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gl-search{flex:1 1 260px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gl.flash{border-color:var(--py);box-shadow:0 0 0 3px var(--py-soft)}
.gl h3{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.gl h3 small{font:400 .8rem var(--f-body);color:var(--muted);font-style:italic}
.gl .cat{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.gl p{font-size:.95rem}
.gl pre{margin:4px 0 0;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:8px 10px;font:12.5px/1.5 var(--f-mono);overflow-x:auto}
.gl .seen{font-size:.82rem;color:var(--muted)}
.gl .seen a{margin-right:6px}
.empty{color:var(--muted);padding:20px 0}

/* elemen visualisasi */
.lane{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.lane-name{font:700 .74rem var(--f-mono);width:64px;flex:none}
.lane-name.j{color:var(--java)} .lane-name.p{color:var(--py)}
.node{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.84rem;background:var(--bg);opacity:.45;transition:all .25s}
.node.on{opacity:1}
.node.cur{background:var(--hl);color:var(--hl-ink);border-color:transparent;opacity:1}
.arrow{color:var(--muted);font-size:.9rem}
.cells{display:flex;gap:4px;flex-wrap:nowrap;padding:18px 2px 4px}
.cell{position:relative;min-width:46px;height:46px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font:600 .95rem var(--f-mono);background:var(--bg);transition:background .25s,border-color .25s}
.cell .ix{position:absolute;top:-17px;left:0;right:0;text-align:center;font:400 .68rem var(--f-mono);color:var(--muted)}
.cell.hl{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.cell.new{border-color:var(--ok);background:var(--ok-soft)}
.cell.moved{border-color:var(--py);border-style:dashed}
.cell.dim{opacity:.35}
.cell.empty{color:var(--muted);border-style:dotted}
.cell.bad{border-color:var(--bad);background:var(--bad-soft)}
.console{background:var(--code-bg);color:var(--c-str);font:12.5px/1.55 var(--f-mono);border-radius:8px;padding:10px 12px;white-space:pre-wrap;min-height:2.6em}
.console:empty::before{content:"(belum ada keluaran)";color:var(--c-com)}
.vars{display:flex;flex-wrap:wrap;gap:8px}
.var{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:.84rem var(--f-mono);background:var(--bg)}
.var b{color:var(--py)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini{font:12.5px/1.65 var(--f-mono);background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.mini .on{background:var(--hl);color:var(--hl-ink);border-radius:3px}
.frames{display:flex;flex-direction:column-reverse;gap:6px}
.frame{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg);font:.86rem var(--f-mono);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.frame b{font-family:var(--f-body)}
.frame.top{border-color:var(--py);background:var(--py-soft)}
.frame.ret{border-color:var(--ok);background:var(--ok-soft)}
.flow{display:flex;flex-direction:column;gap:6px}
.dec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:.9rem}
.dec code{background:none;padding:0}
.dec .res{margin-left:auto;font:700 .78rem var(--f-mono)}
.dec.t{border-color:var(--ok);background:var(--ok-soft)} .dec.t .res{color:var(--ok)}
.dec.f .res{color:var(--bad)}
.dec.skip{opacity:.4}
.big{font:800 2.2rem var(--f-display)}
.tt{width:100%;border-collapse:collapse;font-size:.88rem}
.tt td,.tt th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tt code{background:none;padding:0}
.val-t{color:var(--ok);font-weight:700} .val-f{color:var(--bad);font-weight:700}
.toggle{border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;background:var(--bg);font-family:var(--f-mono);font-size:.86rem}
.die{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:7px;border:1px solid var(--line);font:700 1rem var(--f-mono);background:var(--bg)}
.die.six{background:var(--ok-soft);border-color:var(--ok)}
.tok{display:inline-block;padding:2px 7px;margin:2px;border-radius:5px;border:1px solid var(--line);font:.86rem var(--f-mono)}
.tok.used{opacity:.4}
.tok.cur{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.objs{display:flex;flex-wrap:wrap;gap:10px}
.obj{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:.88rem;display:flex;flex-direction:column;gap:6px;min-width:150px}
.obj .nm{font:700 .82rem var(--f-mono);color:var(--py)}
.blueprint{border:2px dashed var(--py);border-radius:10px;padding:10px 12px;font:.84rem var(--f-mono);background:var(--py-soft)}
.tree-cls{display:flex;flex-direction:column;align-items:center;gap:10px}
.tree-cls .kids{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cls{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-size:.88rem}
.cls.abs{border-style:dashed;cursor:default}
.cls[aria-pressed="true"]{border-color:var(--py);background:var(--py-soft)}
.stackq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
.stk{display:flex;flex-direction:column;gap:4px;min-height:200px;justify-content:flex-end;border:2px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:6px;max-width:180px}
.stk .cell,.que .cell{min-width:0;width:100%}
.que{display:flex;gap:4px;border-block:2px solid var(--line);padding:6px;min-height:62px;align-items:center;overflow-x:auto}
.que .cell{width:52px;flex:none}
.ll{display:flex;align-items:center;gap:0;padding:10px 2px;flex-wrap:nowrap}

  'Setiap pemanggilan method mendapat ruang variabelnya sendiri di <b>call stack</b>. Variabel di dalam method hanya hidup di sana. Inilah yang disebut <b>scope</b>.',
  'Bab ini juga mengenalkan <b>objek</b> bawaan. <code>String</code> punya method seperti <code>length()</code> dan <code>toUpperCase()</code>. <code>Scanner</code> membaca masukan pengguna. Kelas <code>Math</code> menyediakan rumus siap pakai. Suplemen 3G buku ini memakai objek <code>DrawingPanel</code> untuk menggambar.'
 ],

 body:[
  'Percabangan membuat program memilih. <code>if</code> menjalankan blok hanya bila kondisinya benar. Rantai <code>if / else if / else</code> (Python: <code>if / elif / else</code>) dicek dari atas. Begitu satu kondisi benar, sisanya dilewati.',
  'Kondisi dibangun dari <b>operator relasional</b>: <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>, <code>==</code>, <code>!=</code>. Urutan kondisi penting. Jika <code>skor &gt;= 70</code> dicek lebih dulu, skor 95 akan ikut mendapat C.',
  'Bab ini juga membahas <b>algoritma kumulatif</b>: menyiapkan variabel penampung (misalnya <code>total = 0</code>) di luar loop lalu menambahkannya sedikit demi sedikit di dalam loop. Pola ini dipakai untuk jumlah, rata-rata, nilai maksimum, dan sebagainya.'
 ],
 points:['Gunakan <code>if/else if</code> bila pilihan saling eksklusif. Gunakan beberapa <code>if</code> terpisah bila boleh lebih dari satu.','Di Java, bandingkan isi String dengan <code>.equals()</code>, bukan <code>==</code>.','Variabel penampung kumulatif dideklarasikan di luar loop.','Method boleh punya beberapa <code>return</code> di cabang berbeda.'],

 java:`public class Nilai {
    public static String huruf(int skor) {

{n:5, lvl:'Dasar', t:'Logika & Perulangan Tak Pasti', en:'Program Logic and Indefinite Loops', py:'Logika program dan perulangan tak pasti', viz:'boolean',

 body:[
  '<b>Perulangan tak pasti</b> dipakai ketika jumlah putaran belum diketahui, misalnya "ulangi sampai pengguna mengetik 0". Bentuknya <code>while (kondisi)</code>. Pastikan sesuatu di dalam loop mengubah kondisi, atau loop akan berjalan selamanya.',

 body:[
  'Program nyata membaca data dari file, bukan hanya dari keyboard. Di Java, <code>Scanner</code> yang sama bisa diarahkan ke <code>new File("nilai.txt")</code>. Di Python, gunakan <code>open()</code> di dalam blok <code>with</code> agar file otomatis ditutup.',
  'Ada dua cara membaca. <b>Berbasis token</b>: membaca potongan yang dipisah spasi (<code>next()</code>, <code>nextInt()</code>). <b>Berbasis baris</b>: membaca satu baris utuh lalu memecahnya. Pola paling aman adalah membaca per baris, lalu memecah baris itu menjadi token.',
  'Membuka file bisa gagal, misalnya karena file tidak ada. Java memaksa kamu menangani kemungkinan itu (<code>throws FileNotFoundException</code>), karena ini termasuk <b>checked exception</b>. Python melempar <code>FileNotFoundError</code> yang bisa ditangkap dengan <code>try/except</code>.'
 ],
 points:['<code>hasNextInt()</code> mengecek dulu sebelum <code>nextInt()</code>, supaya tidak crash.','<code>str.split()</code> memecah string berdasarkan spasi.','Menulis file: <code>PrintStream</code> di Java, <code>open(nama, "w")</code> di Python.','Isi contoh <code>nilai.txt</code>: dua baris, "Budi 85 90" dan "Sari 78 92".'],
 tip:'Buat file contoh kecil (3 sampai 5 baris) saat menguji. Setelah benar, baru coba file besar.',
 java:`import java.io.*;
import java.util.*;

public class RataRata {
    public static void main(String[] args) throws FileNotFoundException {
        Scanner file = new Scanner(new File("nilai.txt"));
        while (file.hasNextLine()) {
            String baris = file.nextLine();      // "Budi 85 90"
            Scanner token = new Scanner(baris);
            String nama = token.next();
            int total = 0, n = 0;
            while (token.hasNextInt()) {
                total += token.nextInt();
                n++;
            }
            System.out.println(nama + ": " + (double) total / n);
        }
    }
}`,
 python:`def main():
    with open("nilai.txt") as file:
        for baris in file:                   # "Budi 85 90"
            token = baris.split()
            nama = token[0]
            total = 0
            for t in token[1:]:
                total += int(t)
            print(nama + ":", total / (len(token) - 1))

main()`,

{n:7, lvl:'Menengah', t:'Array', en:'Arrays', py:'List', viz:'array',
 vizT:'Indeks dan referensi', vizD:'Akses elemen lewat indeks, lalu lihat apa yang terjadi saat dua variabel menunjuk array yang sama.',
 body:[
  '<b>Array</b> menyimpan banyak nilai bertipe sama di bawah satu nama. Setiap elemen punya <b>indeks</b> mulai dari 0. Array 5 elemen punya indeks 0 sampai 4. Mengakses indeks 5 menghasilkan <code>ArrayIndexOutOfBoundsException</code>. Python memakai <b>list</b> yang mirip, tapi ukurannya bisa berubah.',
  'Pola paling umum adalah <b>traversal</b>: mengunjungi setiap elemen dengan loop untuk mencari maksimum, menjumlah, atau menghitung. For-each (<code>for (int x : a)</code> / <code>for x in a</code>) cocok bila kamu tidak butuh indeksnya.',
  'Array dan list adalah objek, jadi variabelnya menyimpan <b>referensi</b> (alamat), bukan isinya. <code>b = a</code> tidak menyalin isi. Keduanya menunjuk array yang sama, sehingga perubahan lewat <code>b</code> juga terlihat di <code>a</code>. Hal yang sama berlaku saat array dikirim sebagai parameter.'
 ],
 points:['Ukuran array Java tetap setelah dibuat: <code>new int[5]</code>.','Python mengizinkan indeks negatif: <code>a[-1]</code> adalah elemen terakhir.','Cetak array Java dengan <code>Arrays.toString(a)</code>, bukan <code>println(a)</code>.','Array 2D: <code>int[][] m = new int[3][4];</code>'],
 tip:'Batas loop yang benar hampir selalu <code>i &lt; a.length</code>, bukan <code>&lt;=</code>. Kesalahan satu langkah ini disebut off-by-one.',
 java:`import java.util.Arrays;

public class Larik {
    public static void main(String[] args) {
        int[] a = {3, 8, 1, 9, 4};
        System.out.println(a[0]);         // 3
        System.out.println(a.length);     // 5

        int maks = a[0];
        for (int x : a) {                 // for-each
            if (x > maks) {
                maks = x;
            }
        }
        System.out.println("Maks: " + maks);

        int[] b = a;      // b menunjuk array yang SAMA
        b[0] = 99;
        System.out.println(Arrays.toString(a));
    }
}`,
 python:`def main():
    a = [3, 8, 1, 9, 4]

            maks = x
    print("Maks:", maks)

    b = a             # b menunjuk list yang SAMA
    b[0] = 99
    print(a)

{n:8, lvl:'Menengah', t:'Kelas & Objek', en:'Classes', py:'Kelas dan objek', viz:'objects',
 vizT:'Satu cetak biru, banyak objek', vizD:'Buat beberapa objek Titik dan ubah masing-masing secara terpisah.',
 body:[
  '<b>Kelas</b> adalah cetak biru. <b>Objek</b> adalah benda nyata yang dibuat dari cetak biru itu. Kelas <code>Titik</code> mendefinisikan bahwa setiap titik punya <code>x</code> dan <code>y</code> (disebut <b>field</b>) serta bisa <code>geser()</code> (disebut method instance).',
  '<b>Konstruktor</b> dijalankan saat objek dibuat dengan <code>new Titik(3, 4)</code> di Java atau <code>Titik(3, 4)</code> di Python. Tugasnya mengisi nilai awal field. Kata <code>this</code> (Java) dan <code>self</code> (Python) merujuk ke objek yang sedang dipakai.',
  '<b>Enkapsulasi</b> berarti menyembunyikan field (<code>private</code>) dan hanya membuka method tertentu. Dengan begitu objek bisa menjaga datanya tetap valid. Method <code>toString()</code> / <code>__str__</code> menentukan bagaimana objek tampil saat dicetak.'
 ],
 points:['Setiap objek punya salinan field sendiri.','Python tidak punya <code>private</code>. Konvensinya: awali nama dengan <code>_</code>.','Java memberi nilai default (0, null). Python mewajibkan field dibuat di <code>__init__</code>.','Method yang mengubah objek disebut mutator, yang hanya membaca disebut accessor.'],
 tip:'Rancang kelas dari kata benda dalam soal (Titik, Akun, Mahasiswa). Kata kerjanya menjadi method.',
 java:`public class Titik {
    private int x, y;                     // field (dienkapsulasi)

    public Titik(int x, int y) {          // konstruktor
        this.x = x;
        this.y = y;
    }

    public void geser(int dx, int dy) {
        x += dx;
        y += dy;
    }

    public double jarakKeAsal() {
        return Math.sqrt(x * x + y * y);
    }

    public String toString() {
        return "(" + x + ", " + y + ")";
    }

    public static void main(String[] args) {
        Titik p = new Titik(3, 4);
        System.out.println(p + " jarak " + p.jarakKeAsal());
        p.geser(1, -1);
        System.out.println(p);
    }
}`,
 python:`import math

class Titik:
    def __init__(self, x, y):         # konstruktor
        self._x = x                    # _ = "privat" (konvensi)
        self._y = y

    def geser(self, dx, dy):
        self._x += dx
        self._y += dy

    def jarak_ke_asal(self):
        return math.sqrt(self._x ** 2 + self._y ** 2)

    def __str__(self):
        return f"({self._x}, {self._y})"

p = Titik(3, 4)
print(p, "jarak", p.jarak_ke_asal())
p.geser(1, -1)
print(p)`,
 out:`(3, 4) jarak 5.0
(4, 3)`,

{n:9, lvl:'Menengah', t:'Pewarisan & Interface', en:'Inheritance and Interfaces', py:'Pewarisan', viz:'inherit',
 vizT:'Hierarki kelas dan polimorfisme', vizD:'Pilih kelas anak untuk melihat method yang diwarisi dan yang di-override.',
 body:[
  '<b>Pewarisan</b> membuat kelas baru dari kelas yang sudah ada. <code>Kucing extends Hewan</code> berarti Kucing otomatis punya semua field dan method Hewan. Kelas induk disebut <b>superclass</b>, kelas anak disebut <b>subclass</b>. Hubungannya selalu "adalah": kucing adalah hewan.',
  'Subclass boleh <b>meng-override</b> method induk untuk mengganti perilakunya. Karena itu, variabel bertipe <code>Hewan</code> bisa menunjuk Kucing atau Anjing, dan <code>h.suara()</code> menjalankan versi milik objek sebenarnya. Inilah <b>polimorfisme</b>.',
  '<b>Interface</b> adalah kontrak berisi daftar method tanpa isi. Kelas yang meng-<i>implement</i>-nya wajib menyediakan semua method itu. <b>Kelas abstrak</b> berada di tengah: boleh punya method lengkap dan method abstrak, tapi tidak bisa dibuat objeknya langsung. Lab "Critters" di buku ini melatih semua konsep tersebut.'
 ],
 points:['<code>super(...)</code> memanggil konstruktor induk.','Java hanya mengizinkan satu superclass, tapi banyak interface.','Python mengizinkan banyak kelas induk sekaligus.','Override: nama dan parameter sama. Overload: nama sama, parameter berbeda.'],
 tip:'Jangan memakai pewarisan hanya untuk berbagi kode. Pakai hanya bila hubungan "adalah" benar-benar masuk akal.',
 java:`interface Bersuara {
    String suara();
}

abstract class Hewan implements Bersuara {
    protected String nama;
    public Hewan(String nama) { this.nama = nama; }
    public String kenalkan() {
        return nama + " berkata " + suara();
    }
}

class Kucing extends Hewan {
    public Kucing(String n) { super(n); }
    public String suara() { return "Meong"; }
}

class Anjing extends Hewan {
    public Anjing(String n) { super(n); }
    public String suara() { return "Guk"; }
}

public class Kebun {
    public static void main(String[] args) {
        Hewan[] kebun = { new Kucing("Tom"), new Anjing("Spike") };
        for (Hewan h : kebun) {
            System.out.println(h.kenalkan());   // polimorfisme
        }
    }
}`,
 python:`from abc import ABC, abstractmethod

class Hewan(ABC):
    def __init__(self, nama):
        self.nama = nama

    @abstractmethod
    def suara(self):            # wajib di-override
        pass

    def kenalkan(self):
        return f"{self.nama} berkata {self.suara()}"

class Kucing(Hewan):
    def suara(self):
        return "Meong"

class Anjing(Hewan):
    def suara(self):
        return "Guk"

kebun = [Kucing("Tom"), Anjing("Spike")]
for h in kebun:
    print(h.kenalkan())         # polimorfisme`,
 out:`Tom berkata Meong
Spike berkata Guk`,

  '<b>Rekursi</b> adalah method yang memanggil dirinya sendiri untuk menyelesaikan versi masalah yang lebih kecil. <code>faktorial(4)</code> sama dengan <code>4 * faktorial(3)</code>, dan seterusnya sampai <code>faktorial(1)</code>.',
  'Setiap rekursi butuh dua bagian. <b>Base case</b> adalah kasus paling kecil yang langsung dijawab tanpa rekursi. <b>Recursive case</b> memecah masalah dan memanggil diri sendiri dengan input yang mendekati base case. Tanpa base case, pemanggilan tidak pernah berhenti dan program kehabisan memori stack.',
  'Rekursi sangat cocok untuk struktur yang bersifat rekursif: folder di dalam folder, pohon, dan fraktal. Bab ini juga mengenalkan <b>backtracking</b>: mencoba satu pilihan, dan bila buntu, mundur lalu mencoba pilihan lain.'
 ],
 points:['Percayai pemanggilan rekursif: anggap ia sudah benar untuk input yang lebih kecil.','Setiap pemanggilan punya variabel sendiri di call stack.','Java: <code>StackOverflowError</code>. Python: <code>RecursionError</code> (batas sekitar 1000).','Sebagian rekursi bisa ditulis ulang dengan loop.'],
 tip:'Tulis base case lebih dulu. Lalu tanyakan: "jika aku sudah punya jawaban untuk n-1, bagaimana mendapat jawaban untuk n?"',
 java:`public class Rekursi {
    public static int faktorial(int n) {
        if (n <= 1) {
            return 1;                     // base case
        }
        return n * faktorial(n - 1);      // recursive case
    }

    public static String balik(String s) {
        if (s.length() <= 1) {
            return s;
        }
        return balik(s.substring(1)) + s.charAt(0);
    }

    public static void main(String[] args) {
        System.out.println(faktorial(4));
        System.out.println(balik("java"));
    }
}`,

 body:[
  '<b>Pencarian linear</b> memeriksa elemen satu per satu dari depan. Mudah, tapi untuk sejuta data bisa butuh sejuta langkah. <b>Binary search</b> jauh lebih cepat: lihat elemen tengah, lalu buang separuh data yang pasti tidak berisi target. Syaratnya, data harus sudah terurut.',
  'Kecepatan algoritma diukur dengan notasi <b>Big-O</b>, yaitu bagaimana jumlah langkah tumbuh seiring jumlah data <i>n</i>. Linear search O(n), binary search O(log n). Untuk sejuta data, log₂ hanya sekitar 20 langkah.',
  '<b>Selection sort</b> mencari elemen terkecil lalu menukarnya ke depan, diulang untuk setiap posisi. Hasilnya O(n²). <b>Merge sort</b> membagi data menjadi dua, mengurutkan masing-masing secara rekursif, lalu menggabungkannya, dengan hasil O(n log n). Dalam praktik, pakai pengurutan bawaan bahasa.'
 ],
 points:['Binary search pada data acak memberi jawaban yang salah.','O(1) konstan, O(log n) logaritmik, O(n) linear, O(n²) kuadratik.','<code>Arrays.sort</code> dan <code>sorted()</code> sudah sangat dioptimalkan.','Python bisa menukar tanpa variabel bantu: <code>a, b = b, a</code>.'],
 tip:'Hitung langkah dengan tangan untuk 8 data, lalu 16 data. Pola pertumbuhannya akan memperlihatkan Big-O-nya.',
 java:`public class Cari {
    // binary search: data HARUS sudah terurut
    public static int cariBiner(int[] a, int target) {
        int kiri = 0, kanan = a.length - 1;
        while (kiri <= kanan) {
            int tengah = (kiri + kanan) / 2;
            if (a[tengah] == target) {
                return tengah;
            } else if (a[tengah] < target) {
                kiri = tengah + 1;
            } else {
                kanan = tengah - 1;
            }
        }
        return -1;   // tidak ditemukan
    }

    public static void selectionSort(int[] a) {
        for (int i = 0; i < a.length - 1; i++) {
            int min = i;
            for (int j = i + 1; j < a.length; j++) {
                if (a[j] < a[min]) {
                    min = j;
                }
            }
            int tmp = a[i];      // tukar
            a[i] = a[min];
            a[min] = tmp;
        }
    }
}`,

def selection_sort(a):

 points:['Field selalu <code>private</code>. Pengguna tidak boleh mengubah <code>size</code> langsung.','Slot di atas size berisi sisa data yang tidak dianggap ada.','Dokumentasikan precondition dan postcondition setiap method.','Python: method khusus <code>__len__</code> dan <code>__getitem__</code> membuat objekmu bisa dipakai seperti list.'],
 tip:'Setelah menulis tiap method, tulis tes kecil untuk kondisi kosong, satu elemen, dan penuh. Di tiga kondisi itulah bug koleksi biasanya bersembunyi.',
 java:`import java.util.Arrays;

public class ArrayIntList {
    private int[] elementData;   // array internal
    private int size;            // jumlah slot terpakai

    public ArrayIntList() {
        elementData = new int[4];
        size = 0;
    }

    public void add(int nilai) {
        if (size == elementData.length) {         // penuh?
            elementData = Arrays.copyOf(elementData, size * 2);
        }
        elementData[size] = nilai;
        size++;
    }

    public int get(int i) {
        if (i < 0 || i >= size) {                 // precondition
            throw new IndexOutOfBoundsException("indeks: " + i);
        }
        return elementData[i];
    }

    public int size() {
        return size;
    }
}`,
 python:`class ArrayIntList:
    def __init__(self):
        self._data = [0] * 4     # "array" internal
        self._size = 0           # jumlah slot terpakai

    def add(self, nilai):
        if self._size == len(self._data):          # penuh?
            self._data = self._data + [0] * len(self._data)
        self._data[self._size] = nilai
        self._size += 1

    def get(self, i):
        if i < 0 or i >= self._size:               # precondition
            raise IndexError(f"indeks: {i}")
        return self._data[i]

    def __len__(self):
        return self._size`,

 java:`class ListNode {

public class LinkedIntList {
    private ListNode front;   // null bila kosong

    public void addFirst(int nilai) {

    }

    public void addLast(int nilai) {
        if (front == null) {

{n:17, lvl:'Lanjutan', t:'Pohon Biner', en:'Binary Trees', py:'Pohon biner', viz:'bst',
 vizT:'Binary search tree', vizD:'Sisipkan angka, lalu jalankan traversal pre-order, in-order, dan post-order.',
 body:[
  '<b>Pohon biner</b> adalah struktur bercabang. Setiap node punya paling banyak dua anak: kiri dan kanan. Node paling atas disebut <b>akar</b> (root), node tanpa anak disebut <b>daun</b> (leaf). Karena setiap anak juga merupakan pohon, hampir semua kode pohon ditulis secara rekursif.',
  '<b>Binary search tree</b> (BST) menambahkan aturan: semua nilai di kiri lebih kecil dari node, semua nilai di kanan lebih besar. Mencari nilai cukup menelusuri satu jalur dari akar, sehingga pada pohon seimbang hanya butuh O(log n) langkah.',
  'Ada tiga urutan <b>traversal</b> klasik. Pre-order: akar, kiri, kanan. In-order: kiri, akar, kanan. Post-order: kiri, kanan, akar. Pada BST, in-order selalu menghasilkan data terurut.'
 ],
 points:['Base case kode pohon hampir selalu <code>node == null</code>.','Pola <code>root = add(root, v)</code> membuat penyisipan rekursif menjadi rapi.','Memasukkan data yang sudah terurut ke BST membuatnya miring seperti linked list.','<code>TreeSet</code> dan <code>TreeMap</code> di Java memakai pohon seimbang.'],
 tip:'Untuk fungsi pohon apa pun, tanyakan: apa jawabannya untuk pohon kosong? Bagaimana menggabungkan jawaban subpohon kiri dan kanan?',
 java:`class IntTreeNode {
    int data;
    IntTreeNode left, right;
    IntTreeNode(int data) { this.data = data; }
}

public class BST {
    private IntTreeNode root;

    public void add(int v) {
        root = add(root, v);
    }

    private IntTreeNode add(IntTreeNode node, int v) {
        if (node == null) {
            return new IntTreeNode(v);       // tempat kosong ditemukan
        }
        if (v < node.data) {
            node.left = add(node.left, v);
        } else {
            node.right = add(node.right, v);
        }
        return node;
    }

    private void inOrder(IntTreeNode node) {  // kiri, akar, kanan
        if (node != null) {
            inOrder(node.left);
            System.out.print(node.data + " ");
            inOrder(node.right);
        }
    }
}`,
 python:`class TreeNode:
    def __init__(self, data):
        self.data = data
        self.left = None
        self.right = None

class BST:
    def __init__(self):
        self.root = None

    def add(self, v):
        self.root = self._add(self.root, v)

    def _add(self, node, v):
        if node is None:
            return TreeNode(v)               # tempat kosong ditemukan
        if v < node.data:
            node.left = self._add(node.left, v)
        else:
            node.right = self._add(node.right, v)
        return node

    def _in_order(self, node):              # kiri, akar, kanan
        if node is not None:
            self._in_order(node.left)
            print(node.data, end=" ")
            self._in_order(node.right)`,

  '<b>Hashing</b> adalah rahasia kecepatan HashMap dan dict. Sebuah fungsi hash mengubah kunci menjadi angka, lalu angka itu dipetakan ke indeks array yang disebut ember (bucket). Mencari kunci cukup menghitung hash-nya dan langsung melompat ke ember yang tepat, rata-rata O(1).',
  'Dua kunci berbeda bisa jatuh di ember yang sama. Ini disebut <b>collision</b>. Salah satu solusinya adalah <i>separate chaining</i>: setiap ember menyimpan daftar kecil. Agar daftar tetap pendek, tabel diperbesar ketika load factor (jumlah data dibagi jumlah ember) terlalu tinggi.',

 java:`import java.util.*;

 body:[
  'Pemrograman fungsional memandang program sebagai rangkaian fungsi yang mengubah data, bukan sebagai urutan perintah yang mengubah variabel. Fungsi bisa dikirim sebagai argumen, disimpan di variabel, dan dikembalikan dari fungsi lain. Fungsi seperti itu disebut <b>higher-order function</b>.',
  '<b>Lambda</b> adalah fungsi tanpa nama yang ditulis ringkas: <code>n -&gt; n * 2</code> di Java, <code>lambda n: n * 2</code> di Python. Tiga operasi utamanya: <b>filter</b> menyaring elemen, <b>map</b> mengubah setiap elemen, <b>reduce</b> menggabungkan semuanya menjadi satu nilai.',
  'Java 8 menghadirkan <b>Stream</b> untuk menulis pipeline ini secara berantai. Python punya <code>map</code>, <code>filter</code>, <code>functools.reduce</code>, dan yang paling populer, list comprehension. Gaya ini mendorong <b>fungsi murni</b> dan data <b>immutable</b>, sehingga kode lebih mudah diuji dan aman dijalankan paralel.'
 ],
 points:['Stream Java tidak mengubah list asal.','Method reference: <code>String::toUpperCase</code> sama dengan <code>s -&gt; s.toUpperCase()</code>.','Python lebih menyukai comprehension daripada map/filter dengan lambda.','Hindari efek samping (mencetak, mengubah variabel luar) di dalam lambda.'],
 tip:'Baca pipeline dari atas ke bawah seperti resep: "ambil yang genap, kuadratkan, jumlahkan". Jika kalimatnya jelas, kodenya pun jelas.',
 java:`import java.util.*;
import java.util.stream.*;

public class Fungsional {
    public static void main(String[] args) {
        List<Integer> angka = List.of(1, 2, 3, 4, 5, 6);

        int hasil = angka.stream()
                .filter(n -> n % 2 == 0)     // 2, 4, 6
                .map(n -> n * n)             // 4, 16, 36
                .reduce(0, Integer::sum);    // 56
        System.out.println(hasil);

        List<String> nama = List.of("budi", "ani", "sari");
        System.out.println(nama.stream()
                .map(String::toUpperCase)
                .collect(Collectors.toList()));
    }
}`,
