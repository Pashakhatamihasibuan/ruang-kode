      ['CREATE TABLE termasuk kelompok?',['DML','DDL','DCL'],1,'DDL mengatur struktur.']]},
  {k:'s',t:'Tipe data',nodes:['Data Types'],
   b:['Setiap kolom punya <b>tipe data</b> yang menentukan nilai apa yang boleh disimpan. Tipe yang paling umum: <code>INTEGER</code> untuk bilangan bulat, <code>DECIMAL(p,s)</code>/<code>NUMERIC</code> untuk angka pecahan yang presisi seperti uang, <code>REAL</code>/<code>FLOAT</code> untuk pecahan perkiraan, <code>VARCHAR(n)</code>/<code>TEXT</code> untuk teks, <code>DATE</code>, <code>TIME</code>, <code>TIMESTAMP</code> untuk waktu, dan <code>BOOLEAN</code>.',
      'Nama tipe sedikit berbeda antar database. PostgreSQL punya <code>SERIAL</code> dan <code>JSONB</code>, MySQL punya <code>TINYINT</code> dan <code>DATETIME</code>. Simulator di kursus ini mengikuti SQLite yang lebih longgar: tipe kolom memberi "afinitas", misalnya teks <code>\'42\'</code> yang dimasukkan ke kolom INTEGER otomatis disimpan sebagai angka.',
      '<code>NULL</code> bukan nol dan bukan teks kosong, melainkan tanda "nilainya tidak diketahui". Fungsi <code>typeof</code> dan <code>CAST</code> membantu melihat dan mengubah tipe.'],
   ex:[['Melihat tipe setiap nilai','SELECT typeof(42), typeof(3.14), typeof(\'teks\'), typeof(NULL);'],['Mengubah tipe dengan CAST','SELECT CAST(\'125\' AS INTEGER) + 5 AS angka,\n       CAST(9.99 AS INTEGER) AS dipotong,\n       CAST(2024 AS TEXT) || \'-10\' AS teks;'],['Tanggal disimpan sebagai teks berformat ISO','SELECT nama, bergabung FROM pelanggan WHERE bergabung >= \'2024-01-01\';']],
   task:{q:'Tampilkan nama produk dan harganya dalam ribuan (harga dibagi 1000, diubah menjadi INTEGER) dengan nama kolom ribu.',a:'SELECT nama, CAST(harga / 1000 AS INTEGER) AS ribu FROM produk;'},
   pts:['Pilih tipe sekecil mungkin yang cukup.','Uang: DECIMAL atau INTEGER dalam satuan terkecil, bukan FLOAT.','Tanggal ditulis format ISO: YYYY-MM-DD.','NULL = tidak diketahui, bukan 0.'],
   q:[['Tipe paling tepat untuk menyimpan harga Rp85.000,50?',['FLOAT','DECIMAL(12,2)','TEXT'],1,'DECIMAL presisi untuk uang.'],
      ['Apakah NULL sama dengan 0?',['Ya','Tidak, NULL berarti tidak diketahui','Hanya di kolom angka'],1,'NULL adalah ketiadaan nilai.']]},
  {k:'s',t:'Operator',nodes:['Operators'],
   b:['SQL punya operator <b>aritmetika</b> (<code>+ - * / %</code>), <b>perbandingan</b> (<code>= &lt;&gt; != &lt; &gt; &lt;= &gt;=</code>), <b>logika</b> (<code>AND</code>, <code>OR</code>, <code>NOT</code>), dan penyambung teks <code>||</code> (di MySQL memakai fungsi CONCAT).',
      'Ada juga operator khusus yang sangat sering dipakai: <code>BETWEEN a AND b</code> untuk rentang (termasuk kedua ujung), <code>IN (...)</code> untuk daftar pilihan, <code>LIKE</code> untuk pola teks dengan <code>%</code> (apa saja) dan <code>_</code> (satu karakter), serta <code>IS NULL</code>.',
      'Perhatikan prioritas: <code>AND</code> dikerjakan sebelum <code>OR</code>. Selalu pakai kurung saat mencampur keduanya agar maksudmu jelas. Dan ingat, <code>= NULL</code> tidak pernah benar; gunakan <code>IS NULL</code>.'],
   ex:[['Aritmetika: nilai stok','SELECT nama, harga, stok, harga * stok AS nilai_stok FROM produk;'],['Perbandingan & logika','SELECT nama, kategori, harga FROM produk\nWHERE (kategori = \'Minuman\' OR kategori = \'Camilan\') AND harga < 50000;'],['BETWEEN, IN, LIKE','SELECT nama, harga FROM produk\nWHERE harga BETWEEN 20000 AND 90000\n  AND kategori IN (\'Minuman\', \'Bumbu\')\n  AND nama LIKE \'%a%\';'],['NULL perlu IS NULL','SELECT nama FROM pelanggan WHERE kota IS NULL;']],
   task:{q:'Tampilkan nama dan harga produk yang namanya diawali huruf K dan harganya kurang dari 50000.',a:"SELECT nama, harga FROM produk WHERE nama LIKE 'K%' AND harga < 50000;"},
   pts:['AND sebelum OR; pakai kurung.','BETWEEN termasuk kedua batas.','LIKE: % = apa saja, _ = satu karakter.','NULL dibandingkan dengan IS NULL / IS NOT NULL.'],
   q:[["<code>nama LIKE 'K_p%'</code> cocok dengan?",['Kopi Gayo','Keripik','Kacang'],0,'K, satu huruf apa saja, p, lalu apa saja.'],
      ['Hasil <code>kota = NULL</code> untuk baris yang kotanya kosong?',['TRUE','FALSE','NULL (tidak diketahui), jadi baris tidak terpilih'],2,'Perbandingan dengan NULL menghasilkan NULL.']]}
 ]},
{t:'Membaca data dengan SELECT',lvl:'Pemula',d:'SELECT, FROM, WHERE, ORDER BY, LIMIT, DISTINCT, dan urutan eksekusi query.',
 nodes:['Select Statement','FROM Clause in SELECT Statements','WHERE Clause in SELECT Statements','ORDER BY','Data Manipulation Language (DML)'],
 lessons:[
  {k:'s',t:'SELECT & FROM',nodes:['Select Statement','FROM Clause in SELECT Statements'],
   b:['<code>SELECT</code> memilih kolom apa yang ingin ditampilkan, dan <code>FROM</code> menentukan dari tabel mana. <code>SELECT *</code> berarti semua kolom. Di aplikasi sungguhan, sebutkan kolom yang dibutuhkan saja agar data yang dikirim lebih sedikit.',
      'Kolom bisa diberi nama baru dengan <code>AS</code> (alias), dan kamu bisa menampilkan hasil perhitungan, bukan hanya kolom mentah. Tabel juga bisa diberi alias pendek, misalnya <code>FROM produk p</code>, yang sangat berguna saat query melibatkan banyak tabel.',
      'SELECT tidak mengubah data sama sekali. Ia hanya membaca dan menghasilkan tabel hasil (result set). Jadi silakan bereksperimen sebebasnya.'],
   ex:[['Pilih kolom tertentu','SELECT nama, kategori FROM produk;'],['Alias kolom dan perhitungan','SELECT nama AS produk, harga, harga * 1.11 AS harga_dengan_pajak FROM produk;'],['Alias tabel','SELECT p.nama, p.stok FROM produk AS p;'],['Tanpa tabel: SQL sebagai kalkulator','SELECT 85000 * 3 AS total, \'Toko \' || \'Nusantara\' AS nama;']],
   task:{q:'Tampilkan nama pelanggan dengan alias pembeli, dan kotanya dengan alias asal.',a:'SELECT nama AS pembeli, kota AS asal FROM pelanggan;'},
   pts:['SELECT = kolom apa, FROM = tabel mana.','Hindari SELECT * di aplikasi produksi.','AS memberi alias kolom atau tabel.','SELECT hanya membaca, tidak mengubah data.'],
   q:[['Query yang menampilkan semua kolom tabel produk?',['SELECT ALL produk;','SELECT * FROM produk;','GET produk;'],1,'Bintang berarti semua kolom.'],
      ['Fungsi AS di <code>SELECT harga AS h</code>?',['Mengubah nama kolom di tabel','Memberi nama kolom di hasil saja','Menyaring data'],1,'Alias hanya berlaku di hasil query.']]},
  {k:'s',t:'WHERE: menyaring baris',nodes:['WHERE Clause in SELECT Statements'],viz:'pipeline',vq:"SELECT nama, kota FROM pelanggan WHERE kota = 'Jakarta' OR kota = 'Bandung';",
   b:['<code>WHERE</code> menyaring baris: hanya baris yang kondisinya bernilai benar yang ikut ke hasil. Bayangkan database memeriksa setiap baris satu per satu, lalu membuang yang tidak memenuhi syarat. Visualisasi di bawah memperlihatkan proses itu.',
      'Kondisi bisa digabung dengan <code>AND</code> dan <code>OR</code>, dan memakai operator seperti <code>IN</code>, <code>BETWEEN</code>, <code>LIKE</code>, serta <code>IS NULL</code>. Untuk teks, perbandingan biasanya peka huruf besar-kecil di PostgreSQL tetapi tidak di MySQL.',
      'WHERE hanya bisa memakai nilai dari baris yang sedang diperiksa. Ia tidak bisa memakai hasil COUNT atau SUM, karena pengelompokan belum terjadi pada tahap ini. Untuk itu ada HAVING.'],
   ex:[['Satu kondisi','SELECT nama, harga FROM produk WHERE kategori = \'Camilan\';'],['Beberapa kondisi','SELECT nama, stok FROM produk WHERE stok < 50 AND harga > 50000;'],['IN dan NOT IN','SELECT nama, kota FROM pelanggan WHERE kota NOT IN (\'Jakarta\', \'Bandung\');'],['Rentang tanggal','SELECT id, tanggal, status FROM pesanan WHERE tanggal BETWEEN \'2024-10-01\' AND \'2024-10-31\';']],
   task:{q:'Tampilkan id dan status pesanan yang statusnya selesai atau dikirim, dan terjadi pada bulan November 2024.',a:"SELECT id, status FROM pesanan WHERE status IN ('selesai','dikirim') AND tanggal >= '2024-11-01' AND tanggal < '2024-12-01';"},
   pts:['WHERE memeriksa setiap baris satu per satu.','Gabungkan kondisi dengan AND/OR dan kurung.','Rentang tanggal: <code>&gt;= awal AND &lt; awal_bulan_berikutnya</code> aman untuk timestamp.','Agregat tidak boleh di WHERE.'],
   q:[['Baris yang kondisinya NULL di WHERE?',['Ikut','Dibuang','Error'],1,'Hanya kondisi TRUE yang lolos.'],
      ['Cara menyaring kategori Minuman atau Bumbu yang paling ringkas?',["kategori = 'Minuman' AND 'Bumbu'","kategori IN ('Minuman','Bumbu')","kategori LIKE 'Minuman,Bumbu'"],1,'IN memeriksa daftar pilihan.']]},
  {k:'s',t:'ORDER BY, LIMIT & DISTINCT',nodes:['ORDER BY'],
   b:['<code>ORDER BY</code> mengurutkan hasil. Default-nya naik (<code>ASC</code>), tambahkan <code>DESC</code> untuk turun. Kamu bisa mengurutkan dengan beberapa kolom: kolom kedua dipakai ketika nilai kolom pertama sama. Tanpa ORDER BY, urutan hasil tidak dijamin.',
      '<code>LIMIT n</code> membatasi jumlah baris, dan <code>OFFSET m</code> melewati m baris pertama. Pasangan ini dipakai untuk "10 produk termahal" atau paginasi halaman 2, 3, dan seterusnya. SQL Server memakai <code>TOP n</code> atau <code>OFFSET ... FETCH</code>.',
      '<code>DISTINCT</code> membuang baris hasil yang kembar, misalnya untuk melihat daftar kota tanpa pengulangan.'],
   ex:[['Termahal ke termurah','SELECT nama, harga FROM produk ORDER BY harga DESC;'],['Urut dua kolom','SELECT nama, kategori, harga FROM produk ORDER BY kategori, harga DESC;'],['Tiga teratas','SELECT nama, stok FROM produk ORDER BY stok DESC LIMIT 3;'],['Halaman kedua (2 per halaman)','SELECT id, nama FROM pelanggan ORDER BY id LIMIT 2 OFFSET 2;'],['Kota tanpa duplikat','SELECT DISTINCT kota FROM pelanggan ORDER BY kota;']],
   task:{q:'Tampilkan nama dan tanggal bergabung dari 3 pelanggan yang paling baru bergabung, urut dari yang terbaru.',a:'SELECT nama, bergabung FROM pelanggan ORDER BY bergabung DESC LIMIT 3;',order:true},
   pts:['ASC naik (default), DESC turun.','Tanpa ORDER BY, urutan tidak dijamin.','LIMIT/OFFSET untuk top-N dan paginasi.','DISTINCT membuang baris kembar.'],
   q:[['Mengambil 5 produk termurah?',['ORDER BY harga DESC LIMIT 5','ORDER BY harga LIMIT 5','LIMIT 5 ORDER BY harga'],1,'Urut naik lalu batasi.'],
      ['Di mana NULL muncul saat ORDER BY ASC di SQLite?',['Paling atas','Paling bawah','Dibuang'],0,'SQLite dan MySQL menaruh NULL di awal untuk ASC; PostgreSQL di akhir.']]},
  {k:'s',t:'Urutan eksekusi query',nodes:['Select Statement','Data Manipulation Language (DML)'],viz:'pipeline',vq:"SELECT kategori, COUNT(*) AS jumlah, AVG(harga) AS rata FROM produk WHERE stok > 0 GROUP BY kategori HAVING COUNT(*) >= 2 ORDER BY rata DESC LIMIT 2;",
   b:['Query ditulis dimulai dari SELECT, tetapi database tidak menjalankannya dari SELECT. Urutan logisnya: <b>FROM</b> (ambil tabel dan gabungan), <b>WHERE</b> (saring baris), <b>GROUP BY</b> (kelompokkan), <b>HAVING</b> (saring kelompok), <b>SELECT</b> (hitung kolom hasil), <b>DISTINCT</b>, <b>ORDER BY</b> (urutkan), lalu <b>LIMIT</b>.',
      'Urutan ini menjelaskan banyak "keanehan". Alias yang dibuat di SELECT tidak bisa dipakai di WHERE, karena WHERE berjalan lebih dulu. Sebaliknya, ORDER BY boleh memakai alias karena berjalan setelah SELECT.',
      'Putar visualisasi di bawah langkah demi langkah. Di setiap pelajaran SQL berikutnya, tombol <b>Jelaskan langkah</b> di editor juga bisa memvisualisasikan query buatanmu sendiri.'],
   ex:[['Query lengkap dengan semua klausa','SELECT kategori, COUNT(*) AS jumlah, AVG(harga) AS rata\nFROM produk\nWHERE stok > 0\nGROUP BY kategori\nHAVING COUNT(*) >= 2\nORDER BY rata DESC\nLIMIT 2;'],['Alias di ORDER BY boleh','SELECT nama, harga * stok AS nilai FROM produk ORDER BY nilai DESC;']],
   task:{q:'Tampilkan nama dan nilai stok (harga * stok, alias nilai) untuk produk yang stoknya lebih dari 0, urut dari nilai terbesar.',a:'SELECT nama, harga * stok AS nilai FROM produk WHERE stok > 0 ORDER BY nilai DESC;',order:true},
   pts:['Urutan: FROM → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT.','Alias SELECT tidak bisa dipakai di WHERE (di kebanyakan database).','ORDER BY bisa memakai alias.','Pahami urutan ini untuk membaca query rumit.'],
   q:[['Klausa yang dijalankan paling awal?',['SELECT','FROM','WHERE'],1,'Database harus tahu dulu tabel sumbernya.'],
      ['Kenapa <code>WHERE nilai &gt; 100</code> gagal jika nilai adalah alias di SELECT?',['Typo','WHERE berjalan sebelum SELECT membuat alias','Alias harus huruf besar'],1,'Pada tahap WHERE, alias belum ada.']]}
 ]},
{t:'Mengubah data',lvl:'Pemula',d:'INSERT, UPDATE, dan DELETE dengan aman.',
 nodes:['INSERT','UPDATE Statement','DELETE Statement','Data Manipulation Language (DML)'],
 lessons:[
  {k:'s',t:'INSERT: menambah baris',nodes:['INSERT','Data Manipulation Language (DML)'],
   b:['<code>INSERT INTO tabel (kolom, ...) VALUES (nilai, ...)</code> menambah baris baru. Sebutkan nama kolom secara eksplisit: urutan nilai mengikuti urutan kolom yang kamu tulis, dan kolom yang tidak disebut akan memakai nilai <code>DEFAULT</code> atau NULL.',
      'Satu INSERT bisa menambah banyak baris sekaligus dengan beberapa kelompok VALUES yang dipisah koma. Kamu juga bisa menyalin hasil query ke tabel lain dengan <code>INSERT INTO ... SELECT ...</code>.',
      'Kolom <code>id INTEGER PRIMARY KEY</code> terisi otomatis jika dikosongkan. Di PostgreSQL ini disebut SERIAL/IDENTITY, di MySQL AUTO_INCREMENT. Database akan menolak data yang melanggar aturan tabel, misalnya NOT NULL atau CHECK.'],
   ex:[['Tambah satu produk','INSERT INTO produk (nama, kategori, harga, stok)\nVALUES (\'Gula Aren\', \'Bumbu\', 18000, 60);\nSELECT * FROM produk WHERE nama = \'Gula Aren\';'],['Tambah beberapa baris sekaligus','INSERT INTO pelanggan (nama, kota, bergabung) VALUES\n  (\'Indra\', \'Makassar\', \'2024-10-01\'),\n  (\'Joko\', \'Semarang\', \'2024-10-05\');\nSELECT * FROM pelanggan ORDER BY id DESC LIMIT 2;'],['Ditolak: nama wajib diisi','INSERT INTO produk (kategori, harga) VALUES (\'Minuman\', 10000);']],
   task:{q:"Tambahkan pelanggan baru bernama Kiki dari Malang yang bergabung tanggal 2024-11-20.",a:"INSERT INTO pelanggan (nama, kota, bergabung) VALUES ('Kiki', 'Malang', '2024-11-20');",check:'SELECT nama, kota, bergabung FROM pelanggan ORDER BY id;'},
   pts:['Selalu sebutkan daftar kolom.','Kolom yang tidak disebut memakai DEFAULT/NULL.','Banyak baris: VALUES (...), (...).','<code>INSERT INTO ... SELECT</code> menyalin data.'],
   q:[['Kolom stok tidak disebut saat INSERT dan punya DEFAULT 0. Nilainya?',['NULL','0','Error'],1,'DEFAULT dipakai.'],
      ['Kenapa sebaiknya menyebut nama kolom di INSERT?',['Wajib di semua database','Agar tidak rusak jika urutan atau jumlah kolom tabel berubah','Lebih cepat'],1,'Query jadi tahan perubahan skema.']]},
  {k:'s',t:'UPDATE & DELETE',nodes:['UPDATE Statement','DELETE Statement'],
   b:['<code>UPDATE tabel SET kolom = nilai WHERE kondisi</code> mengubah baris yang memenuhi kondisi. Nilai baru boleh berupa rumus dari nilai lama, misalnya menaikkan harga 10%: <code>SET harga = harga * 1.1</code>.',
      '<code>DELETE FROM tabel WHERE kondisi</code> menghapus baris. <b>Peringatan terbesar di SQL</b>: tanpa WHERE, UPDATE dan DELETE mengenai <i>semua</i> baris. Kebiasaan aman: jalankan dulu <code>SELECT</code> dengan WHERE yang sama untuk melihat baris mana yang akan terkena, baru ubah menjadi UPDATE atau DELETE.',
      'Database juga menjaga relasi. Menghapus pelanggan yang masih punya pesanan akan ditolak oleh foreign key, kecuali tabelnya dibuat dengan <code>ON DELETE CASCADE</code>.'],
   ex:[['Cek dulu dengan SELECT','SELECT nama, harga FROM produk WHERE kategori = \'Minuman\';'],['Lalu UPDATE','UPDATE produk SET harga = harga + 5000 WHERE kategori = \'Minuman\';\nSELECT nama, harga FROM produk WHERE kategori = \'Minuman\';'],['Ubah beberapa kolom','UPDATE pesanan SET status = \'selesai\' WHERE id = 107;\nSELECT * FROM pesanan WHERE id = 107;'],['DELETE yang ditolak foreign key','DELETE FROM pelanggan WHERE id = 1;'],['DELETE yang aman','DELETE FROM detail_pesanan WHERE pesanan_id = 105;\nSELECT COUNT(*) AS sisa FROM detail_pesanan;']],
   task:{q:'Ubah stok produk Rendang Kaleng menjadi 25.',a:"UPDATE produk SET stok = 25 WHERE nama = 'Rendang Kaleng';",check:'SELECT nama, stok FROM produk ORDER BY id;'},
   pts:['Selalu tulis WHERE pada UPDATE dan DELETE.','Uji dengan SELECT sebelum mengubah.','Nilai baru boleh rumus dari nilai lama.','Foreign key melindungi data yang masih dirujuk.'],
   q:[['<code>DELETE FROM produk;</code> tanpa WHERE akan?',['Menghapus tabel','Menghapus semua baris','Error'],1,'Struktur tetap, semua baris hilang.'],
      ['Kebiasaan aman sebelum UPDATE?',['Matikan komputer','Jalankan SELECT dengan WHERE yang sama','Hapus index'],1,'Pastikan baris yang terkena benar.']]}
 ]},
{t:'Agregasi & pengelompokan',lvl:'Menengah',d:'COUNT, SUM, AVG, MIN, MAX, GROUP BY, dan HAVING.',
 nodes:['Aggregate Queries','COUNT','SUM','AVG','MIN','MAX','GROUP BY','HAVING'],
 lessons:[
  {k:'s',t:'Fungsi agregat',nodes:['Aggregate Queries','COUNT','SUM','AVG','MIN','MAX'],
   b:['<b>Fungsi agregat</b> merangkum banyak baris menjadi satu nilai. <code>COUNT</code> menghitung, <code>SUM</code> menjumlah, <code>AVG</code> merata-rata, <code>MIN</code> dan <code>MAX</code> mencari nilai terkecil dan terbesar.',
      'Perbedaan penting: <code>COUNT(*)</code> menghitung semua baris, sedangkan <code>COUNT(kolom)</code> hanya menghitung baris yang kolom itu tidak NULL. <code>COUNT(DISTINCT kolom)</code> menghitung nilai yang berbeda saja.',
      'Semua fungsi agregat selain COUNT(*) mengabaikan NULL. Jadi AVG dari (10, NULL, 20) adalah 15, bukan 10.'],
   ex:[['Ringkasan produk','SELECT COUNT(*) AS jumlah, SUM(stok) AS total_stok, AVG(harga) AS rata,\n       MIN(harga) AS termurah, MAX(harga) AS termahal\nFROM produk;'],['COUNT(*) vs COUNT(kolom)','SELECT COUNT(*) AS semua, COUNT(kota) AS ada_kota, COUNT(DISTINCT kota) AS kota_berbeda FROM pelanggan;'],['Agregat dengan WHERE','SELECT SUM(jumlah) AS kopi_terjual FROM detail_pesanan WHERE produk_id = 1;']],
   task:{q:'Hitung jumlah pesanan yang statusnya selesai (satu kolom bernama jumlah).',a:"SELECT COUNT(*) AS jumlah FROM pesanan WHERE status = 'selesai';"},
   pts:['COUNT, SUM, AVG, MIN, MAX merangkum banyak baris.','COUNT(*) semua baris; COUNT(kolom) hanya yang tidak NULL.','Agregat mengabaikan NULL.','WHERE dijalankan sebelum agregasi.'],
   q:[['<code>COUNT(kota)</code> jika 1 dari 8 pelanggan kotanya NULL?',['8','7','1'],1,'NULL tidak dihitung.'],
      ['Fungsi untuk rata-rata?',['MEAN','AVG','AVERAGE'],1,'AVG adalah nama standar SQL.']]},
  {k:'s',t:'GROUP BY',nodes:['GROUP BY'],viz:'pipeline',vq:'SELECT kategori, COUNT(*) AS jumlah, SUM(stok) AS total_stok FROM produk GROUP BY kategori;',
   b:['<code>GROUP BY</code> membagi baris menjadi kelompok berdasarkan nilai kolom tertentu, lalu fungsi agregat dihitung <i>per kelompok</i>. Misalnya jumlah produk per kategori, atau total belanja per pelanggan.',
      'Aturan emas: setiap kolom di SELECT harus berupa kolom yang ada di GROUP BY, atau dibungkus fungsi agregat. PostgreSQL menolak query yang melanggar aturan ini, sedangkan SQLite dan MySQL lama diam-diam mengambil nilai dari baris sembarang. Jangan bergantung pada perilaku itu.',
      'Kamu bisa mengelompokkan berdasarkan beberapa kolom, atau berdasarkan ekspresi seperti bulan dari tanggal.'],
   ex:[['Jumlah produk per kategori','SELECT kategori, COUNT(*) AS jumlah, SUM(stok) AS total_stok\nFROM produk GROUP BY kategori;'],['Pesanan per pelanggan','SELECT pelanggan_id, COUNT(*) AS banyak_pesanan\nFROM pesanan GROUP BY pelanggan_id ORDER BY banyak_pesanan DESC;'],['Per bulan','SELECT strftime(\'%Y-%m\', tanggal) AS bulan, COUNT(*) AS pesanan\nFROM pesanan GROUP BY bulan ORDER BY bulan;'],['Dua kolom','SELECT pelanggan_id, status, COUNT(*) AS n FROM pesanan\nGROUP BY pelanggan_id, status ORDER BY pelanggan_id;']],
   task:{q:'Tampilkan setiap status pesanan beserta banyaknya pesanan (kolom status dan jumlah).',a:'SELECT status, COUNT(*) AS jumlah FROM pesanan GROUP BY status;'},
   pts:['GROUP BY = satu baris hasil per kelompok.','Kolom SELECT: ada di GROUP BY atau di dalam agregat.','Boleh mengelompokkan dengan ekspresi.','ORDER BY tetap diperlukan untuk urutan.'],
   q:[['<code>SELECT kategori, nama, COUNT(*) FROM produk GROUP BY kategori</code> bermasalah karena?',['COUNT salah','nama tidak di GROUP BY dan tidak diagregasi','kategori harus di akhir'],1,'Satu kategori punya banyak nama.'],
      ['Jumlah baris hasil GROUP BY kategori jika ada 4 kategori?',['4','8','1'],0,'Satu baris per kelompok.']]},
  {k:'s',t:'HAVING',nodes:['HAVING'],viz:'pipeline',vq:'SELECT pelanggan_id, COUNT(*) AS banyak FROM pesanan GROUP BY pelanggan_id HAVING COUNT(*) >= 2;',
   b:['<code>HAVING</code> menyaring <b>kelompok</b>, sedangkan WHERE menyaring <b>baris</b>. Karena HAVING berjalan setelah GROUP BY, ia boleh memakai fungsi agregat: "tampilkan pelanggan yang pesanannya lebih dari 1".',
      'Satu query bisa memakai keduanya. WHERE membuang baris yang tidak relevan lebih dulu (misalnya pesanan batal), lalu GROUP BY mengelompokkan, lalu HAVING membuang kelompok yang tidak memenuhi syarat.',
      'Pakai WHERE kapan pun memungkinkan, karena menyaring lebih awal berarti lebih sedikit data yang harus dikelompokkan.'],
   ex:[['Pelanggan dengan minimal 2 pesanan','SELECT pelanggan_id, COUNT(*) AS banyak\nFROM pesanan GROUP BY pelanggan_id\nHAVING COUNT(*) >= 2;'],['WHERE dan HAVING bersama','SELECT pelanggan_id, COUNT(*) AS selesai\nFROM pesanan\nWHERE status = \'selesai\'\nGROUP BY pelanggan_id\nHAVING COUNT(*) >= 2;'],['Kategori dengan rata-rata harga di atas 50 ribu','SELECT kategori, AVG(harga) AS rata FROM produk\nGROUP BY kategori HAVING AVG(harga) > 50000;'],['Salah: agregat di WHERE','SELECT kategori FROM produk WHERE COUNT(*) > 1 GROUP BY kategori;']],
   task:{q:'Tampilkan produk_id dan total jumlah terjual (alias total) untuk produk yang total terjualnya minimal 5, dari tabel detail_pesanan.',a:'SELECT produk_id, SUM(jumlah) AS total FROM detail_pesanan GROUP BY produk_id HAVING SUM(jumlah) >= 5;'},
   pts:['WHERE menyaring baris, HAVING menyaring kelompok.','HAVING boleh memakai agregat.','Urutan: WHERE → GROUP BY → HAVING.','Saring sedini mungkin dengan WHERE.'],
   q:[['Untuk "kategori yang punya lebih dari 2 produk" pakai?',['WHERE COUNT(*) > 2','HAVING COUNT(*) > 2','ORDER BY COUNT(*)'],1,'Syarat atas kelompok memakai HAVING.'],
      ['Mana yang dijalankan lebih dulu?',['HAVING','WHERE','Sama'],1,'WHERE sebelum GROUP BY, HAVING sesudahnya.']]}
 ]},
{t:'Struktur tabel & constraint',lvl:'Menengah',d:'CREATE, ALTER, DROP, TRUNCATE, serta primary key, foreign key, UNIQUE, NOT NULL, dan CHECK.',
 nodes:['Data Definition Language (DDL)','Create Table','Alter Table','Drop Table','Truncate Table','Data Constraints','Primary Key','Foreign Key','Unique Constraint','NOT NULL Constraint','CHECK'],
 lessons:[
  {k:'s',t:'CREATE TABLE',nodes:['Data Definition Language (DDL)','Create Table'],
   b:['<code>CREATE TABLE</code> membuat tabel baru: nama tabel, lalu daftar kolom beserta tipe data dan aturannya. Perintah yang mengatur struktur seperti ini disebut <b>DDL</b> (Data Definition Language).',
      'Rancang tabel dengan hati-hati: beri setiap tabel primary key, pilih tipe data yang tepat, dan tambahkan aturan (constraint) untuk menjaga data tetap benar sejak awal. Memperbaiki data yang terlanjur kotor jauh lebih mahal.',
      '<code>CREATE TABLE IF NOT EXISTS</code> tidak error jika tabel sudah ada. <code>CREATE TABLE baru AS SELECT ...</code> membuat tabel dari hasil query, berguna untuk salinan atau laporan.'],
   ex:[['Buat tabel kategori','CREATE TABLE kategori (\n  id INTEGER PRIMARY KEY,\n  nama TEXT NOT NULL UNIQUE,\n  aktif INTEGER DEFAULT 1\n);\nINSERT INTO kategori (nama) VALUES (\'Minuman\'), (\'Camilan\');\nSELECT * FROM kategori;'],['Tabel dari hasil query','CREATE TABLE produk_mahal AS\nSELECT nama, harga FROM produk WHERE harga > 70000;\nSELECT * FROM produk_mahal;']],
   task:{q:'Buat tabel ulasan dengan kolom id (INTEGER PRIMARY KEY), produk_id (INTEGER), bintang (INTEGER), dan komentar (TEXT). Lalu tambahkan satu ulasan: produk 1, bintang 5, komentar Mantap.',a:"CREATE TABLE ulasan (id INTEGER PRIMARY KEY, produk_id INTEGER, bintang INTEGER, komentar TEXT); INSERT INTO ulasan (produk_id, bintang, komentar) VALUES (1, 5, 'Mantap');",check:'SELECT produk_id, bintang, komentar FROM ulasan;'},
   pts:['CREATE TABLE nama (kolom tipe aturan, ...).','Setiap tabel butuh primary key.','IF NOT EXISTS mencegah error tabel ganda.','CREATE TABLE ... AS SELECT menyalin hasil query.'],
   q:[['DDL adalah singkatan dari?',['Data Definition Language','Data Deletion Logic','Direct Data Link'],0,'DDL mengatur struktur.'],
      ['Aturan yang membuat kolom wajib diisi?',['UNIQUE','NOT NULL','DEFAULT'],1,'NOT NULL menolak nilai kosong.']]},
  {k:'s',t:'ALTER, DROP & TRUNCATE',nodes:['Alter Table','Drop Table','Truncate Table'],
   b:['<code>ALTER TABLE</code> mengubah struktur tabel yang sudah ada: menambah kolom (<code>ADD COLUMN</code>), menghapus kolom (<code>DROP COLUMN</code>), mengganti nama kolom atau tabel (<code>RENAME</code>), dan mengubah tipe kolom.',
      '<code>DROP TABLE</code> menghapus tabel beserta seluruh isinya dan strukturnya. <code>TRUNCATE TABLE</code> mengosongkan semua baris tetapi strukturnya tetap, biasanya jauh lebih cepat daripada DELETE tanpa WHERE dan mereset penghitung id. (SQLite asli tidak punya TRUNCATE; simulator ini menyediakannya agar kamu bisa mencoba.)',
      'Perintah-perintah ini sulit dibatalkan. Di perusahaan, perubahan struktur dilakukan lewat file <b>migrasi</b> yang ditinjau tim, bukan diketik langsung di database produksi.'],
   ex:[['Tambah kolom','ALTER TABLE produk ADD COLUMN berat_gram INTEGER DEFAULT 250;\nSELECT nama, berat_gram FROM produk LIMIT 3;'],['Ganti nama kolom','ALTER TABLE pelanggan RENAME COLUMN kota TO domisili;\nSELECT nama, domisili FROM pelanggan LIMIT 3;'],['TRUNCATE: kosongkan isi','TRUNCATE TABLE detail_pesanan;\nSELECT COUNT(*) AS sisa FROM detail_pesanan;'],['DROP ditolak karena masih dirujuk','DROP TABLE pelanggan;']],
   task:{q:'Tambahkan kolom email bertipe TEXT ke tabel pelanggan.',a:'ALTER TABLE pelanggan ADD COLUMN email TEXT;',check:'SELECT * FROM pelanggan;'},
   pts:['ALTER: ADD/DROP/RENAME COLUMN, RENAME TO.','DROP = struktur dan isi hilang.','TRUNCATE = isi hilang, struktur tetap.','Perubahan struktur lewat migrasi yang ditinjau.'],
   q:[['Perintah yang menghapus semua baris tapi tabelnya tetap ada?',['DROP TABLE','TRUNCATE TABLE','ALTER TABLE'],1,'TRUNCATE mengosongkan isi.'],
      ['Menambah kolom baru memakai?',['ALTER TABLE ... ADD COLUMN','UPDATE ... ADD','INSERT COLUMN'],0,'ALTER mengubah struktur.']]},
  {k:'s',t:'Primary key & foreign key',nodes:['Primary Key','Foreign Key','Data Constraints'],viz:'er',
   b:['<b>Primary key</b> (PK) adalah kolom (atau gabungan kolom) yang nilainya unik dan tidak boleh NULL. Ia menjadi identitas setiap baris, seperti NIK untuk penduduk. Tabel detail_pesanan memakai PK gabungan (pesanan_id, produk_id), karena satu produk hanya muncul sekali dalam satu pesanan.',
      '<b>Foreign key</b> (FK) adalah kolom yang menunjuk primary key tabel lain. <code>pesanan.pelanggan_id</code> menunjuk <code>pelanggan.id</code>. Database menjaga <b>integritas referensial</b>: kamu tidak bisa membuat pesanan untuk pelanggan yang tidak ada, dan tidak bisa menghapus pelanggan yang masih punya pesanan.',
      'Perilaku saat induk dihapus bisa diatur: <code>ON DELETE CASCADE</code> ikut menghapus anak, <code>ON DELETE SET NULL</code> mengosongkan rujukannya. Diagram di bawah menunjukkan relasi di database Toko Nusantara.'],
   ex:[['Pesanan untuk pelanggan yang tidak ada','INSERT INTO pesanan (pelanggan_id, tanggal) VALUES (99, \'2024-12-01\');'],['Primary key kembar','INSERT INTO produk (id, nama, kategori, harga) VALUES (1, \'Kopi Lain\', \'Minuman\', 50000);'],['Foreign key dengan CASCADE','CREATE TABLE alamat (\n  id INTEGER PRIMARY KEY,\n  pelanggan_id INTEGER REFERENCES pelanggan(id) ON DELETE CASCADE,\n  jalan TEXT\n);\nINSERT INTO pelanggan (id, nama) VALUES (50, \'Uji\');\nINSERT INTO alamat (pelanggan_id, jalan) VALUES (50, \'Jl. Merdeka 1\');\nDELETE FROM pelanggan WHERE id = 50;\nSELECT COUNT(*) AS alamat_tersisa FROM alamat;']],
   task:{q:'Buat tabel favorit dengan kolom pelanggan_id yang merujuk pelanggan(id) dan produk_id yang merujuk produk(id), dengan primary key gabungan keduanya. Lalu catat bahwa pelanggan 2 menyukai produk 6.',a:'CREATE TABLE favorit (pelanggan_id INTEGER REFERENCES pelanggan(id), produk_id INTEGER REFERENCES produk(id), PRIMARY KEY (pelanggan_id, produk_id)); INSERT INTO favorit VALUES (2, 6);',check:'SELECT pelanggan_id, produk_id FROM favorit;'},
   pts:['PK: unik + tidak NULL, identitas baris.','FK: menunjuk PK tabel lain.','Integritas referensial dijaga database.','ON DELETE CASCADE / SET NULL mengatur efek penghapusan induk.'],
   q:[['Kolom pesanan.pelanggan_id adalah?',['Primary key','Foreign key','Index'],1,'Ia menunjuk pelanggan.id.'],
      ['Menghapus pelanggan yang masih punya pesanan (tanpa CASCADE)?',['Berhasil','Ditolak','Pesanannya ikut hilang'],1,'FK mencegah rujukan yatim.']]},
  {k:'s',t:'UNIQUE, NOT NULL & CHECK',nodes:['Unique Constraint','NOT NULL Constraint','CHECK','Data Constraints'],
   b:['<b>Constraint</b> adalah aturan yang dijaga oleh database itu sendiri, sehingga data salah ditolak dari mana pun asalnya: aplikasi web, aplikasi mobile, atau admin yang mengetik query.',
      '<code>NOT NULL</code> mewajibkan kolom diisi. <code>UNIQUE</code> melarang nilai kembar, misalnya email. <code>CHECK (kondisi)</code> memastikan nilai memenuhi syarat, misalnya <code>harga &gt; 0</code> atau <code>bintang BETWEEN 1 AND 5</code>. <code>DEFAULT</code> memberi nilai bawaan.',
      'Coba jalankan contoh di bawah dan baca pesan error-nya. Pesan seperti ini adalah teman: ia menghentikan data rusak sebelum masuk.'],
   ex:[['Harga negatif ditolak CHECK','INSERT INTO produk (nama, kategori, harga) VALUES (\'Promo\', \'Camilan\', -1000);'],['Saldo tidak boleh minus','UPDATE rekening SET saldo = saldo - 1000000 WHERE id = 1;'],['UNIQUE menolak duplikat','CREATE TABLE akun (\n  id INTEGER PRIMARY KEY,\n  email TEXT NOT NULL UNIQUE,\n  umur INTEGER CHECK (umur >= 13)\n);\nINSERT INTO akun (email, umur) VALUES (\'rina@mail.com\', 20);\nINSERT INTO akun (email, umur) VALUES (\'rina@mail.com\', 25);'],['NOT NULL menolak kosong','INSERT INTO pesanan (pelanggan_id) VALUES (1);']],
   task:{q:'Buat tabel voucher dengan kolom kode (TEXT, NOT NULL, UNIQUE) dan potongan (INTEGER) yang harus antara 1 dan 100 (pakai CHECK). Tambahkan voucher HEMAT10 dengan potongan 10.',a:"CREATE TABLE voucher (kode TEXT NOT NULL UNIQUE, potongan INTEGER CHECK (potongan BETWEEN 1 AND 100)); INSERT INTO voucher VALUES ('HEMAT10', 10);",check:'SELECT kode, potongan FROM voucher;'},
   pts:['Constraint dijaga database, bukan hanya aplikasi.','NOT NULL, UNIQUE, CHECK, DEFAULT, PK, FK.','Pesan error constraint membantu menemukan data salah.','Tambahkan constraint sejak awal desain tabel.'],
   q:[['Aturan agar email tidak kembar?',['NOT NULL','UNIQUE','CHECK'],1,'UNIQUE melarang duplikat.'],
      ['<code>CHECK (stok &gt;= 0)</code> mencegah?',['Stok kosong','Stok negatif','Stok di atas 100'],1,'CHECK menguji kondisi.']]}
 ]},
{t:'JOIN',lvl:'Menengah',d:'Menggabungkan tabel: INNER, LEFT, RIGHT, FULL OUTER, self join, dan cross join.',
 nodes:['JOIN Queries','JOINs','INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL OUTER JOIN','Self Join','Cross Join'],
 lessons:[
  {k:'s',t:'INNER JOIN',nodes:['JOIN Queries','JOINs','INNER JOIN'],viz:'join',vj:'INNER',
   b:['Data yang saling berhubungan tersimpan di tabel terpisah. <b>JOIN</b> menyatukannya kembali dalam satu hasil. <code>INNER JOIN</code> (atau cukup <code>JOIN</code>) hanya mengambil pasangan baris yang cocok dengan kondisi <code>ON</code> di kedua tabel.',
      'Kondisi ON biasanya mencocokkan foreign key dengan primary key: <code>ON pesanan.pelanggan_id = pelanggan.id</code>. Pakai alias tabel agar query ringkas, dan tulis nama tabel di depan kolom yang namanya sama di kedua tabel, seperti <code>id</code>.',
      'Perhatikan visualisasi: setiap baris kiri dicocokkan dengan setiap baris kanan. Garis muncul untuk pasangan yang cocok, dan hanya pasangan itulah yang masuk hasil. Pelanggan tanpa pesanan tidak muncul sama sekali.'],
   ex:[['Pesanan beserta nama pelanggannya','SELECT s.id, s.tanggal, p.nama\nFROM pesanan s\nJOIN pelanggan p ON s.pelanggan_id = p.id;'],['JOIN + WHERE + ORDER','SELECT p.nama, s.id, s.status\nFROM pelanggan p\nINNER JOIN pesanan s ON s.pelanggan_id = p.id\nWHERE p.kota = \'Jakarta\'\nORDER BY s.id;'],['Kolom ambigu tanpa nama tabel','SELECT id, nama FROM pelanggan JOIN pesanan ON pesanan.pelanggan_id = pelanggan.id;']],
   task:{q:'Tampilkan nama produk dan jumlah untuk setiap baris di detail_pesanan dengan pesanan_id 104.',a:'SELECT pr.nama, d.jumlah FROM detail_pesanan d JOIN produk pr ON pr.id = d.produk_id WHERE d.pesanan_id = 104;'},
   pts:['INNER JOIN hanya mengambil pasangan yang cocok.','ON berisi kondisi pencocokan, biasanya FK = PK.','Pakai alias tabel.','Kolom bernama sama harus diberi awalan tabel.'],
   q:[['Pelanggan tanpa pesanan pada INNER JOIN pelanggan-pesanan?',['Muncul dengan NULL','Tidak muncul','Muncul dua kali'],1,'INNER hanya mengambil yang cocok.'],
      ['Error "kolom ambigu" berarti?',['Kolom tidak ada','Kolom ada di lebih dari satu tabel','Tabel kosong'],1,'Tulis tabel.kolom.']]},
  {k:'s',t:'LEFT, RIGHT & FULL OUTER JOIN',nodes:['LEFT JOIN','RIGHT JOIN','FULL OUTER JOIN'],viz:'join',vj:'LEFT',
   b:['<b>Outer join</b> tetap mempertahankan baris yang tidak punya pasangan. <code>LEFT JOIN</code> mempertahankan semua baris tabel kiri; jika tidak ada pasangan di kanan, kolom kanan diisi NULL. <code>RIGHT JOIN</code> kebalikannya. <code>FULL OUTER JOIN</code> mempertahankan semua baris dari kedua sisi.',
      'Pola yang sangat sering dipakai: "cari yang <i>tidak</i> punya pasangan". LEFT JOIN lalu saring <code>WHERE kanan.id IS NULL</code>, misalnya pelanggan yang belum pernah memesan.',
      'Gunakan tombol jenis JOIN di visualisasi untuk membandingkan hasilnya. Perhatikan baris yang diberi NULL. (MySQL tidak punya FULL OUTER JOIN; gantinya LEFT JOIN UNION RIGHT JOIN.)'],
   ex:[['Semua pelanggan, punya pesanan atau tidak','SELECT p.nama, s.id AS pesanan\nFROM pelanggan p\nLEFT JOIN pesanan s ON s.pelanggan_id = p.id\nORDER BY p.id;'],['Pelanggan yang belum pernah memesan','SELECT p.nama\nFROM pelanggan p\nLEFT JOIN pesanan s ON s.pelanggan_id = p.id\nWHERE s.id IS NULL;'],['RIGHT JOIN','SELECT p.nama, s.id\nFROM pesanan s\nRIGHT JOIN pelanggan p ON s.pelanggan_id = p.id;'],['FULL OUTER JOIN','SELECT pr.nama, d.pesanan_id\nFROM produk pr\nFULL OUTER JOIN detail_pesanan d ON d.produk_id = pr.id\nWHERE d.pesanan_id IS NULL OR pr.id IS NULL;']],
   task:{q:'Tampilkan nama semua produk dan total jumlah terjualnya (alias terjual). Produk yang belum pernah terjual tetap muncul dengan terjual NULL.',a:'SELECT pr.nama, SUM(d.jumlah) AS terjual FROM produk pr LEFT JOIN detail_pesanan d ON d.produk_id = pr.id GROUP BY pr.id, pr.nama;'},
   pts:['LEFT: semua baris kiri; RIGHT: semua baris kanan; FULL: semua dari keduanya.','Baris tanpa pasangan diisi NULL.','Pola anti-join: LEFT JOIN ... WHERE kanan.id IS NULL.','Urutan tabel menentukan mana "kiri".'],
   q:[['Mencari produk yang belum pernah dipesan?',['INNER JOIN','LEFT JOIN + WHERE d.produk_id IS NULL','CROSS JOIN'],1,'Baris kiri tanpa pasangan.'],
      ['<code>A RIGHT JOIN B</code> setara dengan?',['B LEFT JOIN A','A LEFT JOIN B','A INNER JOIN B'],0,'Tinggal tukar posisi tabel.']]},
  {k:'s',t:'Self join & cross join',nodes:['Self Join','Cross Join'],viz:'join',vj:'SELF',
   b:['<b>Self join</b> menggabungkan tabel dengan dirinya sendiri. Contoh klasiknya hierarki karyawan: kolom <code>atasan_id</code> menunjuk <code>id</code> di tabel yang sama. Kuncinya adalah memberi dua alias berbeda, misalnya <code>k</code> untuk karyawan dan <code>a</code> untuk atasan.',
      '<b>Cross join</b> memasangkan setiap baris kiri dengan <i>setiap</i> baris kanan tanpa syarat. Hasilnya disebut produk kartesius: 8 pelanggan × 8 produk = 64 baris. Berguna untuk membuat kombinasi, misalnya semua ukuran × semua warna.',
      'Hati-hati: lupa menulis kondisi ON pada join gaya lama (<code>FROM a, b</code>) diam-diam menghasilkan cross join yang sangat besar.'],
   ex:[['Karyawan dan atasannya','SELECT k.nama AS karyawan, k.jabatan, a.nama AS atasan\nFROM karyawan k\nLEFT JOIN karyawan a ON k.atasan_id = a.id;'],['Rekan satu atasan','SELECT x.nama, y.nama AS rekan\nFROM karyawan x JOIN karyawan y\n  ON x.atasan_id = y.atasan_id AND x.id < y.id;'],['Cross join: kombinasi','SELECT u.ukuran, w.warna\nFROM (SELECT \'S\' AS ukuran UNION ALL SELECT \'M\' UNION ALL SELECT \'L\') u\nCROSS JOIN (SELECT \'Merah\' AS warna UNION ALL SELECT \'Hitam\') w;'],['Jumlah baris produk kartesius','SELECT COUNT(*) AS kombinasi FROM pelanggan CROSS JOIN produk;']],
   task:{q:'Tampilkan nama setiap karyawan dan nama atasannya (kolom karyawan dan atasan) hanya untuk karyawan yang punya atasan.',a:'SELECT k.nama AS karyawan, a.nama AS atasan FROM karyawan k JOIN karyawan a ON k.atasan_id = a.id;'},
   pts:['Self join butuh dua alias.','Cross join = semua kombinasi (kartesius).','Jumlah baris cross join = baris kiri × baris kanan.','Selalu tulis kondisi ON.'],
   q:[['Cross join 3 baris dengan 4 baris menghasilkan?',['7 baris','12 baris','4 baris'],1,'3 × 4 = 12.'],
      ['Kenapa self join butuh alias?',['Wajib di semua query','Agar dua "salinan" tabel bisa dibedakan','Lebih cepat'],1,'Satu tabel berperan dua kali.']]},
  {k:'s',t:'JOIN banyak tabel',nodes:['JOIN Queries','Optimizing Joins'],
   b:['Pertanyaan bisnis sering membutuhkan beberapa tabel sekaligus. "Berapa total belanja tiap pelanggan?" melibatkan pelanggan → pesanan → detail_pesanan → produk. Tulis JOIN satu per satu mengikuti jalur relasi.',
      'Bacalah query seperti rantai: setiap JOIN menambah satu tabel dan satu kondisi ON yang menghubungkannya dengan tabel sebelumnya. Setelah semua tergabung, gunakan WHERE, GROUP BY, dan ORDER BY seperti biasa.',
      'Kesalahan umum adalah lupa satu kondisi ON sehingga baris berlipat ganda. Jika jumlah hasil tiba-tiba terlalu besar, periksa kembali setiap kondisi ON.'],
   ex:[['Total belanja per pelanggan (tanpa yang batal)','SELECT p.nama, SUM(d.jumlah * pr.harga) AS total\nFROM pelanggan p\nJOIN pesanan s ON s.pelanggan_id = p.id\nJOIN detail_pesanan d ON d.pesanan_id = s.id\nJOIN produk pr ON pr.id = d.produk_id\nWHERE s.status <> \'batal\'\nGROUP BY p.id, p.nama\nORDER BY total DESC;'],['Isi pesanan lengkap','SELECT s.id, p.nama AS pembeli, pr.nama AS produk, d.jumlah\nFROM pesanan s\nJOIN pelanggan p ON p.id = s.pelanggan_id\nJOIN detail_pesanan d ON d.pesanan_id = s.id\nJOIN produk pr ON pr.id = d.produk_id\nWHERE s.id IN (101, 104)\nORDER BY s.id, pr.nama;']],
   task:{q:'Tampilkan kategori produk dan total pendapatan per kategori (alias pendapatan = jumlah * harga) dari semua pesanan berstatus selesai.',a:"SELECT pr.kategori, SUM(d.jumlah * pr.harga) AS pendapatan FROM detail_pesanan d JOIN pesanan s ON s.id = d.pesanan_id JOIN produk pr ON pr.id = d.produk_id WHERE s.status = 'selesai' GROUP BY pr.kategori;"},
   pts:['Ikuti jalur relasi tabel demi tabel.','Satu JOIN = satu kondisi ON.','Hasil terlalu besar? Periksa kondisi ON.','Agregasi dilakukan setelah semua tabel tergabung.'],
   q:[['Berapa JOIN untuk menggabungkan 4 tabel?',['2','3','4'],1,'Setiap JOIN menambah satu tabel.'],
      ['Gejala lupa kondisi ON?',['Hasil kosong','Baris berlipat ganda','Error sintaks selalu'],1,'Tanpa syarat, terjadi kombinasi kartesius.']]}
 ]},
{t:'Subquery',lvl:'Menengah',d:'Query di dalam query: skalar, kolom, tabel, bersarang, dan berkorelasi.',
 nodes:['Sub Queries','Scalar','Nested Subqueries','Correlated Subqueries'],
 lessons:[
  {k:'s',t:'Subquery skalar, kolom & tabel',nodes:['Sub Queries','Scalar','Nested Subqueries'],
   b:['<b>Subquery</b> adalah SELECT di dalam kurung yang dipakai oleh query lain. Bentuknya menentukan di mana ia boleh dipakai. <b>Skalar</b> mengembalikan satu nilai, bisa dipakai di mana pun nilai tunggal diperlukan, misalnya <code>WHERE harga &gt; (SELECT AVG(harga) FROM produk)</code>.',
      'Subquery <b>kolom</b> mengembalikan satu kolom banyak baris, dipakai bersama <code>IN</code>, <code>ANY</code>, atau <code>ALL</code>. Subquery <b>tabel</b> mengembalikan banyak kolom dan baris, dipakai di FROM sebagai tabel sementara (wajib diberi alias).',
      'Subquery bisa <b>bersarang</b> beberapa tingkat. Database menjalankan yang paling dalam lebih dulu. Jika sudah lebih dari dua tingkat, pertimbangkan CTE (WITH) agar lebih mudah dibaca.'],
   ex:[['Skalar: di atas rata-rata','SELECT nama, harga FROM produk\nWHERE harga > (SELECT AVG(harga) FROM produk);'],['Kolom: pelanggan yang pernah memesan','SELECT nama FROM pelanggan\nWHERE id IN (SELECT pelanggan_id FROM pesanan);'],['Tabel: di FROM','SELECT kategori, rata FROM (\n  SELECT kategori, AVG(harga) AS rata FROM produk GROUP BY kategori\n) AS t\nWHERE rata > 40000;'],['Bersarang: pembeli Kopi Gayo','SELECT nama FROM pelanggan WHERE id IN (\n  SELECT pelanggan_id FROM pesanan WHERE id IN (\n    SELECT pesanan_id FROM detail_pesanan WHERE produk_id = (\n      SELECT id FROM produk WHERE nama = \'Kopi Gayo\')));']],
   task:{q:'Tampilkan nama dan harga produk termahal memakai subquery skalar MAX.',a:'SELECT nama, harga FROM produk WHERE harga = (SELECT MAX(harga) FROM produk);'},
   pts:['Skalar = satu nilai; kolom = satu kolom; tabel = banyak kolom.','Subquery di FROM wajib alias.','IN untuk subquery kolom.','Bersarang dijalankan dari dalam ke luar.'],
   q:[['Subquery di <code>WHERE harga &gt; (...)</code> harus mengembalikan?',['Satu nilai','Satu tabel','Satu kolom banyak baris'],0,'Perbandingan > butuh nilai tunggal.'],
      ['Operator untuk subquery yang mengembalikan banyak baris?',['=','IN','LIKE'],1,'IN memeriksa keanggotaan.']]},
  {k:'s',t:'Correlated subquery & EXISTS',nodes:['Correlated Subqueries','Reducing Subqueries'],
   b:['<b>Correlated subquery</b> memakai kolom dari query luar, sehingga ia dihitung ulang untuk setiap baris luar. Contoh: "karyawan yang gajinya di atas rata-rata <i>divisinya sendiri</i>". Subquery butuh divisi dari baris karyawan yang sedang diperiksa.',
      '<code>EXISTS (subquery)</code> bernilai benar jika subquery menghasilkan minimal satu baris. Ia biasanya ditulis sebagai correlated subquery: "pelanggan yang punya pesanan berstatus dikirim". <code>NOT EXISTS</code> untuk kebalikannya.',
      'Correlated subquery mudah dibaca tetapi bisa lambat pada tabel besar karena dijalankan berulang. Sering kali query yang sama bisa ditulis ulang dengan JOIN atau window function. Database modern juga cukup pintar mengoptimalkannya.'],
   ex:[['Di atas rata-rata divisinya','SELECT k.nama, k.divisi, k.gaji\nFROM karyawan k\nWHERE k.gaji > (SELECT AVG(x.gaji) FROM karyawan x WHERE x.divisi = k.divisi);'],['EXISTS','SELECT nama FROM pelanggan p\nWHERE EXISTS (SELECT 1 FROM pesanan s WHERE s.pelanggan_id = p.id AND s.status = \'dikirim\');'],['NOT EXISTS: belum pernah memesan','SELECT nama FROM pelanggan p\nWHERE NOT EXISTS (SELECT 1 FROM pesanan s WHERE s.pelanggan_id = p.id);'],['Subquery di SELECT','SELECT nama,\n  (SELECT COUNT(*) FROM pesanan s WHERE s.pelanggan_id = p.id) AS banyak_pesanan\nFROM pelanggan p ORDER BY banyak_pesanan DESC;']],
   task:{q:'Tampilkan nama produk yang pernah dipesan minimal sekali, memakai EXISTS.',a:'SELECT nama FROM produk pr WHERE EXISTS (SELECT 1 FROM detail_pesanan d WHERE d.produk_id = pr.id);'},
   pts:['Correlated = memakai kolom query luar.','Dihitung ulang per baris luar.','EXISTS benar jika ada minimal satu baris.','Bisa ditulis ulang dengan JOIN untuk performa.'],
   q:[['Ciri correlated subquery?',['Memakai kolom dari query luar','Selalu di FROM','Selalu mengembalikan satu baris'],0,'Ia bergantung pada baris luar.'],
      ['<code>SELECT 1</code> di dalam EXISTS dipakai karena?',['Wajib','Isi kolom tidak penting, hanya ada tidaknya baris','Lebih akurat'],1,'EXISTS hanya peduli ada atau tidak.']]}
 ]},
{t:'Fungsi lanjutan',lvl:'Menengah',d:'Fungsi angka, teks, tanggal, dan kondisional.',
 nodes:['Advanced Functions','ABS','ROUND','CEILING','FLOOR','MOD','CONCAT','LENGTH','SUBSTRING','REPLACE','UPPER','LOWER','DATE','TIME','TIMESTAMP','DATEPART','DATEADD','CASE','NULLIF','COALESCE'],
 lessons:[
  {k:'s',t:'Fungsi angka & teks',nodes:['Advanced Functions','ABS','ROUND','CEILING','FLOOR','MOD','CONCAT','LENGTH','SUBSTRING','REPLACE','UPPER','LOWER'],
   b:['Fungsi <b>angka</b>: <code>ABS</code> nilai mutlak, <code>ROUND(x, n)</code> membulatkan ke n desimal, <code>CEILING</code>/<code>CEIL</code> ke atas, <code>FLOOR</code> ke bawah, <code>MOD(a, b)</code> atau <code>a % b</code> sisa bagi.',
      'Fungsi <b>teks</b>: <code>UPPER</code>/<code>LOWER</code> mengubah huruf, <code>LENGTH</code> panjang teks, <code>SUBSTRING(teks, mulai, panjang)</code> mengambil potongan (posisi mulai dari 1), <code>REPLACE</code> mengganti, dan <code>CONCAT</code> atau operator <code>||</code> untuk menyambung.',
      'Nama fungsi sedikit berbeda antar database (misalnya <code>LEN</code> di SQL Server, <code>CHAR_LENGTH</code> di MySQL), tetapi konsepnya sama. Simulator ini menerima beberapa variasi nama yang umum.'],
   ex:[['Fungsi angka','SELECT ABS(-7) AS mutlak, ROUND(85000 * 1.11, -2) AS bulat_ratusan,\n       CEILING(4.1) AS atas, FLOOR(4.9) AS bawah, MOD(17, 5) AS sisa;'],['Harga per 1000 dibulatkan','SELECT nama, ROUND(harga / 1000.0, 1) AS ribu FROM produk;'],['Fungsi teks','SELECT UPPER(nama) AS besar, LOWER(kategori) AS kecil, LENGTH(nama) AS panjang,\n       SUBSTRING(nama, 1, 4) AS awal, REPLACE(nama, \' \', \'_\') AS slug\nFROM produk;'],['Menyambung teks','SELECT CONCAT(nama, \' (\', kota, \')\') AS label, nama || \' - \' || COALESCE(kota, \'?\') AS label2\nFROM pelanggan;']],
   task:{q:'Tampilkan nama pelanggan dalam huruf besar (alias nama_besar) dan 3 huruf pertama kotanya (alias kode_kota), untuk pelanggan yang kotanya tidak NULL.',a:'SELECT UPPER(nama) AS nama_besar, SUBSTRING(kota, 1, 3) AS kode_kota FROM pelanggan WHERE kota IS NOT NULL;'},
   pts:['ROUND, CEILING, FLOOR, ABS, MOD untuk angka.','UPPER, LOWER, LENGTH, SUBSTRING, REPLACE, CONCAT untuk teks.','SUBSTRING dimulai dari posisi 1.','CONCAT mengabaikan NULL; || dengan NULL menghasilkan NULL.'],
   q:[["<code>SUBSTRING('Jakarta', 2, 3)</code>?",["'Jak'","'aka'","'kar'"],1,'Mulai huruf ke-2, ambil 3 huruf.'],
      ['<code>FLOOR(7.9)</code>?',['8','7','7.9'],1,'FLOOR selalu ke bawah.']]},
  {k:'s',t:'Fungsi tanggal & waktu',nodes:['DATE','TIME','TIMESTAMP','DATEPART','DATEADD'],
   b:['Setiap database punya fungsi tanggal sendiri. Di SQLite (dan simulator ini) tanggal disimpan sebagai teks ISO <code>YYYY-MM-DD</code>, lalu diolah dengan <code>DATE</code>, <code>TIME</code>, <code>DATETIME</code>/<code>TIMESTAMP</code>, dan <code>STRFTIME</code>. Contoh: <code>DATE(\'2024-10-28\', \'+7 days\')</code>.',
      'SQL Server memakai <code>DATEADD(day, 7, tanggal)</code> untuk menambah dan <code>DATEPART(month, tanggal)</code> untuk mengambil bagian tanggal. PostgreSQL memakai <code>tanggal + INTERVAL \'7 days\'</code> dan <code>EXTRACT(MONTH FROM tanggal)</code>. Simulator ini juga menerima DATEADD, DATEPART, DATEDIFF, dan EXTRACT supaya kamu bisa mencoba gaya-gaya itu.',
      'Tanggal ISO bisa dibandingkan dan diurutkan seperti teks biasa karena urutannya tahun, bulan, lalu hari. Itu sebabnya format ini sangat dianjurkan.'],
   ex:[['Gaya SQLite','SELECT DATE(\'2024-10-28\', \'+7 days\') AS seminggu,\n       DATE(\'2024-10-28\', \'start of month\') AS awal_bulan,\n       STRFTIME(\'%d/%m/%Y\', \'2024-10-28\') AS format_indo;'],['Gaya SQL Server: DATEADD & DATEPART','SELECT id, tanggal,\n       DATEADD(day, 3, tanggal) AS estimasi_tiba,\n       DATEPART(month, tanggal) AS bulan\nFROM pesanan;'],['Selisih hari & EXTRACT','SELECT nama, bergabung,\n       DATEDIFF(day, bergabung, \'2024-12-31\') AS hari_menjadi_member,\n       EXTRACT(YEAR FROM bergabung) AS tahun\nFROM pelanggan;'],['Waktu sekarang','SELECT CURRENT_DATE AS hari_ini, CURRENT_TIMESTAMP AS sekarang;']],
   task:{q:'Tampilkan id pesanan dan tanggal jatuh tempo (alias jatuh_tempo) yaitu 14 hari setelah tanggal pesanan, untuk pesanan berstatus baru.',a:"SELECT id, DATE(tanggal, '+14 days') AS jatuh_tempo FROM pesanan WHERE status = 'baru';"},
   pts:['Simpan tanggal dalam format ISO.','SQLite: DATE/STRFTIME dengan pengubah teks.','SQL Server: DATEADD, DATEPART, DATEDIFF.','PostgreSQL: INTERVAL dan EXTRACT.'],
   q:[["<code>DATE('2024-01-31', '+1 day')</code>?",["'2024-01-32'","'2024-02-01'","Error"],1,'Fungsi tanggal paham panjang bulan.'],
      ['Kenapa format YYYY-MM-DD bisa diurutkan seperti teks?',['Kebetulan','Urutan karakternya tahun, bulan, hari','Karena ada tanda minus'],1,'Bagian terbesar di depan.']]},
  {k:'s',t:'CASE, COALESCE & NULLIF',nodes:['CASE','COALESCE','NULLIF'],
   b:['<code>CASE</code> adalah if-else di dalam SQL. Bentuknya <code>CASE WHEN kondisi THEN nilai ... ELSE nilai END</code>. Ia bisa dipakai di SELECT untuk membuat label, di ORDER BY untuk urutan khusus, bahkan di dalam SUM untuk menghitung bersyarat.',
      '<code>COALESCE(a, b, c)</code> mengembalikan nilai pertama yang tidak NULL. Sangat berguna untuk memberi nilai cadangan: <code>COALESCE(kota, \'Belum diisi\')</code>.',
      '<code>NULLIF(a, b)</code> mengembalikan NULL jika a sama dengan b. Trik klasiknya mencegah pembagian dengan nol: <code>total / NULLIF(jumlah, 0)</code>.'],
   ex:[['Label dengan CASE','SELECT nama, harga,\n  CASE WHEN harga >= 75000 THEN \'premium\'\n       WHEN harga >= 30000 THEN \'menengah\'\n       ELSE \'hemat\' END AS kelas\nFROM produk;'],['Menghitung bersyarat','SELECT COUNT(*) AS semua,\n  SUM(CASE WHEN status = \'selesai\' THEN 1 ELSE 0 END) AS selesai,\n  SUM(CASE WHEN status = \'batal\' THEN 1 ELSE 0 END) AS batal\nFROM pesanan;'],['COALESCE','SELECT nama, COALESCE(kota, \'Belum diisi\') AS kota FROM pelanggan;'],['NULLIF mencegah bagi nol','SELECT nama, stok, harga / NULLIF(stok, 0) AS harga_per_stok FROM produk;']],
   task:{q:"Tampilkan nama produk dan status stok (alias status_stok): 'habis' jika stok 0, 'menipis' jika stok di bawah 50, selain itu 'aman'.",a:"SELECT nama, CASE WHEN stok = 0 THEN 'habis' WHEN stok < 50 THEN 'menipis' ELSE 'aman' END AS status_stok FROM produk;"},
   pts:['CASE WHEN ... THEN ... ELSE ... END.','Kondisi dicek berurutan; yang pertama benar dipakai.','COALESCE = nilai cadangan untuk NULL.','NULLIF(x, 0) mencegah pembagian dengan nol.'],
   q:[["<code>COALESCE(NULL, NULL, 'x', 'y')</code>?",["NULL","'x'","'y'"],1,'Nilai pertama yang tidak NULL.'],
      ['CASE tanpa ELSE dan tidak ada kondisi yang cocok menghasilkan?',['0',"''",'NULL'],2,'ELSE bawaan adalah NULL.']]}
 ]},
{t:'View & index',lvl:'Lanjutan',d:'Menyimpan query sebagai view, dan mempercepat pencarian dengan index.',
 nodes:['Views','Creating Views','Modifying Views','Dropping Views','Indexes','Managing Indexes','Query Optimization','Using Indexes'],
 lessons:[
  {k:'s',t:'View: query yang disimpan',nodes:['Views','Creating Views','Modifying Views','Dropping Views'],
   b:['<b>View</b> adalah query SELECT yang disimpan dengan sebuah nama, lalu dipakai seperti tabel. View tidak menyimpan data sendiri: setiap kali dipanggil, query aslinya dijalankan ulang, sehingga hasilnya selalu mengikuti data terbaru.',
      'Kegunaannya: menyederhanakan query rumit yang sering dipakai (misalnya laporan penjualan dengan 4 JOIN), memberi nama yang bermakna, dan membatasi akses, misalnya tim marketing hanya diberi akses ke view tanpa kolom sensitif.',
      'Buat dengan <code>CREATE VIEW</code>, ubah dengan <code>CREATE OR REPLACE VIEW</code> (PostgreSQL/MySQL) atau DROP lalu CREATE ulang, dan hapus dengan <code>DROP VIEW</code>. Menghapus view tidak menyentuh tabel aslinya.'],
   ex:[['Buat view laporan','CREATE VIEW v_penjualan AS\nSELECT s.id AS pesanan, p.nama AS pembeli, SUM(d.jumlah * pr.harga) AS total\nFROM pesanan s\nJOIN pelanggan p ON p.id = s.pelanggan_id\nJOIN detail_pesanan d ON d.pesanan_id = s.id\nJOIN produk pr ON pr.id = d.produk_id\nGROUP BY s.id, p.nama;\nSELECT * FROM v_penjualan WHERE total > 100000 ORDER BY total DESC;'],['View selalu mengikuti data terbaru','CREATE VIEW v_habis AS SELECT nama FROM produk WHERE stok = 0;\nUPDATE produk SET stok = 0 WHERE id = 6;\nSELECT * FROM v_habis;'],['Ubah lalu hapus','CREATE VIEW v_kota AS SELECT DISTINCT kota FROM pelanggan;\nCREATE OR REPLACE VIEW v_kota AS SELECT DISTINCT kota FROM pelanggan WHERE kota IS NOT NULL;\nSELECT * FROM v_kota;\nDROP VIEW v_kota;']],
   task:{q:'Buat view bernama v_minuman berisi nama dan harga produk berkategori Minuman.',a:"CREATE VIEW v_minuman AS SELECT nama, harga FROM produk WHERE kategori = 'Minuman';",check:'SELECT * FROM v_minuman;'},
   pts:['View = query bernama, dipakai seperti tabel.','Data tidak disalin; selalu terbaru.','Untuk menyederhanakan dan membatasi akses.','DROP VIEW tidak menghapus tabel.'],
   q:[['Data di view disimpan di mana?',['Di view itu sendiri','Tetap di tabel asal; view menjalankan ulang query','Di file terpisah'],1,'View hanyalah query tersimpan.'],
      ['Cara mengubah definisi view di PostgreSQL?',['ALTER VIEW SET','CREATE OR REPLACE VIEW','UPDATE VIEW'],1,'Definisi diganti dengan query baru.']]},
  {k:'s',t:'Index: mempercepat pencarian',nodes:['Indexes','Managing Indexes','Using Indexes','Query Optimization'],viz:'index',
   b:['Tanpa index, mencari pelanggan dari kota tertentu berarti database membaca <b>setiap baris</b> (full table scan). Untuk 10 juta baris, itu lambat. <b>Index</b> adalah struktur tambahan yang menyimpan nilai kolom secara terurut beserta penunjuk ke barisnya, seperti indeks di belakang buku. Database bisa langsung melompat ke lokasi yang tepat dengan pencarian biner.',
      'Index mempercepat WHERE, JOIN, dan ORDER BY pada kolom yang diindeks, tetapi ada harganya: memakan ruang dan memperlambat INSERT, UPDATE, DELETE karena index juga harus diperbarui. Jadi buat index untuk kolom yang sering dicari, bukan untuk semua kolom.',
      'Gunakan <code>EXPLAIN QUERY PLAN</code> (SQLite) atau <code>EXPLAIN</code> (PostgreSQL/MySQL) untuk melihat apakah database melakukan SCAN (baca semua) atau SEARCH (memakai index).'],
   ex:[['Sebelum index: SCAN','EXPLAIN QUERY PLAN SELECT * FROM pelanggan WHERE kota = \'Jakarta\';'],['Buat index lalu cek lagi','CREATE INDEX idx_pelanggan_kota ON pelanggan(kota);\nEXPLAIN QUERY PLAN SELECT * FROM pelanggan WHERE kota = \'Jakarta\';'],['Primary key sudah terindeks','EXPLAIN QUERY PLAN SELECT * FROM produk WHERE id = 3;'],['UNIQUE index menolak duplikat','CREATE UNIQUE INDEX idx_produk_nama ON produk(nama);\nINSERT INTO produk (nama, kategori, harga) VALUES (\'Kopi Gayo\', \'Minuman\', 1000);'],['Hapus index','CREATE INDEX idx_tmp ON pesanan(status);\nDROP INDEX idx_tmp;']],
   task:{q:'Buat index bernama idx_pesanan_tanggal pada kolom tanggal di tabel pesanan.',a:'CREATE INDEX idx_pesanan_tanggal ON pesanan(tanggal);',check:"EXPLAIN QUERY PLAN SELECT * FROM pesanan WHERE tanggal = '2024-10-01';"},
   pts:['Index = daftar terurut + penunjuk baris.','SCAN membaca semua; SEARCH memakai index.','Index mempercepat baca, memperlambat tulis.','Index kolom yang sering ada di WHERE dan JOIN.'],
   q:[['Kerugian membuat terlalu banyak index?',['Query SELECT lambat','INSERT/UPDATE lebih lambat dan butuh ruang','Data hilang'],1,'Setiap index ikut diperbarui saat data berubah.'],
      ['Perintah untuk melihat rencana eksekusi?',['SHOW PLAN','EXPLAIN','DESCRIBE'],1,'EXPLAIN menunjukkan cara database menjalankan query.']]}
 ]},
{t:'Transaksi',lvl:'Lanjutan',d:'BEGIN, COMMIT, ROLLBACK, SAVEPOINT, ACID, dan tingkat isolasi.',
 nodes:['Transactions','BEGIN','COMMIT','ROLLBACK','SAVEPOINT','ACID','Transaction Isolation Levels'],
 lessons:[
  {k:'s',t:'BEGIN, COMMIT, ROLLBACK & SAVEPOINT',nodes:['Transactions','BEGIN','COMMIT','ROLLBACK','SAVEPOINT'],viz:'txn',
   b:['Transfer Rp100.000 dari Andi ke Budi terdiri dari dua UPDATE: kurangi saldo Andi, tambah saldo Budi. Bagaimana jika listrik padam di antara keduanya? Uang hilang. <b>Transaksi</b> menyatukan beberapa perintah menjadi satu kesatuan: semua berhasil, atau tidak ada sama sekali.',
      'Mulai dengan <code>BEGIN</code>. Perubahan setelahnya masih sementara. <code>COMMIT</code> menyimpannya secara permanen, sedangkan <code>ROLLBACK</code> membatalkan semuanya kembali ke kondisi sebelum BEGIN.',
      '<code>SAVEPOINT nama</code> membuat titik simpan di tengah transaksi. <code>ROLLBACK TO nama</code> membatalkan hanya perubahan setelah titik itu, sementara transaksi tetap berjalan. Ikuti visualisasinya, lalu coba sendiri di editor.'],
   ex:[['Transfer yang di-COMMIT','BEGIN;\nUPDATE rekening SET saldo = saldo - 100000 WHERE id = 1;\nUPDATE rekening SET saldo = saldo + 100000 WHERE id = 2;\nCOMMIT;\nSELECT * FROM rekening;'],['Dibatalkan dengan ROLLBACK','BEGIN;\nUPDATE rekening SET saldo = 0;\nSELECT * FROM rekening;\nROLLBACK;\nSELECT * FROM rekening;'],['SAVEPOINT','BEGIN;\nUPDATE rekening SET saldo = saldo + 50000 WHERE id = 1;\nSAVEPOINT bonus;\nUPDATE rekening SET saldo = saldo + 999999 WHERE id = 2;\nROLLBACK TO bonus;\nCOMMIT;\nSELECT * FROM rekening;']],
   task:{q:'Dalam satu transaksi, pindahkan saldo 50000 dari rekening 2 ke rekening 1, lalu COMMIT.',a:'BEGIN; UPDATE rekening SET saldo = saldo - 50000 WHERE id = 2; UPDATE rekening SET saldo = saldo + 50000 WHERE id = 1; COMMIT;',check:'SELECT id, saldo FROM rekening ORDER BY id;'},
   pts:['BEGIN → perintah-perintah → COMMIT atau ROLLBACK.','Semua atau tidak sama sekali.','SAVEPOINT untuk membatalkan sebagian.','Di luar transaksi, setiap perintah otomatis di-commit (autocommit).'],
   q:[['Perintah untuk membatalkan semua perubahan sejak BEGIN?',['COMMIT','ROLLBACK','UNDO'],1,'ROLLBACK kembali ke kondisi awal.'],
      ['Apa yang terjadi pada ROLLBACK TO savepoint?',['Transaksi selesai','Perubahan setelah savepoint dibatalkan, transaksi lanjut','Semua dibatalkan'],1,'Hanya sebagian yang dibatalkan.']]},
  {k:'s',t:'ACID & tingkat isolasi',nodes:['ACID','Transaction Isolation Levels'],viz:'isolation',
   b:['Transaksi yang baik memenuhi <b>ACID</b>. <b>Atomicity</b>: semua atau tidak sama sekali. <b>Consistency</b>: data selalu berpindah dari keadaan valid ke keadaan valid, semua constraint terpenuhi. <b>Isolation</b>: transaksi yang berjalan bersamaan tidak saling mengacaukan. <b>Durability</b>: setelah COMMIT, data bertahan meski server mati.',
      'Isolasi sempurna itu mahal, jadi database menawarkan beberapa <b>tingkat isolasi</b>. Dari yang paling longgar: <code>READ UNCOMMITTED</code> (bisa membaca data yang belum di-commit, disebut dirty read), <code>READ COMMITTED</code> (default PostgreSQL), <code>REPEATABLE READ</code> (default MySQL InnoDB), dan <code>SERIALIZABLE</code> (paling ketat, seolah transaksi berjalan bergiliran).',
      'Semakin ketat, semakin sedikit anomali (dirty read, non-repeatable read, phantom read), tetapi semakin besar kemungkinan transaksi saling menunggu atau dibatalkan. Simulator ini berjalan untuk satu pengguna, jadi bagian ini dipelajari lewat visualisasi dan contoh sintaks.'],
   ex:[['Atomicity: satu gagal, semua batal','BEGIN;\nUPDATE rekening SET saldo = saldo + 100000 WHERE id = 2;\nUPDATE rekening SET saldo = saldo - 900000 WHERE id = 1;\n-- perintah kedua melanggar CHECK (saldo >= 0)\nROLLBACK;\nSELECT * FROM rekening;']],
   syn:['PostgreSQL / MySQL',R`-- PostgreSQL
BEGIN TRANSACTION ISOLATION LEVEL SERIALIZABLE;
SELECT saldo FROM rekening WHERE id = 1;
UPDATE rekening SET saldo = saldo - 100000 WHERE id = 1;
COMMIT;

-- MySQL
SET TRANSACTION ISOLATION LEVEL READ COMMITTED;
START TRANSACTION;
...
COMMIT;`],
   pts:['ACID: Atomicity, Consistency, Isolation, Durability.','Empat tingkat isolasi: READ UNCOMMITTED → SERIALIZABLE.','Anomali: dirty read, non-repeatable read, phantom read.','Lebih ketat = lebih aman, tetapi lebih banyak saling tunggu.'],
   q:[['Huruf ACID yang menjamin data tetap ada setelah COMMIT walau server mati?',['Atomicity','Durability','Isolation'],1,'Durability = tahan lama.'],
      ['Membaca data transaksi lain yang belum di-commit disebut?',['Dirty read','Phantom read','Deadlock'],0,'Hanya terjadi di READ UNCOMMITTED.']]}
 ]},
{t:'Keamanan & prosedur',lvl:'Lanjutan',d:'Hak akses, praktik keamanan, SQL injection, serta stored procedure dan function.',
 nodes:['Data Integrity & Security','Data Integrity Constraints','GRANT and REVOKE','DB Security Best Practices','Stored Procedures and Functions'],
 lessons:[
  {k:'s',t:'GRANT, REVOKE & SQL injection',nodes:['Data Integrity & Security','GRANT and REVOKE','DB Security Best Practices','Data Integrity Constraints'],viz:'injection',
   b:['Prinsip <b>hak akses minimum</b> (least privilege): setiap pengguna dan aplikasi hanya diberi izin yang benar-benar diperlukan. <code>GRANT SELECT ON produk TO kasir</code> memberi izin membaca, <code>REVOKE</code> mencabutnya. Aplikasi web sebaiknya tidak memakai akun admin database.',
      'Ancaman paling terkenal adalah <b>SQL injection</b>: input pengguna disambung langsung ke teks query, sehingga penyerang bisa menyisipkan perintah SQL sendiri. Input <code>\' OR \'1\'=\'1</code> di form login bisa membuat kondisi WHERE selalu benar. Visualisasi di bawah memperlihatkan bagaimana query berubah.',
      'Pertahanannya: <b>selalu pakai parameterized query / prepared statement</b> (tanda <code>?</code> atau <code>$1</code>), validasi input, batasi hak akses, enkripsi data sensitif, simpan password sebagai hash, dan cadangkan database secara rutin. Integritas data juga dijaga oleh constraint yang sudah kamu pelajari.'],
   ex:[['GRANT dan REVOKE (disimulasikan)','GRANT SELECT, INSERT ON pesanan TO kasir;\nREVOKE INSERT ON pesanan FROM kasir;'],['Inilah yang terjadi saat input disambung mentah-mentah','-- input pengguna: \' OR \'1\'=\'1\nSELECT * FROM pelanggan WHERE nama = \'\' OR \'1\'=\'1\';']],
   syn:['Kode aplikasi: aman vs tidak aman',R`# TIDAK AMAN (Python): input disambung ke query
q = "SELECT * FROM pengguna WHERE email = '" + email + "'"
cursor.execute(q)

# AMAN: parameterized query
cursor.execute("SELECT * FROM pengguna WHERE email = %s", (email,))

// AMAN (Java JDBC)
PreparedStatement ps = con.prepareStatement("SELECT * FROM pengguna WHERE email = ?");
ps.setString(1, email);`],
   pts:['Least privilege: beri izin seperlunya.','GRANT memberi, REVOKE mencabut.','Jangan pernah menyambung input ke query; pakai parameter.','Hash password, enkripsi data sensitif, backup rutin.'],
   q:[["Kenapa input <code>' OR '1'='1</code> berbahaya?",['Membuat database lambat','Mengubah logika WHERE menjadi selalu benar','Menghapus tabel otomatis'],1,'Penyerang mendapat semua baris.'],
      ['Pertahanan utama terhadap SQL injection?',['Menyembunyikan nama tabel','Parameterized query','Memakai huruf besar'],1,'Data dan perintah dikirim terpisah.']]},
  {k:'s',t:'Stored procedure & function',nodes:['Stored Procedures and Functions'],
   b:['<b>Stored procedure</b> adalah kumpulan perintah SQL yang disimpan di dalam database dengan sebuah nama, bisa menerima parameter, dan dipanggil dengan <code>CALL nama(...)</code>. <b>Function</b> mirip, tetapi mengembalikan nilai dan bisa dipakai di dalam SELECT.',
      'Kelebihannya: logika yang dipakai banyak aplikasi tersimpan di satu tempat, lebih sedikit bolak-balik jaringan, dan hak akses bisa diberikan ke procedure tanpa membuka tabelnya. Kekurangannya: lebih sulit dites, di-version control, dan dipindah antar jenis database.',
      'Sintaksnya sangat berbeda antar database (PL/pgSQL di PostgreSQL, T-SQL di SQL Server, dan versi MySQL). SQLite tidak punya stored procedure, sehingga bagian ini disajikan sebagai contoh untuk dibaca. Di simulator, kamu bisa meniru function sederhana memakai view atau ekspresi.'],

/* ===================== VISUALISASI v2 =====================
   Dipakai pelajaran jalur (c dan s). Setiap fungsi: VIZ2[nama](host, {lang, lesson}).
   Animasi memakai FLIP (posisi lama -> baru) dan menghormati prefers-reduced-motion. */
const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
let VUID=0;
function flip(root,render){
  const pos=new Map();
  root.querySelectorAll('[data-key]').forEach(e=>pos.set(e.dataset.key,e.getBoundingClientRect()));
  render();
  if(RM()||!pos.size)return;
  root.querySelectorAll('[data-key]').forEach(e=>{
    const p=pos.get(e.dataset.key),r=e.getBoundingClientRect();
    if(!e.animate)return;
    if(p){const dx=p.left-r.left,dy=p.top-r.top;if(Math.abs(dx)>1||Math.abs(dy)>1)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:520,easing:'cubic-bezier(.2,.75,.2,1)'})}
    else e.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:360,easing:'ease-out'});
  });
}
const fv=v=>v==null?'<i class="nul">NULL</i>':esc(SQLE.fmt(v));
const rupiah=n=>'Rp'+Number(n).toLocaleString('id-ID');
function rtable(cols,rows,o={}){
  const max=o.max||40,shown=rows.slice(0,max);
  return `<div class="rt"><table><thead><tr>${o.lead?`<th class="lead">${o.lead===true?'':esc(o.lead)}</th>`:''}${cols.map((c,i)=>`<th class="${o.colCls?o.colCls(i):''}">${esc(c)}</th>`).join('')}</tr></thead><tbody>${shown.map(r=>`<tr ${r.k!=null?`data-key="${r.k}"`:''} class="${r.cls||''}">${o.lead?`<td class="lead">${r.tag||''}</td>`:''}${r.v.map((x,i)=>`<td class="${r.cc?r.cc(i):''}">${r.raw?x:fv(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>max?`<p class="v-more">… dan ${rows.length-max} baris lagi</p>`:''}`;
}
const LBL={java:{t:'Java'},python:{t:'Python'}};

/* ---------- pipeline query: urutan logis eksekusi SELECT ---------- */
const CLAUSES=['FROM','WHERE','GROUP BY','HAVING','SELECT','DISTINCT','ORDER BY','LIMIT'];
function pipeFrames(db,sql){
  let res;
  try{res=SQLE.exec(SQLE.clone(db),sql,{trace:true})}catch(e){return {err:e.message}}
  const last=res[res.length-1],t=last&&last.trace;
  if(!t||!t.from||!t.select)return {err:'Penjelasan langkah tersedia untuk satu query SELECT (tanpa UNION). Jalankan query SELECT lalu coba lagi.'};
  const F=[],fr=t.from,cols=fr.cols,all=fr.rows.map((v,i)=>({k:'f'+i,v}));
  const tb=fr.tables.join(', ');
  F.push({c:'FROM',cols,rows:all,note:t.join
    ?`<b>FROM + ${t.join.comma?'CROSS':t.join.type} JOIN</b> memasangkan baris ${esc(t.join.left.label)} dengan ${esc(t.join.right.label)}. Hasilnya ${fr.rows.length} baris gabungan. Sel <i class="nul">NULL</i> berarti tidak ada pasangan.`
    :`<b>FROM ${esc(tb)}</b> dijalankan paling awal: database mengambil semua ${fr.rows.length} baris dari tabel.`});
  let kept=fr.rows.map((_,i)=>i);
  if(t.where){const K=t.where.keep,n=K.filter(Boolean).length;
    F.push({c:'WHERE',cols,rows:all.map((r,i)=>({...r,cls:K[i]?'keep':'drop'})),note:`<b>WHERE</b> memeriksa kondisi pada setiap baris. ${n} baris lolos (hijau), ${K.length-n} baris dibuang (dicoret).`});
    kept=kept.filter(i=>K[i]);
    F.push({c:'WHERE',cols,rows:kept.map(i=>all[i]),note:`Tersisa ${kept.length} baris. Semua langkah berikutnya hanya melihat baris ini.`});
  }
  const S=t.select;let sk=null;
  if(t.group){const G=t.group.groups;
    const rows=G.flatMap((g,gi)=>g.idx.map((i,j)=>({k:'f'+i,v:fr.rows[i],cls:'g'+(gi%6),tag:j===0?esc(g.label||'(semua)'):''})));
    F.push({c:'GROUP BY',cols,rows,lead:'kelompok',note:`<b>GROUP BY</b> menyusun baris dengan nilai yang sama ke dalam ${G.length} kelompok. Satu kelompok nanti menjadi satu baris hasil.`});
    let gk=G.map((_,i)=>i);
    if(t.having){const K=t.having.keep;
      F.push({c:'HAVING',cols,lead:'kelompok',rows:rows.map(r=>{const gi=G.findIndex(g=>g.idx.includes(+r.k.slice(1)));return {...r,cls:r.cls+' '+(K[gi]?'keep':'drop')}}),
        note:`<b>HAVING</b> menyaring kelompok, bukan baris. ${K.filter(Boolean).length} kelompok lolos. Di sinilah syarat dengan COUNT, SUM, atau AVG ditulis.`});
      gk=gk.filter(i=>K[i]);}
    sk=gk.map(i=>G[i].idx.length?'f'+G[i].idx[0]:'s'+i);
  }else sk=kept.map(i=>'f'+i);
  if(sk.length!==S.rows.length)sk=S.rows.map((_,i)=>'s'+i);
  F.push({c:'SELECT',cols:S.cols,rows:S.rows.map((v,i)=>({k:sk[i],v})),note:t.group
    ?`<b>SELECT</b> menghitung kolom untuk setiap kelompok, misalnya COUNT atau SUM. Alias dengan AS baru lahir di sini.`
    :`<b>SELECT</b> memilih dan menghitung kolom yang diminta: ${S.cols.map(esc).join(', ')}.`});
  let idx=S.rows.map((_,i)=>i);
  if(t.distinct){const K=t.distinct.keep;
    F.push({c:'DISTINCT',cols:S.cols,rows:idx.map(i=>({k:sk[i],v:S.rows[i],cls:K[i]?'keep':'drop'})),note:`<b>DISTINCT</b> membuang baris kembar. ${K.filter(x=>!x).length} baris duplikat dicoret.`});
    idx=idx.filter(i=>K[i]);}
  if(t.order){idx=t.order.idx;
    F.push({c:'ORDER BY',cols:S.cols,rows:idx.map(i=>({k:sk[i],v:S.rows[i]})),note:`<b>ORDER BY</b> mengurutkan hasil. Karena dijalankan setelah SELECT, ORDER BY boleh memakai alias kolom.`});}
  if(t.limit){const L=t.limit;
    F.push({c:'LIMIT',cols:S.cols,rows:idx.map((i,j)=>({k:sk[i],v:S.rows[i],cls:j>=L.offset&&j<L.offset+L.n?'keep':'drop'})),note:`<b>LIMIT${L.offset?' / OFFSET':''}</b> mengambil ${L.n} baris${L.offset?` setelah melewati ${L.offset} baris`:' teratas'} dari ${L.from} baris.`});
    idx=idx.slice(L.offset,L.offset+L.n);
    F.push({c:'LIMIT',cols:S.cols,rows:idx.map(i=>({k:sk[i],v:S.rows[i]})),note:`Hasil akhir: ${idx.length} baris.`});}
  else F[F.length-1].note+=` Hasil akhir: ${idx.length} baris.`;
  return {F};
}
function sqlPipeline(host,db,sql){
  const p=pipeFrames(db,sql);
  if(p.err){host.innerHTML=`<p class="v-err">${esc(p.err)}</p>`;return}
  const order=CLAUSES.filter(c=>p.F.some(f=>f.c===c));
  player(host,p.F,(st,f)=>flip(st,()=>{const ci=order.indexOf(f.c);
    st.innerHTML=`<div class="v-pipe" aria-label="Urutan eksekusi">${order.map((c,i)=>`<span class="${i===ci?'cur':i<ci?'done':''}">${c}</span>`).join('<i aria-hidden="true">›</i>')}</div>${rtable(f.cols,f.rows,{lead:f.lead})}`}),{speed:1700});
}

/* ---------- JOIN ---------- */
function venn(type,ln,rn){
  const id='vc'+(++VUID),L=type==='LEFT'||type==='FULL',R=type==='RIGHT'||type==='FULL';
  return `<svg class="venn" viewBox="0 0 160 84" role="img" aria-label="Diagram ${type} JOIN"><defs><clipPath id="${id}"><circle cx="62" cy="42" r="30"/></clipPath></defs>
   <circle cx="62" cy="42" r="30" class="${L?'on':''}"/><circle cx="98" cy="42" r="30" class="${R?'on':''}"/>
   <circle cx="98" cy="42" r="30" clip-path="url(#${id})" class="on"/>
   <circle cx="62" cy="42" r="30" class="ln"/><circle cx="98" cy="42" r="30" class="ln"/>
   <text x="20" y="80">${ln}</text><text x="140" y="80" text-anchor="end">${rn}</text></svg>`;
}
function joinViz(host,mode){
  const self=mode==='SELF';
  const C=self?{L:'karyawan',la:'k',R:'karyawan',ra:'a',on:'k.atasan_id = a.id',lc:[0,1,3],rc:[0,1],sel:'k.nama AS karyawan, a.nama AS atasan',ln:'k (karyawan)',rn:'a (atasan)',res:['karyawan','atasan'],li:1,ri:1}
               :{L:'pelanggan',la:'p',R:'pesanan',ra:'s',on:'s.pelanggan_id = p.id',lc:[0,1],rc:[0,1],sel:'p.nama, s.id AS pesanan',ln:'pelanggan',rn:'pesanan',res:['nama','pesanan'],li:1,ri:0};
  const types=self?['INNER','LEFT']:['INNER','LEFT','RIGHT','FULL'];
  let type=mode==='LEFT'?'LEFT':'INNER';
  const db=SQLE.create(SEED.toko);
  host.innerHTML=`<div class="v-jhead"><div class="seg" role="group" aria-label="Jenis JOIN">${types.map(t=>`<button data-t="${t}" aria-pressed="${t===type}">${t}</button>`).join('')}</div><div class="v-jven"></div></div><pre class="code v-q"></pre><div class="pl"></div>`;
  const pl=$('.pl',host);let P;
  function build(){
    host.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===type));
    $('.v-jven',host).innerHTML=venn(type,C.ln,C.rn);
    const q=`SELECT ${C.sel}\nFROM ${C.L} ${C.la}\n${type} JOIN ${C.R} ${C.ra} ON ${C.on};`;
    $('.v-q',host).innerHTML=hl(q,'sql');
    const r=SQLE.exec(db,q,{trace:true})[0],j=r.trace.join,pairs=j.pairs;
    const frames=[{li:-1,upto:0,note:`Kiri: tabel <b>${esc(C.ln)}</b>. Kanan: <b>${esc(C.rn)}</b>. JOIN akan mencocokkan setiap baris kiri dengan baris kanan yang memenuhi <code>${esc(C.on)}</code>.`}];
    let n=0;
    j.left.rows.forEach((_,i)=>{const mine=pairs.map((p,k)=>[p,k]).filter(([p])=>p[0]===i);if(!mine.length)return;n+=mine.length;
      const miss=mine[0][0][1]==null;
      frames.push({li:i,ri:mine.map(([p])=>p[1]).filter(x=>x!=null),upto:n,note:miss
        ?`<b>${esc(j.left.rows[i][C.li])}</b> tidak punya pasangan. ${type==='LEFT'||type==='FULL'?`Karena ${type} JOIN, baris ini tetap masuk dengan kolom kanan berisi NULL.`:''}`
        :`<b>${esc(j.left.rows[i][C.li])}</b> cocok dengan ${mine.length} baris kanan, jadi menghasilkan ${mine.length} baris.`})});
    const skipped=j.left.rows.map((_,i)=>i).filter(i=>!pairs.some(p=>p[0]===i));
    if(skipped.length&&type!=='LEFT'&&type!=='FULL')frames.push({li:-1,miss:skipped,upto:n,note:`${skipped.map(i=>esc(j.left.rows[i][C.li])).join(', ')} tidak punya pasangan, jadi <b>dibuang</b> oleh ${type} JOIN.`});
    const ro=pairs.map((p,k)=>[p,k]).filter(([p])=>p[0]==null);
    if(ro.length){n+=ro.length;frames.push({li:-1,ri:ro.map(([p])=>p[1]),upto:n,note:`Baris kanan tanpa pasangan ikut masuk karena ${type} JOIN; kolom kiri berisi NULL.`})}
    frames[frames.length-1].note+=` Total ${r.rows.length} baris.`;
    const draw=(st,f)=>{
      const lrow=(v,i)=>`<li data-i="${i}" class="${f.li===i?'cur':''} ${f.miss&&f.miss.includes(i)?'miss':''} ${pairs.slice(0,f.upto).some(p=>p[0]===i)?'used':''}">${C.lc.map(c=>`<span>${fv(v[c])}</span>`).join('')}</li>`;
      const rrow=(v,i)=>`<li data-i="${i}" class="${f.ri&&f.ri.includes(i)?'cur':''} ${pairs.slice(0,f.upto).some(p=>p[1]===i)?'used':''}">${C.rc.map(c=>`<span>${fv(v[c])}</span>`).join('')}</li>`;
      st.innerHTML=`<div class="v-jn"><div><div class="v-cap">${esc(C.ln)} <small>${C.lc.map(c=>j.left.cols[c]).join(' · ')}</small></div><ol class="v-jl">${j.left.rows.map(lrow).join('')}</ol></div><svg class="v-jsvg" aria-hidden="true"></svg>
        <div><div class="v-cap">${esc(C.rn)} <small>${C.rc.map(c=>j.right.cols[c]).join(' · ')}</small></div><ol class="v-jl r">${j.right.rows.map(rrow).join('')}</ol></div></div>
        <div class="v-cap">Hasil (${f.upto} baris)</div>${rtable(C.res,r.rows.slice(0,f.upto).map((v,i)=>({k:'r'+i,v,cls:i>=f.upto-(f.ri?f.ri.length:0)-(f.li>=0?0:0)?'':''})),{max:30})}`;
      requestAnimationFrame(()=>lines(st,f));
    };
    function lines(st,f){
      const box=$('.v-jn',st);if(!box)return;const svg=$('.v-jsvg',st),B=box.getBoundingClientRect(),S=svg.getBoundingClientRect();
      const L=[...st.querySelectorAll('.v-jl:not(.r) li')],Rr=[...st.querySelectorAll('.v-jl.r li')];
      let h='';
      pairs.slice(0,f.upto).forEach(([a,b],k)=>{if(a==null||b==null)return;const A=L[a].getBoundingClientRect(),Z=Rr[b].getBoundingClientRect();
        const y1=A.top+A.height/2-S.top,y2=Z.top+Z.height/2-S.top,w=S.width;const cur=f.li===a;
        h+=`<path d="M0 ${y1} C ${w*.5} ${y1}, ${w*.5} ${y2}, ${w} ${y2}" class="${cur?'cur':''}" pathLength="1"/>`});
      svg.setAttribute('viewBox',`0 0 ${S.width} ${S.height}`);svg.innerHTML=h;
    }
    if(!P)P=player(pl,frames,draw,{speed:1300});else P.set(frames);
    P._d=draw;
  }
  host.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;type=b.dataset.t;P=null;pl.innerHTML='';build()});
  build();
}

/* ---------- index: SCAN lawan pencarian biner ---------- */
function indexViz(host){
  const N=32,vals=[];let s=7;for(let i=0;i<N;i++){s=(s*37+11)%97;vals.push(1000+s*500+i)}
  const sorted=[...vals].sort((a,b)=>a-b);
  host.innerHTML=`<div class="row"><label>Cari harga = <select class="inp v-tg">${[sorted[3],sorted[17],sorted[29],vals[30]].map((v,i)=>`<option value="${v}" ${i===2?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="pl"></div>`;
  const pl=$('.pl',host);let P;
  function build(){
    const tg=+$('.v-tg',host).value;const sc=vals.indexOf(tg);
    const bs=[];let lo=0,hi=N-1;while(lo<=hi){const m=(lo+hi)>>1;bs.push({lo,hi,m});if(sorted[m]===tg)break;if(sorted[m]<tg)lo=m+1;else hi=m-1}
    const steps=Math.max(sc+1,bs.length),fr=[];
    for(let k=0;k<steps;k++){const b=bs[Math.min(k,bs.length-1)];fr.push({k,s:Math.min(k,sc),b,sd:k>=sc,bd:k>=bs.length-1,
      note:k>=sc&&k>=bs.length-1?`Selesai. Tanpa index: <b>${sc+1}</b> baris dibaca. Dengan index: hanya <b>${bs.length}</b> langkah. Pada sejuta baris, bedanya sekitar 1.000.000 lawan 20.`
        :`Langkah ${k+1}. SCAN membaca baris satu per satu. Index yang terurut memotong wilayah pencarian jadi setengah setiap langkah.`})}
    const draw=(st,f)=>{st.innerHTML=`<div class="v-ix"><div class="v-cap">Tanpa index: <b>SCAN</b> tabel <span class="v-ct">${Math.min(f.k,f.s)+1} dibaca</span></div>
      ${cellsHTML(vals,i=>i===f.s?(f.sd?'found':'hl'):i<f.s?'seen':'',false)}
      <div class="v-cap">Dengan index: <b>SEARCH</b> lewat B-tree (urut) <span class="v-ct">${Math.min(f.k,bs.length-1)+1} langkah</span></div>
      ${cellsHTML(sorted,i=>i===f.b.m?(f.bd?'found':'hl'):(i<f.b.lo||i>f.b.hi)?'dim':'',false)}</div>`};
    if(!P)P=player(pl,fr,draw,{speed:700});else P.set(fr);
  }
  $('.v-tg',host).onchange=build;build();
}

function isolationViz(host){
  const LV=['READ UNCOMMITTED','READ COMMITTED','REPEATABLE READ','SERIALIZABLE'];let lv=1;
  host.innerHTML=`<div class="seg v-wrap" role="group" aria-label="Tingkat isolasi">${LV.map((l,i)=>`<button data-l="${i}" aria-pressed="${i===lv}">${l}</button>`).join('')}</div><div class="pl"></div><div class="v-iso-t"></div>`;
  const pl=$('.pl',host);let P;
  const steps=l=>[
    {s:'A',sql:'BEGIN;\nUPDATE rekening SET saldo = 0 WHERE id = 1;',note:'Sesi A mengubah saldo Andi menjadi 0, tapi <b>belum COMMIT</b>.'},
    {s:'B',sql:'SELECT saldo FROM rekening WHERE id = 1;',r:l===0?'0':'500000',bad:l===0&&'Dirty read',note:l===0?'Sesi B membaca data yang belum di-commit. Kalau A membatalkan, B memakai angka palsu.':'Sesi B tetap melihat 500000, karena perubahan A belum di-commit.'},
    {s:'A',sql:'COMMIT;',note:'Sesi A menyimpan perubahannya.'},
    {s:'B',sql:'SELECT saldo FROM rekening WHERE id = 1;',r:l<=1?'0':'500000',bad:l<=1&&'Non-repeatable read',note:l<=1?'Query yang sama di transaksi B memberi angka berbeda.':'B tetap melihat snapshot awal transaksinya: hasil konsisten.'},
    {s:'A',sql:"INSERT INTO rekening VALUES (3, 'Citra', 100000);\nCOMMIT;",note:'Sesi A menambah rekening baru.'},
    {s:'B',sql:'SELECT COUNT(*) FROM rekening;',r:l<=2?'3':'2',bad:l<=2&&'Phantom read',note:l<=2?'Muncul baris "hantu" yang tadinya tidak ada. (PostgreSQL sudah mencegah ini di REPEATABLE READ, standar SQL belum.)':'SERIALIZABLE: B seolah berjalan sendirian, tidak melihat baris baru.'}];
  const draw=(st,f,i)=>{const S=steps(lv).slice(0,i+1);
