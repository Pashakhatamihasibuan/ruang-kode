<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruang Kode · Akademi Java, Python &amp; SQL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Belajar Java, Python, dan SQL dalam bahasa Indonesia: tiga jalur terstruktur mengikuti roadmap.sh, visual interaktif, dan konsol SQL di browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: peta bab di sisi kiri (laci di ponsel) + satu kolom materi; kode Java dan Python berdampingan */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#152033; --muted:#556175; --line:#D6DDE7;
  --java:#B0441B; --java-soft:#F7E4DA; --py:#255DA2; --py-soft:#DFE9F7; --hl:#FFE39A; --hl-ink:#3A2C00;
  --ok:#22744A; --ok-soft:#DCF0E3; --bad:#B42318; --bad-soft:#FBE2DE;
  --code-bg:#101A28; --code-fg:#D9E3EF; --c-kw:#F2A65A; --c-str:#9FD79A; --c-num:#F5D76E; --c-com:#7F8EA5; --c-type:#82BAF5; --c-fn:#E3B6F5;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
code,pre,.mini,.tok,.var,.cell,.frame,svg text{font-variant-ligatures:none}
*{font-variant-ligatures:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#131B27; --sunk:#1A2432; --ink:#E4EAF2; --muted:#98A5B7; --line:#273347;
  --java:#F0915F; --java-soft:#3A2419; --py:#79ACEE; --py-soft:#172940; --hl:#5C4810; --hl-ink:#FFF2C9;
  --ok:#62C98F; --ok-soft:#133022; --bad:#F28B7B; --bad-soft:#3B1A16; --code-bg:#090F17; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#131B27; --sunk:#1A2432; --ink:#E4EAF2; --muted:#98A5B7; --line:#273347;
  --java:#F0915F; --java-soft:#3A2419; --py:#79ACEE; --py-soft:#172940; --hl:#5C4810; --hl-ink:#FFF2C9;
  --ok:#62C98F; --ok-soft:#133022; --bad:#F28B7B; --bad-soft:#3B1A16; --code-bg:#090F17; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4.2vw,2.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--py)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:5px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--py);outline-offset:2px}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* kerangka */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);
  padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font:700 .82rem/1 var(--f-mono);
  background:linear-gradient(135deg,var(--java) 0 50%,var(--py) 50% 100%);color:#fff;flex:none}
.brand b{font-family:var(--f-display);font-size:1.12rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .eyebrow{padding:0 10px 6px}
.nav a{display:flex;align-items:baseline;gap:10px;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.93rem;line-height:1.3}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--py-soft);color:var(--ink);font-weight:700}
.nav .num{font:600 .76rem var(--f-mono);color:var(--muted);min-width:1.6em}
.nav .done-mark{margin-left:auto;color:var(--ok);font-size:.8rem}
.nav-progress{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:.84rem;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--java),var(--py));width:0;transition:width .4s}
.topbar{display:none}
main{min-width:0;padding-block:34px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;transform:translateX(-102%);transition:transform .25s;
    padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.open{display:block;position:fixed;inset:0;z-index:35;background:rgba(10,15,25,.4)}
  main{padding-block:22px 70px}
}

/* tombol & input */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:.9rem;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.j{border-color:var(--java);color:var(--java)}
.btn.p{border-color:var(--py);color:var(--py)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;width:6.5em;font-size:.92rem}
select.inp{width:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* beranda */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:56ch;margin-top:14px}
.hero .cta{margin-top:20px}
.split-card{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.split-card .lbl{display:flex;font:700 .72rem var(--f-mono);letter-spacing:.06em}
.split-card .lbl span{flex:1;padding:7px 12px}
.split-card .lbl .lj{background:var(--java-soft);color:var(--java)}
.split-card .lbl .lp{background:var(--py-soft);color:var(--py)}
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lvl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lvl h3{display:flex;align-items:baseline;gap:8px}
.lvl h3 small{font:600 .74rem var(--f-mono);color:var(--muted)}
.lvl ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lvl a{display:flex;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.93rem}
.lvl a:hover{background:var(--sunk)}
.lvl a .num{font:600 .76rem var(--f-mono);color:var(--muted);min-width:1.6em;padding-top:.2em}
.lvl a.done{color:var(--muted)}
.lvl a.done::after{content:"✓";color:var(--ok);margin-left:auto}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.how div{border-top:3px solid var(--line);padding-top:10px;font-size:.93rem;color:var(--muted)}
.how b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1rem}

/* bab */
.ch-head{display:flex;flex-direction:column;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.j{border-color:transparent;background:var(--java-soft);color:var(--java)}
.tag.p{border-color:transparent;background:var(--py-soft);color:var(--py)}
.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.prose p{font-size:1.03rem}
.section{display:flex;flex-direction:column;gap:14px}
.points{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.points li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.95rem}
.tip{border-left:4px solid var(--java);background:var(--surface);padding:12px 16px;border-radius:0 10px 10px 0;font-size:.97rem}
.tip b{font-family:var(--f-display)}

.viz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.viz-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.viz-head p{color:var(--muted);font-size:.9rem}
.stage{min-height:60px;min-width:0;overflow-x:auto}
.note{font-size:.95rem;min-height:1.6em;background:var(--sunk);border-radius:8px;padding:8px 12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cnt{font:600 .78rem var(--f-mono);color:var(--muted);margin-left:auto}

/* kode */
.code-tools{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.codes.only-java .pane.python,.codes.only-python .pane.java{display:none}
.codes.only-java,.codes.only-python{grid-template-columns:minmax(0,1fr)}
.pane{border-radius:12px;overflow:hidden;background:var(--code-bg);min-width:0;display:flex;flex-direction:column}
.pane-h{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font:700 .74rem var(--f-mono);letter-spacing:.06em;color:var(--code-fg)}
.pane.java .pane-h{border-top:3px solid var(--java)}
.pane.python .pane-h{border-top:3px solid var(--py)}
.copy{background:none;border:1px solid #33435A;color:var(--code-fg);border-radius:6px;font:600 .7rem var(--f-mono);padding:3px 8px;cursor:pointer}
pre.code{margin:0;padding:12px 14px 16px;overflow-x:auto;font:13px/1.6 var(--f-mono);color:var(--code-fg);tab-size:4;flex:1}
.out{margin:0;border-top:1px dashed #33435A;padding:10px 14px;font:12.5px/1.55 var(--f-mono);color:var(--c-str);white-space:pre-wrap}
.out::before{content:"keluaran";display:block;color:var(--c-com);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.k{color:var(--c-kw)} .s{color:var(--c-str)} .n{color:var(--c-num)} .c{color:var(--c-com);font-style:italic} .t{color:var(--c-type)} .f{color:var(--c-fn)}

table.cmp{width:100%;border-collapse:collapse;font-size:.93rem;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.cmp th,.cmp td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp tr:last-child td{border-bottom:0}
.cmp th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp th.j{color:var(--java)} .cmp th.p{color:var(--py)}
.cmp td:first-child{font-weight:700;width:24%}

.terms{display:flex;flex-wrap:wrap;gap:8px}
.term-chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.88rem;cursor:pointer}
.term-chip:hover{border-color:var(--py);color:var(--py)}

.quiz{display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:.94rem}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:.92rem;color:var(--muted)}

.ch-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:20px}
.donebox{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.donebox input{width:18px;height:18px;accent-color:var(--ok)}

/* glosarium */
.gl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gl-search{flex:1 1 260px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gl.flash{border-color:var(--py);box-shadow:0 0 0 3px var(--py-soft)}
.gl h3{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.gl h3 small{font:400 .8rem var(--f-body);color:var(--muted);font-style:italic}
.gl .cat{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.gl p{font-size:.95rem}
.gl pre{margin:4px 0 0;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:8px 10px;font:12.5px/1.5 var(--f-mono);overflow-x:auto}
.gl .seen{font-size:.82rem;color:var(--muted)}
.gl .seen a{margin-right:6px}
.empty{color:var(--muted);padding:20px 0}

/* elemen visualisasi */
.lane{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.lane-name{font:700 .74rem var(--f-mono);width:64px;flex:none}
.lane-name.j{color:var(--java)} .lane-name.p{color:var(--py)}
.node{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.84rem;background:var(--bg);opacity:.45;transition:all .25s}
.node.on{opacity:1}
.node.cur{background:var(--hl);color:var(--hl-ink);border-color:transparent;opacity:1}
.arrow{color:var(--muted);font-size:.9rem}
.cells{display:flex;gap:4px;flex-wrap:nowrap;padding:18px 2px 4px}
.cell{position:relative;min-width:46px;height:46px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font:600 .95rem var(--f-mono);background:var(--bg);transition:background .25s,border-color .25s}
.cell .ix{position:absolute;top:-17px;left:0;right:0;text-align:center;font:400 .68rem var(--f-mono);color:var(--muted)}
.cell.hl{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.cell.new{border-color:var(--ok);background:var(--ok-soft)}
.cell.moved{border-color:var(--py);border-style:dashed}
.cell.dim{opacity:.35}
.cell.empty{color:var(--muted);border-style:dotted}
.cell.bad{border-color:var(--bad);background:var(--bad-soft)}
.console{background:var(--code-bg);color:var(--c-str);font:12.5px/1.55 var(--f-mono);border-radius:8px;padding:10px 12px;white-space:pre-wrap;min-height:2.6em}
.console:empty::before{content:"(belum ada keluaran)";color:var(--c-com)}
.vars{display:flex;flex-wrap:wrap;gap:8px}
.var{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:.84rem var(--f-mono);background:var(--bg)}
.var b{color:var(--py)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini{font:12.5px/1.65 var(--f-mono);background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.mini .on{background:var(--hl);color:var(--hl-ink);border-radius:3px}
.frames{display:flex;flex-direction:column-reverse;gap:6px}
.frame{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg);font:.86rem var(--f-mono);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.frame b{font-family:var(--f-body)}
.frame.top{border-color:var(--py);background:var(--py-soft)}
.frame.ret{border-color:var(--ok);background:var(--ok-soft)}
.flow{display:flex;flex-direction:column;gap:6px}
.dec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:.9rem}
.dec code{background:none;padding:0}
.dec .res{margin-left:auto;font:700 .78rem var(--f-mono)}
.dec.t{border-color:var(--ok);background:var(--ok-soft)} .dec.t .res{color:var(--ok)}
.dec.f .res{color:var(--bad)}
.dec.skip{opacity:.4}
.big{font:800 2.2rem var(--f-display)}
.tt{width:100%;border-collapse:collapse;font-size:.88rem}
.tt td,.tt th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tt code{background:none;padding:0}
.val-t{color:var(--ok);font-weight:700} .val-f{color:var(--bad);font-weight:700}
.toggle{border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;background:var(--bg);font-family:var(--f-mono);font-size:.86rem}
.die{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:7px;border:1px solid var(--line);font:700 1rem var(--f-mono);background:var(--bg)}
.die.six{background:var(--ok-soft);border-color:var(--ok)}
.tok{display:inline-block;padding:2px 7px;margin:2px;border-radius:5px;border:1px solid var(--line);font:.86rem var(--f-mono)}
.tok.used{opacity:.4}
.tok.cur{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.objs{display:flex;flex-wrap:wrap;gap:10px}
.obj{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:.88rem;display:flex;flex-direction:column;gap:6px;min-width:150px}
.obj .nm{font:700 .82rem var(--f-mono);color:var(--py)}
.blueprint{border:2px dashed var(--py);border-radius:10px;padding:10px 12px;font:.84rem var(--f-mono);background:var(--py-soft)}
.tree-cls{display:flex;flex-direction:column;align-items:center;gap:10px}
.tree-cls .kids{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cls{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:var(--f-mono);font-size:.88rem}
.cls.abs{border-style:dashed;cursor:default}
.cls[aria-pressed="true"]{border-color:var(--py);background:var(--py-soft)}
.stackq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
.stk{display:flex;flex-direction:column;gap:4px;min-height:200px;justify-content:flex-end;border:2px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:6px;max-width:180px}
.stk .cell,.que .cell{min-width:0;width:100%}
.que{display:flex;gap:4px;border-block:2px solid var(--line);padding:6px;min-height:62px;align-items:center;overflow-x:auto}
.que .cell{width:52px;flex:none}
.ll{display:flex;align-items:center;gap:0;padding:10px 2px;flex-wrap:nowrap}
.lnode{display:flex;border:2px solid var(--line);border-radius:8px;overflow:hidden;flex:none;font-family:var(--f-mono)}
.lnode span{padding:8px 10px}
.lnode span+span{border-left:2px solid var(--line);color:var(--muted);font-size:.75rem;display:grid;place-items:center}
.lnode.new{border-color:var(--ok);background:var(--ok-soft)}
.lnode.hl{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.ptr{font:.78rem var(--f-mono);color:var(--muted);padding:0 6px;flex:none}
.ptr.front{color:var(--py);font-weight:700}
svg .edge{stroke:var(--muted);stroke-width:1.5}
svg .nd{fill:var(--surface);stroke:var(--py);stroke-width:2}
svg .nd.hl{fill:var(--hl);stroke:var(--java)}
svg .nd.new{fill:var(--ok-soft);stroke:var(--ok)}
svg text{fill:var(--ink);font:600 13px var(--f-mono)}
svg .nd.hl + text{fill:var(--hl-ink)}
.buckets{display:flex;flex-direction:column;gap:4px}
.bucket{display:flex;align-items:center;gap:6px;font:.86rem var(--f-mono)}
.bucket .bi{width:34px;color:var(--muted)}
.bucket .chain{display:flex;gap:4px;flex-wrap:wrap;min-height:30px;align-items:center;border-left:2px solid var(--line);padding-left:8px}
.bucket.hit .chain{border-left-color:var(--java)}
.bucket .tok.col{border-color:var(--bad);background:var(--bad-soft)}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.barv{flex:1;max-width:56px;background:var(--sunk);border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;font:600 .8rem var(--f-mono);padding-top:4px;transition:height .3s,background .25s}
.barv.sorted{background:var(--ok-soft);color:var(--ok)}
.barv.cmp{background:var(--hl);color:var(--hl-ink)}
.barv.min{background:var(--java);color:#fff}
.pipe{display:flex;flex-direction:column;gap:8px}
.pstage{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center}
.pstage .lab{font:700 .8rem var(--f-mono);color:var(--muted)}
.log{font-size:.88rem;color:var(--muted);min-height:1.4em}
.log b{color:var(--ink)}
.err{color:var(--bad);font-weight:700}


/* topik: warna penanda anatomi (dipakai di panel kode gelap dan di daftar istilah) */
:root{--m0:#F2A65A;--m1:#7FD1F7;--m2:#A6E37F;--m3:#F28BC2;--m4:#F5D76E;--m5:#B9A3FF;--mark-ink:#0B1220}
.nav a.sub{padding-left:36px;font-size:.88rem;color:var(--muted)}
.nav a.sub[aria-current="page"]{color:var(--ink)}
.nav .cnt-s{margin-left:auto;font:600 .72rem var(--f-mono);color:var(--muted)}

.topics{display:flex;flex-direction:column;gap:16px;scroll-margin-top:70px}
.ttabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ttab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:.94rem}
.ttab span{font:600 .76rem var(--f-mono);color:var(--muted)}
.ttab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ttab[aria-selected="true"] span{color:inherit;opacity:.7}
.tbody{display:flex;flex-direction:column;gap:14px}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:box-shadow .3s,border-color .3s}
.phase.flash{border-color:var(--py);box-shadow:0 0 0 3px var(--py-soft)}
.ph-h{display:flex;gap:12px;align-items:flex-start}
.ph-n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 .92rem var(--f-display);flex:none}
.ph-h p{color:var(--muted);font-size:.92rem;margin-top:2px}

/* 1. kalimat -> kode */
.trt{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1.05fr);border-bottom:1px solid var(--line)}
.trr:last-child{border-bottom:0}
.trr.th>div{padding:7px 12px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk)}
.trr.th .j{color:var(--java)} .trr.th .p{color:var(--py)}
.trs{padding:10px 12px;font-size:.95rem;display:flex;align-items:center}
.trc{margin:0;padding:10px 12px;background:var(--code-bg);color:var(--code-fg);font:12.5px/1.55 var(--f-mono);white-space:pre-wrap;word-break:break-word;border-left:1px solid #22324A}
.ex{border:1px dashed var(--muted);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.exq{font:700 1.05rem var(--f-display);margin-top:4px}
.exo{display:flex;flex-direction:column;gap:8px}
.opt.code-opt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px}
.code-opt pre{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:7px;padding:8px 10px;font:12.5px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.code-opt pre::before,.trc[data-l]::before{content:attr(data-l);display:block;font:700 .62rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c-com)}
.trc[data-l]::before{display:none}

/* 2. anatomi */
.mk{border-bottom:2px solid var(--mc);border-radius:3px;cursor:pointer;padding:1px 0;transition:background .2s,opacity .2s}
.mk sup{display:inline-block;font:700 9px/13px var(--f-mono);min-width:13px;text-align:center;background:var(--mc);color:var(--mark-ink);border-radius:4px;margin-left:2px;vertical-align:top;position:relative;top:-1px}
.mk:hover,.mk.on{background:color-mix(in srgb,var(--mc) 26%,transparent)}
.mk.on{outline:1px solid var(--mc)}
.has-active .mk:not(.on){opacity:.4}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.legend li{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--bg);transition:border-color .2s,box-shadow .2s;min-width:0}
.legend li.on{border-color:var(--mc);box-shadow:inset 4px 0 0 var(--mc)}
.has-active .legend li:not(.on){opacity:.55}
.lg{flex:1;display:flex;gap:10px;text-align:left;background:none;border:0;padding:9px 10px;cursor:pointer;min-width:0}
.lg .badge{flex:none;width:22px;height:22px;border-radius:6px;background:var(--mc);color:var(--mark-ink);display:grid;place-items:center;font:700 .74rem var(--f-mono)}
.lg small{color:var(--muted);font-style:italic}
.lg .ld{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
.glink{flex:none;border:0;border-left:1px solid var(--line);background:none;color:var(--py);font-size:.78rem;padding:0 10px;cursor:pointer}
.glink:hover{text-decoration:underline}

/* 3. eksekusi */
.phase>.seg{align-self:flex-start}
.trhost{display:flex;flex-direction:column;gap:12px;min-width:0}
.tracer{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.tl-hint{font-weight:400;color:var(--c-num);letter-spacing:0}
.tlines{list-style:none;margin:0;padding:8px 0 12px;font:13px/1.75 var(--f-mono);color:var(--code-fg);overflow-x:auto}
.tlines li{display:flex;white-space:pre;padding-right:12px;min-width:max-content}
.tlines .ln{width:2.8em;text-align:right;padding-right:12px;color:var(--c-com);flex:none;user-select:none}
.tlines li.cur{background:rgba(245,215,110,.17);box-shadow:inset 3px 0 0 var(--c-num)}
.tlines li.cur .ln{color:var(--c-num);font-weight:600}
.tside{display:flex;flex-direction:column;gap:12px;min-width:0}
.tside .eyebrow{margin-bottom:6px}
.mem{display:flex;flex-wrap:wrap;gap:8px}
.mbox{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:7px 10px;display:flex;flex-direction:column;gap:3px;min-width:88px;max-width:100%}
.mbox.wide{flex-basis:100%}
.mbox .mh{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.mbox .mn{font:700 .84rem var(--f-mono);color:var(--py)}
.mbox .mt{font:.7rem var(--f-mono);color:var(--muted)}
.mbox .mv{font:600 1rem var(--f-mono);overflow-x:auto;min-width:0}
.mbox.chg{border-color:var(--ok);background:var(--ok-soft);animation:pop .45s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
.mempty{color:var(--muted);font:400 .86rem var(--f-body)}
.ref{display:block;font:400 .74rem var(--f-mono);color:var(--muted)}
.cells.sm{padding-top:15px;gap:3px}
.cells.sm .cell{min-width:34px;height:34px;font-size:.82rem;border-width:1.5px;padding:0 4px}
.cells.sm .cell .ix{top:-15px;font-size:.62rem;white-space:nowrap}
.cell.sorted{background:var(--ok-soft);border-color:var(--ok)}
.ofields{display:flex;flex-wrap:wrap;gap:6px;font-size:.86rem}
.ofields span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface)}
.ofields span.hl{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.ofields i{font-style:normal;color:var(--muted)}
.ll.sm{padding:4px 0;font-size:.82rem}
.ll.sm .lnode span{padding:4px 8px}
.console.fresh{box-shadow:inset 3px 0 0 var(--c-str)}

/* 4. rumus */
.rf{margin:0;background:var(--code-bg);color:var(--c-num);border-radius:10px;padding:14px 16px;font:600 1.02rem/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.rl{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.97rem}
.tnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.term-chip.in-code{border-color:var(--py);color:var(--py)}

/* kuis cerita */
.score{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.score .of{color:var(--muted);font-weight:700}
.sc-bar{flex:1 1 200px;font-size:.84rem;color:var(--muted)}
.sc-bar .bar{margin:0 0 4px}
a.chip{text-decoration:none;color:var(--ink)}
.chip[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stories{display:flex;flex-direction:column;gap:14px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.story.is-ok{border-color:var(--ok)}
.story.is-bad{border-color:var(--bad)}
.story .st{font-size:1rem;max-width:70ch}
.story .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.story .why{font-size:.92rem;color:var(--muted)}
.peek{align-self:flex-start;font-family:var(--f-mono);font-size:.82rem}
.hidebox{font-weight:400;font-size:.92rem}
.st-mode{color:var(--muted);font-size:.9rem;margin-top:-12px}
.story .more{font-size:.88rem;align-self:flex-start}
.story .codes[hidden],#pjSol[hidden]{display:none}
.pj-s{font-size:1.02rem;max-width:70ch}
.pj-tg{align-self:flex-start}
.codes.only-one{grid-template-columns:minmax(0,1fr)}
.tag.okt{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.badt{background:var(--bad-soft);color:var(--bad);border-color:transparent}

/* glosarium: tunjukkan di kode */
.show-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.show{border:1px solid var(--py);color:var(--py);background:var(--py-soft);border-radius:99px;padding:2px 10px;font-size:.8rem;cursor:pointer}
.show:hover{background:var(--py);color:#fff}
@media (max-width:760px){
  .hero,.path,.grid2,.stackq{grid-template-columns:minmax(0,1fr)}
  .how{grid-template-columns:repeat(2,minmax(0,1fr))}
  .codes,.points,.gl-list,.q .opts{grid-template-columns:minmax(0,1fr)}
  .stk{max-width:none}
  .tracer,.legend,.trr,.story .opts,.opt.code-opt{grid-template-columns:minmax(0,1fr)}
  .trr.th{display:none}
  .trc{border-left:0;border-top:1px solid #22324A}
  .trc[data-l]::before{display:block}
  .trs{font-weight:700}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== Tampilan v2: netral, tenang, satu aksen; garis rambut alih-alih kotak tebal ===== */
:root{
  --bg:#FAFAF7; --surface:#FFFFFF; --sunk:#F2F1EC; --ink:#1C1B19; --muted:#6E6B64; --line:#E7E5DF;
  --java:#B4532A; --java-soft:#F6ECE5; --py:#2E5E8C; --py-soft:#E9EFF5; --hl:#FBE7A8; --hl-ink:#3A2C00;
  --ok:#2F7A52; --ok-soft:#E7F2EB; --bad:#B23A2E; --bad-soft:#F8E8E5;
  --code-bg:#17181C; --code-fg:#DCDDE1;
  --f-display:"Inter Tight","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Instrument Serif",Georgia,serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111110; --surface:#181816; --sunk:#201F1C; --ink:#ECEAE4; --muted:#9C988F; --line:#2A2925;
  --java:#E39A73; --java-soft:#2B201A; --py:#8DB4DD; --py-soft:#1A2330; --hl:#5A4A1A; --hl-ink:#FFF3CC;
  --ok:#74C69A; --ok-soft:#16261D; --bad:#EE9488; --bad-soft:#2E1A17; --code-bg:#0C0C0B;
}}
:root[data-theme="dark"]{
  --bg:#111110; --surface:#181816; --sunk:#201F1C; --ink:#ECEAE4; --muted:#9C988F; --line:#2A2925;
  --java:#E39A73; --java-soft:#2B201A; --py:#8DB4DD; --py-soft:#1A2330; --hl:#5A4A1A; --hl-ink:#FFF3CC;
  --ok:#74C69A; --ok-soft:#16261D; --bad:#EE9488; --bad-soft:#2E1A17; --code-bg:#0C0C0B;
}
body{font:15.5px/1.7 var(--f-body);letter-spacing:-.003em}
h1{font:400 clamp(2.3rem,4.6vw,3.4rem)/1.05 var(--f-serif);letter-spacing:-.01em}
h2{font:400 1.85rem/1.15 var(--f-serif);letter-spacing:-.005em}
h3{font:600 1.02rem/1.35 var(--f-display);letter-spacing:-.01em}
.eyebrow{font:600 .7rem/1.4 var(--f-body);letter-spacing:.12em;color:var(--muted)}
code{background:var(--sunk);border-radius:4px}
a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}

/* kerangka */
.app{grid-template-columns:268px minmax(0,1fr)}
.side{background:var(--bg);border-right:1px solid var(--line);gap:26px;padding-top:28px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:.72rem}
.brand b{font:600 1rem var(--f-display);letter-spacing:-.01em}
.brand small{font-size:.74rem}
.nav-progress{border:0;padding:0 10px;font-size:.78rem}
.bar{height:3px;background:var(--line)}
.bar i{background:var(--ink)}
.nav{display:flex;flex-direction:column;gap:22px}
.nav-group{gap:1px}
.nav-group .eyebrow{padding:0 10px 8px;font-size:.66rem}
.nav a{padding:5px 10px;font-size:.88rem;border-radius:6px;color:var(--muted)}
.nav a:hover{background:transparent;color:var(--ink)}
.nav a[aria-current="page"]{background:var(--sunk);color:var(--ink);font-weight:600}
.nav .num{font-size:.7rem;color:var(--muted);opacity:.7}
.nav a.sub{padding-left:30px;font-size:.84rem}
main{padding-block:56px 110px}
.wrap{max-width:860px;gap:44px}
.topbar{background:var(--bg)}

/* tombol */
.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;font-size:.86rem;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover:not(:disabled){opacity:.88}
a.btn{color:var(--ink)} a.btn.primary{color:var(--bg)}
.seg{border-radius:999px;padding:3px;gap:2px;background:var(--sunk);border:0}
.seg button{border-radius:999px;padding:5px 14px;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip,.term-chip{border-radius:999px;font-size:.82rem;background:transparent}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* beranda */
.hero{gap:44px}
.hero p.lead{font-size:1.06rem;line-height:1.7}
.hero .cta{gap:10px}
.split-card{border:0;border-radius:var(--r);background:var(--code-bg);box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.split-card .lbl .lj,.split-card .lbl .lp{background:transparent;color:#8B8D94;border-bottom:1px solid #26272C}
.split-card .lbl .lj{color:#E39A73}.split-card .lbl .lp{color:#8DB4DD}
.how{gap:0;border-top:1px solid var(--line)}
.how div{border-top:0;padding:18px 18px 0 0;font-size:.88rem}
.how b{font:600 .95rem var(--f-display);margin-bottom:4px}
.path{gap:0;border-top:1px solid var(--line)}
.lvl{background:transparent;border:0;border-radius:0;padding:20px 20px 0 0}
.lvl h3{font:400 1.5rem var(--f-serif)}
.lvl a{font-size:.9rem;color:var(--ink)}

/* bab */
.ch-head{gap:14px}
.tag{border-radius:999px;font-size:.76rem;padding:2px 10px}
.prose p{font-size:1.02rem;line-height:1.8;color:var(--ink)}
.points{gap:0;border-top:1px solid var(--line)}
.points li{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 18px 12px 0;font-size:.93rem}
.tip{border-left:2px solid var(--ink);background:transparent;padding:4px 0 4px 18px;border-radius:0;color:var(--muted)}
.tip b{color:var(--ink);font-family:var(--f-display)}

/* kartu umum: lebih ringan */
.viz,.phase,.story,.q,.gl,.score{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:none}
.phase{padding:26px;gap:18px}
.ph-h{gap:14px;align-items:baseline}
.ph-n{width:auto;height:auto;background:none;color:var(--muted);font:400 1.5rem/1 var(--f-serif);border-radius:0}
.ph-n::after{content:"."}
.ph-h h3{font:400 1.45rem/1.2 var(--f-serif)}
.ph-h p{font-size:.88rem}
.ttabs{gap:4px;border-bottom:1px solid var(--line);padding-bottom:0}
.ttab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:10px 12px;margin-bottom:-1px;font-size:.9rem;color:var(--muted)}
.ttab:hover{color:var(--ink)}
.ttab[aria-selected="true"]{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
.ttab span{font-size:.7rem}
.ttab[aria-selected="true"] span{opacity:1;color:var(--muted)}

/* tabel kalimat -> kode */
.trt{border-radius:10px}
.trr.th>div{background:transparent;font-size:.66rem;letter-spacing:.12em;border-bottom:1px solid var(--line)}
.trs{font-size:.92rem}
.trc{border-left:1px solid #26272C}
.ex{border:0;background:var(--sunk);border-radius:10px;padding:18px}
.exq{font:400 1.35rem/1.3 var(--f-serif)}

/* opsi & kuis */
.opt{background:var(--surface);border-radius:10px;font-size:.92rem}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.code-opt{background:transparent}
.score .big{font:400 2.6rem var(--f-serif)}

/* kode */
.pane{border-radius:10px}
.pane.java .pane-h,.pane.python .pane-h{border-top:0;border-bottom:1px solid #26272C;color:#8B8D94;font-weight:600;letter-spacing:.1em;font-size:.66rem;padding:9px 14px}
.pane.java .pane-h>span:first-child::before,.pane.python .pane-h>span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:1px}
.pane.java .pane-h>span:first-child::before{background:#E39A73}
.pane.python .pane-h>span:first-child::before{background:#8DB4DD}
.copy{border-color:#2E2F35;color:#A9ABB2;border-radius:999px}
pre.code{font-size:12.8px;line-height:1.7;padding:14px 16px 18px}

/* glosarium */

/* footer bab */

}

/* tata letak v2 */
.cta{align-items:center;gap:22px!important}
.tlink{font-size:.9rem;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.tlink:hover{text-decoration-color:var(--ink)}
.ph-n{display:block}
.toc{position:sticky;top:0;z-index:15;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:-18px 0 -20px;padding:10px 0;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toc::-webkit-scrollbar{display:none}

section[id],.topics,.phase,#lab{scroll-margin-top:64px}

.steps button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;border-top:2px solid var(--line);background:none;padding:10px 0 0;font-size:.82rem;color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s}

.steps button:hover{border-top-color:var(--ink);color:var(--ink)}

.code-opt pre .k{color:var(--java)} .code-opt pre .s{color:var(--ok)} .code-opt pre .n{color:#9A6B00} .code-opt pre .t,.code-opt pre .f{color:var(--py)} .code-opt pre .c{color:var(--muted)}
.code-opt pre::before{color:var(--muted)}
.opt.code-opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.code-opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .code-opt pre .n{color:#E8C66A}}
:root[data-theme="dark"] .code-opt pre .n{color:#E8C66A}
.tnav{padding-top:4px}
@media (max-width:900px){.toc{top:calc(env(safe-area-inset-top,0px) + 57px)}}
@media (max-width:760px){.steps{grid-template-columns:repeat(5,minmax(84px,1fr));overflow-x:auto;scrollbar-width:none}.steps::-webkit-scrollbar{display:none}}
.story h3,.q b:first-child{font-weight:600}
.story h3{font:400 1.45rem/1.2 var(--f-serif)}
.donebox input{accent-color:var(--ink)}

/* ===== LMS v3: navigasi tiga jalur, halaman jalur, ruang pelajaran ===== */
:root{
  --sqlc:#1F756E; --sqlc-soft:#E3F1EF; --hh:62px; --acc:var(--ink); --acc-soft:var(--sunk);
  --g0:#F3E3D6; --g1:#DCE8F4; --g2:#DDEFE6; --g3:#F2E0EC; --g4:#F4EBCB; --g5:#E5E0F5;
  --ease:cubic-bezier(.2,.75,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sqlc:#6FC7BC; --sqlc-soft:#15272A;
  --g0:#3A2A20; --g1:#1E2C3D; --g2:#1D3328; --g3:#38223A; --g4:#3A3320; --g5:#2A2640;
}}
:root[data-theme="dark"]{
  --sqlc:#6FC7BC; --sqlc-soft:#15272A;
  --g0:#3A2A20; --g1:#1E2C3D; --g2:#1D3328; --g3:#38223A; --g4:#3A3320; --g5:#2A2640;
}
.t-java{--acc:var(--java);--acc-soft:var(--java-soft)}
.t-python{--acc:var(--py);--acc-soft:var(--py-soft)}
.t-sql{--acc:var(--sqlc);--acc-soft:var(--sqlc-soft)}
html{scroll-padding-top:calc(var(--hh) + 12px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.muted{color:var(--muted)}
.okc{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}
.btn{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.lg{padding:11px 22px;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:default}
button.tlink{background:none;border:0;padding:0;cursor:pointer}
kbd{font:600 .68rem var(--f-mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7;margin-left:2px}
section[id],.phase,.task{scroll-margin-top:calc(var(--hh) + 60px)}

/* ---------- navigasi global ---------- */
.gnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.gnav-in{max-width:1240px;margin:0 auto;height:var(--hh);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gnav .brand{justify-self:start}
.brand-mark{background:linear-gradient(135deg,var(--java),var(--py) 55%,var(--sqlc));color:#fff;font-size:.68rem;letter-spacing:.02em}
.tracks{position:relative;display:flex;gap:2px;background:var(--sunk);border-radius:999px;padding:4px}
.tracks a{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;font-size:.88rem;font-weight:500;color:var(--muted);text-decoration:none;transition:color .2s}
.tracks a:hover,.tracks a.on{color:var(--ink)}
.tracks .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block}
.ind{position:absolute;left:0;top:4px;bottom:4px;border-radius:999px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line);transition:transform .38s var(--ease),width .38s var(--ease),opacity .2s;opacity:0}
.gx{justify-self:end;display:flex;gap:4px}
.gx a{padding:6px 12px;border-radius:999px;font-size:.86rem;color:var(--muted);text-decoration:none}
.gx a:hover{color:var(--ink)}
.gx a[aria-current="page"]{color:var(--ink);background:var(--sunk);font-weight:500}
.rprog{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;pointer-events:none}
.rprog i{display:block;height:100%;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);transition:transform .1s linear}
:root[data-track="java"] .rprog i{background:var(--java)}:root[data-track="python"] .rprog i{background:var(--py)}:root[data-track="sql"] .rprog i{background:var(--sqlc)}

/* ---------- kerangka ---------- */
.shell{max-width:1240px;margin:0 auto;min-height:calc(100vh - var(--hh))}
.shell.has-ol{display:grid;grid-template-columns:288px minmax(0,1fr)}
.shell .main{min-width:0;padding-block:48px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{max-width:860px;margin:0 auto;gap:44px}
#view[data-page="home"],#view[data-page="course"]{max-width:1080px}
#view.enter>*{animation:rise .5s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}#view.enter>*:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scrim{display:block;position:fixed;inset:0;background:rgba(10,10,10,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:34}
.scrim.open{opacity:1;pointer-events:auto}
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--ink)}
.crumb span:not(:last-child){opacity:.6}

/* ---------- outline pelajaran ---------- */
.outline{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));height:calc(100vh - var(--hh) - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:24px 14px 60px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
.ol-head{display:flex;flex-direction:column;gap:10px;padding:0 6px}
.ol-t{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.ol-t b{display:block;font:600 .95rem var(--f-display)}.ol-t small{color:var(--muted);font-size:.76rem}
.ol-head .bar i{background:var(--acc)}
.ol-nav{display:flex;flex-direction:column;gap:2px}
.ol-nav details>summary{list-style:none;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:.87rem;font-weight:500}
.ol-nav summary::-webkit-details-marker{display:none}
.ol-nav summary:hover{background:var(--sunk)}
.ol-nav summary small{color:var(--muted);font:500 .72rem var(--f-mono)}
.ol-n{font:500 .72rem var(--f-mono);color:var(--muted)}
.ol-nav ol{list-style:none;margin:2px 0 8px;padding:0 0 0 18px;border-left:1px solid var(--line);margin-left:19px}
.ol-nav ol a{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:7px;font-size:.84rem;line-height:1.4;color:var(--muted);text-decoration:none}
.ol-nav ol a:hover{color:var(--ink);background:var(--sunk)}
.ol-nav ol a[aria-current="page"]{color:var(--ink);background:var(--acc-soft);font-weight:600}
.ol-nav ol a.done{color:var(--ink)}
.outline{--acc:var(--ink)}
:root[data-track="java"] .outline,:root[data-track="java"] .l-foot{--acc:var(--java);--acc-soft:var(--java-soft)}
:root[data-track="python"] .outline,:root[data-track="python"] .l-foot{--acc:var(--py);--acc-soft:var(--py-soft)}
:root[data-track="sql"] .outline,:root[data-track="sql"] .l-foot{--acc:var(--sqlc);--acc-soft:var(--sqlc-soft)}
.chk{flex:none;width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s}
a.done .chk{background:var(--acc);border-color:var(--acc)}
a.done .chk::after{content:"";width:6px;height:3px;border:solid var(--bg);border-width:0 0 1.6px 1.6px;transform:rotate(-45deg) translate(0,-1px)}
[aria-current="page"] .chk{border-color:var(--acc)}
.ol-btn{display:none}

/* ---------- tanda jalur ---------- */
.tmark{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--acc-soft);color:var(--acc);font:700 .7rem var(--f-mono)}
.tmark.lg{width:46px;height:46px;border-radius:12px;font-size:.86rem}
.ring .rb{fill:none;stroke:var(--line);stroke-width:4}
.ring .rf{fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s var(--ease)}
.tc-ring{position:relative;display:grid;place-items:center}
.tc-ring>span{position:absolute;font:600 .74rem var(--f-mono)}
.tc-ring.big>span{font:400 1.7rem var(--f-serif)}

/* ---------- beranda ---------- */
.h-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:center;padding-top:12px}
.h-copy{display:flex;flex-direction:column;gap:20px}
.h-hero h1{font-size:clamp(2.4rem,5vw,3.9rem);line-height:1.02}
.h-hero h1 em{font-style:italic}
.h-hero h1 em.j{color:var(--java)}.h-hero h1 em.p{color:var(--py)}.h-hero h1 em.s{color:var(--sqlc)}
.h-hero .lead{font-size:1.08rem;color:var(--muted);max-width:52ch}
.cta{display:flex;flex-wrap:wrap}
.h-demo{background:var(--code-bg);border-radius:16px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.45);min-width:0}
.h-tabs{display:flex;gap:2px;padding:10px 10px 0;border-bottom:1px solid #26272C}
.h-tabs button{border:0;background:none;color:#8B8D94;font:600 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:8px 12px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.h-tabs button[aria-pressed="true"]{color:#ECEAE4}
.h-tabs button.java[aria-pressed="true"]{border-color:#E39A73}.h-tabs button.python[aria-pressed="true"]{border-color:#8DB4DD}.h-tabs button.sql[aria-pressed="true"]{border-color:#6FC7BC}
.h-body{min-height:252px;display:flex;flex-direction:column}
.h-body pre.code{margin:0;font-size:13.5px;padding:20px 22px 8px;color:var(--code-fg)}
.h-body .ln{display:inline-block;animation:typein .45s var(--ease) both;animation-delay:calc(var(--d)*.22s)}
@keyframes typein{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.h-out{animation:rise .5s var(--ease) both;animation-delay:calc(var(--d)*.22s + .2s);padding:0 22px 20px}
.h-out .out{border-top:1px dashed #33343A;padding:12px 0 0}
.h-res .rt{border-color:#2A2B30;background:#1C1D21}
.h-res .rt th{color:#8B8D94;border-color:#2A2B30;background:transparent}.h-res .rt td{color:#DCDDE1;border-color:#2A2B30}
.sec-h{display:flex;flex-direction:column;gap:8px;max-width:64ch}
.sec-h p{color:var(--muted)}
.resume{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .2s,transform .2s var(--ease)}
.rcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.rc-t{flex:1;min-width:0;display:flex;flex-direction:column}
.rc-t small{color:var(--muted);font-size:.76rem}.rc-t b{font-weight:600;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-p{font:600 .8rem var(--f-mono);color:var(--acc)}
.tcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
.tcard::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--acc);transform:scaleX(.18);transform-origin:0 50%;transition:transform .5s var(--ease)}
.tcard:hover{transform:translateY(-4px);box-shadow:0 24px 50px -30px rgba(0,0,0,.35);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.tcard:hover::before{transform:scaleX(1)}
.tc-top{display:flex;justify-content:space-between;align-items:center}
.tcard h3{font:400 2.1rem/1 var(--f-serif)}
.tc-h{font-weight:600;font-size:.98rem}
.tc-d{color:var(--muted);font-size:.9rem;flex:1}
.tc-stats{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;color:var(--muted)}
.tc-stats b{color:var(--ink);font:400 1.25rem var(--f-serif);margin-right:3px}
.tc-lv{display:flex;flex-wrap:wrap;gap:6px}
.tc-lv span{font-size:.72rem;padding:2px 9px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:500}
.tc-act{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:4px}
.tcard .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.method{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.method li{padding:18px 18px 0 0;display:flex;flex-direction:column;gap:4px}
.method span{font:400 1.6rem var(--f-serif);color:var(--muted)}
.method b{font:600 .96rem var(--f-display)}.method p{font-size:.88rem;color:var(--muted)}
.advice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.advice>div{padding:18px;border-radius:var(--r);background:var(--sunk);display:flex;flex-direction:column;gap:4px}
.advice b{font-weight:600}.advice p{font-size:.9rem;color:var(--muted)}
.advice a{color:var(--ink);font-weight:600}
.more2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:6px;padding:22px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);transition:border-color .2s,transform .2s var(--ease)}

.mcard b{font:400 1.7rem var(--f-serif)}.mcard p{color:var(--muted);font-size:.9rem}

/* ---------- halaman jalur ---------- */
.c-hero{display:flex;flex-direction:column;gap:18px}
.c-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;align-items:start}
.c-grid>div:first-child{display:flex;flex-direction:column;gap:16px}
.c-hero .eyebrow a{color:var(--acc);text-decoration:none}.c-hero .eyebrow a:hover{text-decoration:underline}
.c-hero .lead{color:var(--muted);font-size:1.04rem;max-width:60ch}
.c-hero .tc-stats{border-top:0;padding:0}
.c-prog{border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface)}
.c-prog p{font-size:.88rem;color:var(--muted)}
.c-prog .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--bg);width:100%}
.c-prog small{color:var(--muted);font-size:.78rem}
.c-tools{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:-18px}
.road{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.mod{display:grid;grid-template-columns:44px minmax(0,1fr);gap:18px}
.mod-rail{position:relative;display:flex;justify-content:center}
.mod-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.mod:first-child .mod-rail::before{top:24px}.mod:last-child .mod-rail::before{bottom:calc(100% - 24px)}
.mod.full .mod-rail::before{background:var(--acc)}
.mod-dot{position:relative;margin-top:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line);font:600 .78rem var(--f-mono);color:var(--muted);transition:all .3s}
.mod.full .mod-dot{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.mod.cur .mod-dot{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 5px var(--acc-soft)}
.mod-card{margin-bottom:16px;padding:20px 22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .2s}
.mod.cur .mod-card{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.mod-top{display:flex;justify-content:space-between;align-items:center}
.mod-p{font:500 .76rem var(--f-mono);color:var(--muted)}
.mod-card h3{font:400 1.55rem/1.15 var(--f-serif)}
.mod-card>p{color:var(--muted);font-size:.92rem}
.mod-bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.mod-bar i{display:block;height:100%;background:var(--acc);transition:width .8s var(--ease)}
.mod-card summary{cursor:pointer;font-size:.86rem;font-weight:500;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
.mod-card summary::-webkit-details-marker{display:none}
.mod-card summary::before{content:"";width:7px;height:7px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);transition:transform .2s}
.mod-card details[open] summary::before{transform:rotate(45deg)}
.les-list{list-style:none;margin:4px 0 10px;padding:0;display:flex;flex-direction:column}
.les-list a{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.92rem}
.les-list a:hover{background:var(--sunk)}
.les-list a.next{background:var(--acc-soft)}
.les-list small{color:var(--muted);font-size:.74rem;white-space:nowrap;padding-top:2px}
.mod-nodes,.l-nodes{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rn{font-size:.72rem;padding:2px 8px;border-radius:6px;border:1px dashed var(--line);color:var(--muted)}
.l-nodes>span:first-child{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--i,0)*50ms)}
.rv.in{opacity:1;transform:none}

/* ---------- halaman pelajaran ---------- */
.l-top{display:flex;align-items:center;gap:12px;margin-bottom:-26px}
.l-head{display:flex;flex-direction:column;gap:14px}
.l-head .eyebrow{color:var(--acc)}
.l-meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.84rem;color:var(--muted)}
.kchip{padding:2px 10px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:500;font-size:.78rem}
.l-body{display:flex;flex-direction:column;gap:40px;min-width:0}
.l-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:26px}
.lf-done{font-size:.9rem;color:var(--muted)}
.lf-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.l-foot .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.lf-next{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);transition:border-color .2s}
.lf-next:hover{border-color:var(--acc)}
.lf-next small{color:var(--muted);font-size:.76rem}.lf-next b{font:400 1.3rem var(--f-serif)}
.toc{top:calc(env(safe-area-inset-top,0px) + var(--hh))!important}
.vizhost{display:flex;flex-direction:column;gap:14px;min-width:0}
.viz-head{flex-direction:column;align-items:flex-start;gap:4px}
.viz-head h3{font:400 1.45rem/1.2 var(--f-serif)}
.trt.one .trr{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.opt.code-opt{grid-template-columns:minmax(0,1fr)}
.runbox{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.rb-hint{font-size:.84rem;color:var(--muted)}
.console.run{animation:rise .3s var(--ease)}
.pane.tx .pane-h{border-bottom:1px solid #26272C;color:#8B8D94;font-weight:600;letter-spacing:.1em;font-size:.66rem;padding:9px 14px}
.pane.tx .pane-h>span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:1px;background:#6FC7BC}
.pane pre.code{overflow-x:auto}
.q.is-ok{border-color:var(--ok)}.q.is-bad{border-color:var(--bad)}
.task{border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px;background:var(--surface);position:relative;overflow:hidden}
.task::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--sqlc)}
.task h3{font:400 1.4rem/1.3 var(--f-serif)}
.tk-fb{padding:12px 14px;border-radius:10px;font-size:.92rem;animation:rise .3s var(--ease)}
.tk-fb.ok{background:var(--ok-soft);color:var(--ink)}.tk-fb.ok b{color:var(--ok)}
.tk-fb.bad{background:var(--bad-soft)}.tk-fb.bad b{color:var(--bad)}
#tkFb{display:flex;flex-direction:column;gap:10px}

/* ---------- konsol SQL ---------- */
.sqlab{display:flex;flex-direction:column;gap:14px}
.sl-head{display:flex;flex-direction:column;gap:6px}
.sl-head p{color:var(--muted);font-size:.9rem;max-width:66ch}
.sl-ex{display:flex;flex-wrap:wrap;gap:6px}
.sl-ex .chip{border:1px solid var(--line)}
.sl-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:start}
.sl-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.ed{position:relative;border-radius:12px;background:var(--code-bg);overflow:hidden;box-shadow:inset 0 0 0 1px #26272C}
.ed:focus-within{box-shadow:inset 0 0 0 1px #26272C,0 0 0 3px color-mix(in srgb,var(--sqlc) 40%,transparent)}
.ed pre.ed-hl,.ed textarea{margin:0;padding:16px 18px;font:13px/1.65 var(--f-mono);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;tab-size:2;letter-spacing:0;min-height:96px;border:0}
.ed pre.ed-hl{color:var(--code-fg);pointer-events:none;overflow:hidden}
.ed textarea{position:absolute;inset:0;width:100%;resize:none;background:transparent;color:transparent;caret-color:#ECEAE4;outline:none;overflow:hidden}
.ed textarea::placeholder{color:#6A6C73}
.ed textarea::selection{background:rgba(141,180,221,.35);color:transparent}
.sl-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sl-out{display:flex;flex-direction:column;gap:10px;min-width:0}
.sl-res{display:flex;flex-direction:column;gap:6px;min-width:0}
.sl-meta{display:flex;gap:14px;font:500 .74rem var(--f-mono);color:var(--muted)}
.sl-empty{font-size:.9rem;color:var(--muted);padding:12px 14px;border:1px dashed var(--line);border-radius:10px}
.sl-msg{padding:9px 14px;border-radius:10px;font-size:.9rem;background:var(--ok-soft)}
.sl-msg.warn{background:color-mix(in srgb,var(--hl) 55%,var(--surface));color:var(--ink)}
.sl-err{padding:12px 14px;border-radius:10px;background:var(--bad-soft);font-size:.9rem;border-left:3px solid var(--bad)}
.sl-err b{color:var(--bad)}
.sl-hint{margin-top:6px;color:var(--ink)}
.sl-steps{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);min-width:0}
.sl-schema{position:sticky;top:calc(var(--hh) + 64px);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;font-size:.84rem;max-height:calc(100vh - var(--hh) - 90px);overflow:auto}
.sl-schema .eyebrow{margin-bottom:6px}
.sl-schema summary{display:flex;justify-content:space-between;align-items:baseline;gap:6px;cursor:pointer;padding:3px 0}
.sl-schema summary small{color:var(--muted);font-size:.7rem}
.sc-t{border:0;background:none;padding:0;font:600 .84rem var(--f-mono);color:var(--ink);cursor:pointer;text-align:left}
.sc-t:hover{color:var(--sqlc);text-decoration:underline}
.sl-schema ul{list-style:none;margin:2px 0 8px;padding:0 0 0 8px;border-left:1px solid var(--line)}
.sl-schema li{display:flex;justify-content:space-between;gap:6px;font:.76rem var(--f-mono);padding:1px 0 1px 6px}
.sl-schema li small{color:var(--muted);font-size:.68rem;text-align:right}

/* ---------- tabel hasil ---------- */
.rt{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:100%}
.rt table{border-collapse:collapse;width:100%;font:12.5px/1.45 var(--f-mono)}
.rt th{text-align:left;font:600 .68rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap;position:sticky;top:0}
.rt td{padding:6px 12px;border-bottom:1px solid var(--line);white-space:nowrap;transition:background .3s,opacity .3s}
.rt tr:last-child td{border-bottom:0}
.rt tbody tr{transition:background .3s,opacity .3s}
.rt tr.keep td{background:var(--ok-soft)}
.rt tr.drop td{opacity:.42;text-decoration:line-through;text-decoration-color:var(--bad)}
.rt tr.cur td{background:var(--hl);color:var(--hl-ink)}
.rt tr.brk td{border-top:2px solid var(--muted)}
.rt td.lead,.rt th.lead{font:600 .74rem var(--f-body);color:var(--ink);border-right:1px solid var(--line)}
.rt tr.g0 td{background:var(--g0)}.rt tr.g1 td{background:var(--g1)}.rt tr.g2 td{background:var(--g2)}.rt tr.g3 td{background:var(--g3)}.rt tr.g4 td{background:var(--g4)}.rt tr.g5 td{background:var(--g5)}
.rt tr.cur td{background:var(--hl)!important}
.nul{font-style:normal;color:var(--muted);font-size:.72rem;letter-spacing:.06em;border:1px dashed var(--line);border-radius:4px;padding:0 4px}
.v-more{font-size:.8rem;color:var(--muted)}

/* ---------- visual v2 ---------- */
.v-q{margin:0;border-radius:10px;background:var(--code-bg);color:var(--code-fg);font-size:12.5px;line-height:1.6;padding:12px 16px;overflow-x:auto}
.v-err{padding:12px 14px;border-radius:10px;background:var(--sunk);color:var(--muted);font-size:.9rem}
.v-cap{font:600 .68rem/1.4 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.v-cap small{text-transform:none;letter-spacing:0;font-family:var(--f-mono);font-weight:400}
.v-cap.ok{color:var(--ok)}.v-cap.bad{color:var(--bad)}
.v-pipe{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:12px}
.v-pipe span{font:600 .7rem var(--f-mono);letter-spacing:.04em;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:all .35s var(--ease)}
.v-pipe span.done{color:var(--ink);border-color:var(--ink);opacity:.55}
.v-pipe span.cur{background:var(--sqlc);border-color:var(--sqlc);color:var(--bg);transform:scale(1.06)}
.v-pipe.big span.cur{background:var(--java);border-color:var(--java)}
.v-pipe i{color:var(--muted);font-style:normal;font-size:.8rem}
.v-jhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.venn{width:150px;height:auto}
.venn circle{fill:transparent;transition:fill .35s}
.venn circle.on{fill:color-mix(in srgb,var(--sqlc) 45%,transparent)}
.venn circle.ln{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.6}
.venn text{font:600 8px var(--f-body);fill:var(--muted)}
.v-jn{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(36px,.55fr) minmax(0,1fr);gap:0;margin-bottom:14px}
.v-jsvg{width:100%;height:100%;overflow:visible}
.v-jsvg path{fill:none;stroke:var(--line);stroke-width:1.5;transition:stroke .3s}
.v-jsvg path.cur{stroke:var(--sqlc);stroke-width:2.2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.v-jl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.v-jl li{display:flex;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;font:12px var(--f-mono);background:var(--surface);transition:all .3s;min-width:0;overflow:hidden;white-space:nowrap}
.v-jl li span:first-child{color:var(--muted)}
.v-jl li.used{border-color:color-mix(in srgb,var(--sqlc) 50%,var(--line))}
.v-jl li.cur{background:var(--hl);color:var(--hl-ink);border-color:transparent;transform:scale(1.03)}
.v-jl li.miss{opacity:.4;text-decoration:line-through}
.v-er{overflow-x:auto}
.v-er svg{min-width:620px;width:100%;height:auto;display:block}
.v-er .ent rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2;transition:all .3s}
.v-er .ent.cur rect{stroke:var(--sqlc);stroke-width:2;fill:var(--sqlc-soft)}
.v-er .ent.dim{opacity:.35}
.v-er .ent line{stroke:var(--line)}
.v-er .tn{font:600 13px var(--f-mono);fill:var(--ink)}
.v-er .cn{font:11.5px var(--f-mono);fill:var(--ink)}.v-er .ct{font:10px var(--f-mono);fill:var(--muted)}
.v-er .ent{transition:opacity .3s}
.v-er .rel{fill:none;stroke:var(--muted);stroke-width:1.5;transition:all .3s}
.v-er .rel.cur{stroke:var(--sqlc);stroke-width:2.6}.v-er .rel.dim{opacity:.2}
.v-ix{display:flex;flex-direction:column;gap:4px}
.v-ix .cells{flex-wrap:wrap;padding:2px 0 12px;gap:3px}
.v-ix .cell{min-width:44px;height:30px;font-size:.72rem;border-width:1.5px}
.v-ix .cell.seen{opacity:.4}
.v-ix .cell.found{background:var(--ok);color:var(--bg);border-color:transparent;animation:pop .4s}
.v-ct{margin-left:auto;font:600 .72rem var(--f-mono);color:var(--ink);letter-spacing:0;text-transform:none}
.v-acc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.v-acct{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;transition:all .35s}
.v-acct span{font-size:.78rem;color:var(--muted)}.v-acct b{font:400 1.45rem var(--f-serif)}.v-acct small{font-size:.72rem;color:var(--java)}
.v-acct.pend{border-style:dashed;border-color:var(--java);background:color-mix(in srgb,var(--hl) 35%,transparent)}
.v-acct.ok{border-color:var(--ok);background:var(--ok-soft)}
.v-acct.tot{background:var(--sunk);border-color:transparent}.v-acct.tot.bad b{color:var(--bad)}
.v-txs{font-size:.84rem;padding:6px 12px;border-radius:999px;background:var(--sunk);align-self:flex-start;display:inline-block}
.v-txs.tx{background:color-mix(in srgb,var(--hl) 60%,transparent)}.v-txs.err{background:var(--bad-soft);color:var(--bad)}.v-txs.rb,.v-txs.done{background:var(--ok-soft);color:var(--ok)}
.v-wrap{flex-wrap:wrap;border-radius:14px}
.v-iso{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.v-ist{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;transition:all .3s;min-width:0}
.v-ist.a{grid-column:1}.v-ist.b{grid-column:2}
.v-ist.cur{border-color:var(--sqlc);box-shadow:0 0 0 3px var(--sqlc-soft)}
.v-ist pre{margin:0;font-size:11.5px;padding:8px 10px;border-radius:7px;background:var(--code-bg);color:var(--code-fg);white-space:pre-wrap}
.v-res{font:600 .82rem var(--f-mono);padding:6px 10px;border-radius:8px;background:var(--sunk)}
.v-res.ok{background:var(--ok-soft);color:var(--ok)}.v-res.bad{background:var(--bad-soft);color:var(--bad)}
.v-res b{font-family:var(--f-body);font-weight:600}
.v-iso-t{margin-top:14px}
.v-iso-t tr.cur td{background:var(--sqlc-soft)}
.v-iso-t .ok{color:var(--ok);font-weight:500}.v-iso-t .bad{color:var(--bad);font-weight:500}
.v-inj-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.v-inj-f label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.v-inj-f .inp{width:100%;font:13px var(--f-mono);color:var(--ink);padding:8px 10px}
.v-inj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.v-inj>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.v-inj .v-res{font-family:var(--f-body);font-weight:400;font-size:.86rem}
.v-org{display:flex;flex-direction:column;gap:10px}
.v-lv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:12px;border:1px dashed var(--line);min-height:58px;transition:opacity .3s}
.v-lv.off{opacity:.35}
.v-lvn{font:600 .68rem var(--f-mono);color:var(--muted);width:56px}
.v-pn{display:flex;flex-direction:column;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.v-pn b{font-size:.88rem;font-weight:600}.v-pn small{font-size:.72rem;color:var(--muted)}
.v-pn.new{border-color:var(--sqlc);background:var(--sqlc-soft)}
.v-wait{color:var(--muted)}
.v-anat td,.v-anat th{transition:background .3s,box-shadow .3s}
.v-anat.s-t .rt{box-shadow:0 0 0 3px var(--sqlc)}
.v-anat.s-c .cn{background:var(--hl);color:var(--hl-ink)}
.v-anat.s-r tr.r3 td{background:var(--hl);color:var(--hl-ink)}
.v-anat.s-x td.cx{background:var(--hl);color:var(--hl-ink);box-shadow:inset 0 0 0 2px var(--java)}
.v-anat.s-pk .pk{background:var(--sqlc-soft);color:var(--sqlc);font-weight:600}
.v-anat.s-n td.cnul{background:var(--hl)}
.v-2col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.v-2col>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.v-doc{margin:0;font-size:11.5px;border-radius:9px;padding:10px 12px;background:var(--code-bg);color:var(--code-fg);transition:box-shadow .3s;overflow-x:auto}
.v-doc.cur{box-shadow:0 0 0 2px var(--sqlc)}
.hl{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.v-cast{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.v-cv{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.v-val{display:flex;flex-direction:column;align-items:center;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:84px}
.v-val b{font:600 1.05rem var(--f-mono);word-break:break-all}.v-val span{font:.7rem var(--f-mono);color:var(--muted)}
.v-val.ok{border-color:var(--ok);background:var(--ok-soft)}.v-val.warn{border-color:var(--java);background:var(--java-soft)}.v-val.bad{border-color:var(--bad);background:var(--bad-soft)}
.v-fn{font:600 .82rem var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.v-fn::after{content:"→";font-size:1.1rem;color:var(--ink)}
.v-sub{font-size:.88rem;color:var(--muted)}
.v-ladder{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.v-ladder span{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:9px;font:600 .8rem var(--f-mono)}
.v-ladder span small{font-weight:400;font-size:.64rem;color:var(--muted)}
.v-ladder span.on{border-color:var(--java);background:var(--java-soft)}
.v-ladder i{font-style:normal;color:var(--muted)}
.v-bits{display:flex;flex-direction:column;gap:6px;max-width:100%;overflow-x:auto}
.v-bits div{display:flex;flex-direction:column;gap:2px}.v-bits small{font-size:.7rem;color:var(--muted)}
.v-bits code{font-size:.7rem;letter-spacing:.06em;white-space:nowrap;background:var(--sunk)}
.v-bits .cut{opacity:.35;text-decoration:line-through}.v-bits .sign{color:var(--bad);font-weight:700}
.v-mem2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;margin-top:12px}
.v-mem2>div{min-width:0}
.v-var{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;font:.84rem var(--f-mono);margin-bottom:6px;background:var(--surface)}
.v-var b{font-weight:600}.v-var.chg{border-color:var(--ok);background:var(--ok-soft)}
.v-heap{display:flex;flex-direction:column;gap:6px}
.v-obj{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:all .35s}
.v-obj b{font:600 .84rem var(--f-mono)}.v-obj small{font-size:.74rem;color:var(--muted)}
.v-obj.dead{border-style:dashed;opacity:.55}.v-obj.mark{border-color:var(--ok);background:var(--ok-soft)}.v-obj.chg{border-color:var(--ok)}
.v-obj .cells{padding-top:16px}
.v-stack{display:flex;flex-direction:column;gap:6px}
.v-frame{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);transition:all .3s}
.v-frame.top{border-color:var(--py)}
.v-frame.throw{border-color:var(--bad);background:var(--bad-soft)}.v-frame.catch{border-color:var(--ok);background:var(--ok-soft)}
.v-frame>b{font:600 .86rem var(--f-mono)}.v-frame small{display:block;font:.74rem var(--f-mono);color:var(--bad)}
.v-lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.v-lane{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px;display:flex;flex-direction:column;min-width:0}
.v-lane .v-cap{font-family:var(--f-mono);text-transform:none;letter-spacing:0;font-size:.72rem}
.v-toks{display:flex;flex-wrap:wrap;gap:4px}
.v-toks .tok,.v-drop .tok{font-weight:600;background:var(--surface)}

 points:['<code>hasNextInt()</code> mengecek dulu sebelum <code>nextInt()</code>, supaya tidak crash.','<code>str.split()</code> memecah string berdasarkan spasi.','Menulis file: <code>PrintStream</code> di Java, <code>open(nama, "w")</code> di Python.','Isi contoh <code>nilai.txt</code>: dua baris, "Budi 85 90" dan "Sari 78 92".'],
 tip:'Buat file contoh kecil (3 sampai 5 baris) saat menguji. Setelah benar, baru coba file besar.',
 java:`import java.io.*;
import java.util.*;

public class RataRata {
    public static void main(String[] args) throws FileNotFoundException {
        Scanner file = new Scanner(new File("nilai.txt"));
        while (file.hasNextLine()) {
            String baris = file.nextLine();      // "Budi 85 90"
            Scanner token = new Scanner(baris);
            String nama = token.next();
            int total = 0, n = 0;
            while (token.hasNextInt()) {
                total += token.nextInt();
                n++;
            }
            System.out.println(nama + ": " + (double) total / n);
        }
    }
}`,

            total = 0
            for t in token[1:]:
                total += int(t)
            print(nama + ":", total / (len(token) - 1))

 body:[
  '<b>Array</b> menyimpan banyak nilai bertipe sama di bawah satu nama. Setiap elemen punya <b>indeks</b> mulai dari 0. Array 5 elemen punya indeks 0 sampai 4. Mengakses indeks 5 menghasilkan <code>ArrayIndexOutOfBoundsException</code>. Python memakai <b>list</b> yang mirip, tapi ukurannya bisa berubah.',
  'Pola paling umum adalah <b>traversal</b>: mengunjungi setiap elemen dengan loop untuk mencari maksimum, menjumlah, atau menghitung. For-each (<code>for (int x : a)</code> / <code>for x in a</code>) cocok bila kamu tidak butuh indeksnya.',
  'Array dan list adalah objek, jadi variabelnya menyimpan <b>referensi</b> (alamat), bukan isinya. <code>b = a</code> tidak menyalin isi. Keduanya menunjuk array yang sama, sehingga perubahan lewat <code>b</code> juga terlihat di <code>a</code>. Hal yang sama berlaku saat array dikirim sebagai parameter.'
 ],
 points:['Ukuran array Java tetap setelah dibuat: <code>new int[5]</code>.','Python mengizinkan indeks negatif: <code>a[-1]</code> adalah elemen terakhir.','Cetak array Java dengan <code>Arrays.toString(a)</code>, bukan <code>println(a)</code>.','Array 2D: <code>int[][] m = new int[3][4];</code>'],

 java:`import java.util.Arrays;

public class Larik {
    public static void main(String[] args) {
        int[] a = {3, 8, 1, 9, 4};
        System.out.println(a[0]);         // 3

            }
        }
        System.out.println("Maks: " + maks);

        int[] b = a;      // b menunjuk array yang SAMA
        b[0] = 99;
        System.out.println(Arrays.toString(a));
